<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miss Celebrity — 10s Vertical Product Promo</title>
  <style>
    :root {
      --porcelain: #fff8fc;
      --blush: #ffd1e7;
      --pink: #f33b96;
      --magenta: #d81b72;
      --ink: #45122f;
      --yellow: #ffd23f;
      --blue: #1c4f9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--porcelain); font-family: Arial, Helvetica, sans-serif; }
    [data-composition-id="main"] { position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; color: var(--ink); background: radial-gradient(ellipse at 73% 18%, rgba(255,255,255,.98) 0 10%, rgba(255,235,246,.78) 30%, rgba(255,209,231,.26) 51%, transparent 67%), radial-gradient(ellipse at 22% 76%, rgba(243,59,150,.30), transparent 48%), linear-gradient(160deg, #fff8fc 0%, #ffe7f3 42%, #ffc5df 100%); }
    #camera { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
    #world { position: absolute; inset: -140px; width: 1360px; height: 2200px; overflow: visible; }
    .aurora { position: absolute; border-radius: 999px; filter: blur(6px); opacity: .85; pointer-events: none; }
    .aurora.a1 { width: 980px; height: 360px; left: 330px; top: 290px; transform: rotate(-22deg); background: radial-gradient(ellipse, rgba(255,255,255,.88), rgba(243,59,150,.18) 48%, transparent 72%); }
    .aurora.a2 { width: 880px; height: 520px; left: -210px; top: 1260px; transform: rotate(16deg); background: radial-gradient(ellipse, rgba(216,27,114,.20), rgba(255,210,232,.08) 52%, transparent 73%); }
    .ribbon { position: absolute; height: 96px; border-radius: 50%; border: 13px solid rgba(255,255,255,.84); border-left-color: transparent; border-bottom-color: rgba(243,59,150,.36); box-shadow: 0 18px 45px rgba(216,27,114,.10); pointer-events: none; transform-origin: 50% 50%; }
    .ribbon.r1 { width: 740px; left: -180px; top: 420px; opacity: .78; }
    .ribbon.r2 { width: 820px; right: -300px; bottom: 380px; opacity: .60; }
    .ribbon.r3 { width: 560px; left: 540px; top: 1060px; transform: rotate(-31deg); opacity: .43; }
    .spark { position: absolute; width: 54px; height: 54px; pointer-events: none; filter: drop-shadow(0 8px 18px rgba(216,27,114,.22)); opacity: 0; }
    .spark::before, .spark::after { content: ""; position: absolute; inset: 22px 0; height: 10px; border-radius: 999px; background: currentColor; }
    .spark::after { transform: rotate(90deg); }
    .spark.s1 { left: 180px; top: 380px; color: var(--yellow); }
    .spark.s2 { right: 180px; top: 550px; color: white; }
    .spark.s3 { left: 140px; top: 1310px; color: var(--pink); }
    .spark.s4 { right: 120px; top: 1370px; color: var(--blue); }
    .spark.s5 { left: 470px; top: 220px; color: white; }
    .spark.s6 { right: 390px; bottom: 260px; color: var(--yellow); }
    #copy-intro, #copy-feature, #copy-tagline, #copy-final { position: absolute; z-index: 6; max-width: 740px; opacity: 0; }
    #copy-intro { left: 160px; top: 285px; width: 760px; text-align: center; }
    .eyebrow { margin: 0 0 18px; font-size: 28px; line-height: 1; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--magenta); }
    .title { margin: 0; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 112px; line-height: .91; font-weight: 900; letter-spacing: -.055em; color: var(--ink); text-shadow: 0 5px 0 rgba(255,255,255,.92); }
    #copy-feature { left: 345px; top: 680px; width: 250px; text-align: left; }
    #copy-feature h2 { margin: 0; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 58px; line-height: .98; letter-spacing: -.045em; font-weight: 900; }
    #copy-feature .pill { display: inline-flex; align-items: center; white-space: nowrap; margin-top: 20px; padding: 14px 20px 15px; border: 3px solid rgba(69,18,47,.15); border-radius: 999px; background: rgba(255,248,252,.86); box-shadow: 0 18px 46px rgba(121,34,79,.12); backdrop-filter: blur(10px); font-size: 21px; font-weight: 700; color: var(--magenta); }
    #copy-tagline { left: 140px; top: 1420px; width: 800px; text-align: center; }
    #copy-tagline .tag { display: inline-block; padding: 21px 34px 23px; border-radius: 999px; background: var(--ink); color: white; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 42px; line-height: 1; font-weight: 800; letter-spacing: -.025em; box-shadow: 0 22px 55px rgba(69,18,47,.22); }
    #product-wrap { position: absolute; z-index: 5; left: 215px; top: 625px; width: 650px; height: 650px; display: grid; place-items: center; transform-origin: 50% 50%; will-change: transform; }
    #product-halo { position: absolute; width: 610px; height: 610px; border-radius: 48% 52% 53% 47% / 51% 44% 56% 49%; background: radial-gradient(ellipse at 40% 35%, rgba(255,255,255,.92) 0 18%, rgba(255,209,231,.72) 38%, rgba(243,59,150,.22) 62%, transparent 75%); filter: blur(1px); box-shadow: inset 0 0 80px rgba(255,255,255,.72), 0 36px 100px rgba(216,27,114,.12); }
    #product-shadow { position: absolute; width: 475px; height: 86px; left: 88px; top: 510px; border-radius: 50%; background: radial-gradient(ellipse, rgba(82,18,52,.25) 0 18%, rgba(82,18,52,.14) 34%, rgba(82,18,52,.05) 56%, transparent 75%); filter: blur(12px); transform: skewX(-10deg); }
    #product { position: relative; z-index: 3; width: 560px; height: auto; display: block; filter: drop-shadow(0 20px 20px rgba(113,24,69,.16)) drop-shadow(0 42px 44px rgba(113,24,69,.14)); transform-origin: 50% 50%; }
    .rim { position: absolute; z-index: 2; width: 590px; height: 520px; border-radius: 90px; border: 2px solid rgba(255,255,255,.88); box-shadow: 0 0 0 12px rgba(255,255,255,.08), inset 0 0 42px rgba(255,255,255,.16); opacity: .62; transform: rotate(-4deg); }
    #copy-final { left: 120px; bottom: 205px; width: 840px; text-align: center; }
    #copy-final h3 { margin: 0; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 76px; line-height: .95; font-weight: 900; letter-spacing: -.055em; color: var(--ink); }
    #copy-final p { margin: 20px 0 0; font-size: 34px; font-weight: 700; letter-spacing: .02em; color: var(--magenta); }
    .sheen { position: absolute; z-index: 7; top: 660px; left: 265px; width: 160px; height: 540px; pointer-events: none; opacity: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.80), rgba(255,255,255,.18), transparent); filter: blur(9px); mix-blend-mode: screen; }
    #foreground-swipe { position: absolute; z-index: 12; left: -340px; top: 960px; width: 640px; height: 210px; border: 28px solid rgba(255,255,255,.92); border-right-color: rgba(243,59,150,.72); border-bottom-color: transparent; border-radius: 60% 42% 58% 46%; filter: drop-shadow(0 18px 34px rgba(216,27,114,.18)); pointer-events: none; opacity: 0; }
    .safe-vignette { position: absolute; inset: 0; z-index: 30; pointer-events: none; box-shadow: inset 0 0 160px rgba(216,27,114,.08); }
  </style>
</head>
<body>
  <div id="main" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="30">
    <div id="camera"><div id="world">
      <div class="aurora a1" data-layout-ignore></div><div class="aurora a2" data-layout-ignore></div>
      <div class="ribbon r1" data-layout-ignore></div><div class="ribbon r2" data-layout-ignore></div><div class="ribbon r3" data-layout-ignore></div>
      <div class="spark s1" data-layout-ignore></div><div class="spark s2" data-layout-ignore></div><div class="spark s3" data-layout-ignore></div><div class="spark s4" data-layout-ignore></div><div class="spark s5" data-layout-ignore></div><div class="spark s6" data-layout-ignore></div>
      <div id="copy-intro"><p class="eyebrow">A little star energy</p><h1 class="title">Miss Celebrity</h1></div>
      <div id="copy-feature"><h2>Soft<br>Contact<br>Lens</h2><div class="pill">pink pop • beauty mood</div></div>
      <div id="product-wrap"><div id="product-halo" data-layout-ignore></div><div id="product-shadow" data-layout-ignore></div><div class="rim" data-layout-ignore></div><img id="product" src="assets/product.webp" alt="Miss Celebrity soft contact lens package" crossorigin="anonymous"></div>
      <div class="sheen" data-layout-ignore></div>
      <div id="copy-tagline"><div class="tag">Cute • Stylish • Confident</div></div>
      <div id="copy-final"><h3>Miss Celebrity</h3><p>Soft Contact Lens</p></div>
      <div id="foreground-swipe" data-layout-ignore></div>
    </div></div>
    <div class="safe-vignette" data-layout-ignore></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    gsap.set(".ribbon.r1", { rotation: -18 });
    gsap.set(".ribbon.r2", { rotation: 21 });
    gsap.set("#product-halo", { rotation: -8 });
    gsap.set(".spark.s1", { rotation: 16, scale: 0.78 });
    gsap.set(".spark.s2", { rotation: 45, scale: 0.58 });
    gsap.set(".spark.s3", { rotation: 45, scale: 0.72 });
    gsap.set(".spark.s4", { rotation: 22, scale: 0.52 });
    gsap.set(".spark.s5", { rotation: 45, scale: 0.42 });
    gsap.set(".spark.s6", { rotation: 45, scale: 0.50 });
    gsap.set(".sheen", { rotation: 15, x: -420 });
    gsap.set("#foreground-swipe", { rotation: 27, x: -480 });

    const tl = gsap.timeline({ paused: true });
    tl.from("#product-wrap", { y: 170, scale: 0.72, rotation: -7, opacity: 0, duration: 1.0, ease: "back.out(1.25)" }, 0.18);
    tl.from("#product-halo", { scale: 0.45, opacity: 0, duration: 0.95, ease: "power3.out" }, 0.28);
    tl.to("#copy-intro", { opacity: 1, duration: 0.01 }, 0.34);
    tl.from("#copy-intro .eyebrow", { y: 34, opacity: 0, duration: 0.52, ease: "power2.out" }, 0.36);
    tl.from("#copy-intro .title", { y: 70, scale: 0.90, opacity: 0, duration: 0.72, ease: "expo.out" }, 0.48);
    tl.to(".spark.s1, .spark.s2, .spark.s5", { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)", stagger: 0.09 }, 0.72);
    tl.from("#camera", { scale: 0.93, y: 26, duration: 1.55, ease: "power3.out" }, 0.12);
    tl.to("#product", { rotation: 1.2, y: -10, duration: 0.32, ease: "power2.out" }, 1.28); tl.to("#product", { rotation: 0, y: 0, duration: 0.48, ease: "sine.inOut" }, 1.60);
    tl.to("#copy-intro", { opacity: 0, y: -90, duration: 0.45, ease: "power2.in" }, 2.18);
    tl.to("#camera", { x: 112, y: -105, scale: 1.12, rotation: -0.8, duration: 1.05, ease: "expo.inOut" }, 2.22);
    tl.to("#product-wrap", { x: 260, y: 86, rotation: 4, scale: 1.02, duration: 0.92, ease: "power3.inOut" }, 2.28);
    tl.to("#copy-feature", { opacity: 1, duration: 0.01 }, 2.68); tl.from("#copy-feature h2", { x: -54, opacity: 0, scale: 0.95, duration: 0.68, ease: "power4.out" }, 2.70); tl.from("#copy-feature .pill", { y: 34, opacity: 0, duration: 0.50, ease: "back.out(1.4)" }, 3.02);
    tl.to(".spark.s3, .spark.s4", { opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.10 }, 3.12);
    tl.to("#camera", { x: -68, y: -225, scale: 1.31, rotation: 0.45, duration: 0.78, ease: "power3.inOut" }, 4.48); tl.to("#product-wrap", { x: 60, y: -18, rotation: -2.5, scale: 1.13, duration: 0.82, ease: "power2.inOut" }, 4.48);
    tl.to(".sheen", { opacity: 0.86, x: 770, duration: 0.72, ease: "power2.inOut" }, 4.72); tl.to(".sheen", { opacity: 0, duration: 0.26, ease: "power2.out" }, 5.46);
    tl.to("#copy-tagline", { opacity: 1, duration: 0.01 }, 5.16); tl.from("#copy-tagline .tag", { scaleX: 0.56, y: 48, opacity: 0, duration: 0.64, ease: "back.out(1.25)" }, 5.18); tl.to("#copy-feature", { opacity: 0, y: -24, duration: 0.34, ease: "power2.in" }, 5.42);
    tl.to("#foreground-swipe", { x: 1340, opacity: 1, duration: 0.50, ease: "expo.inOut" }, 6.56); tl.to("#foreground-swipe", { opacity: 0, duration: 0.18, ease: "power2.out" }, 7.08);
    tl.to("#camera", { x: 84, y: 82, scale: 0.96, rotation: -0.35, duration: 1.18, ease: "power3.out" }, 6.72); tl.to("#product-wrap", { x: -90, y: 65, rotation: 2.2, scale: 0.94, duration: 1.08, ease: "sine.inOut" }, 6.76);
    tl.to(".ribbon.r1", { x: 110, y: -60, rotation: -10, duration: 1.20, ease: "sine.inOut" }, 6.70); tl.to(".ribbon.r2", { x: -125, y: 55, rotation: 14, duration: 1.20, ease: "sine.inOut" }, 6.70); tl.to(".spark.s6", { opacity: 1, scale: 1.1, duration: 0.45, ease: "back.out(1.7)" }, 7.40);
    tl.to("#copy-tagline", { opacity: 0, y: 34, duration: 0.34, ease: "power2.in" }, 8.22);
    tl.to("#camera", { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.78, ease: "power3.inOut" }, 8.18); tl.to("#product-wrap", { x: 0, y: -135, rotation: 0, scale: 1.06, duration: 0.82, ease: "power3.inOut" }, 8.18);
    tl.to("#copy-final", { opacity: 1, duration: 0.01 }, 8.46); tl.from("#copy-final h3", { y: 46, opacity: 0, scale: 0.94, duration: 0.52, ease: "power3.out" }, 8.48); tl.from("#copy-final p", { y: 28, opacity: 0, duration: 0.42, ease: "sine.out" }, 8.68);
    tl.to(".spark", { opacity: 0.72, scale: 0.92, duration: 0.55, ease: "sine.inOut", stagger: 0.04 }, 8.54); tl.to("#product-halo", { scale: 1.08, duration: 0.62, ease: "sine.inOut" }, 8.62); tl.to("#product-halo", { scale: 1.00, duration: 0.62, ease: "sine.inOut" }, 9.24);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
