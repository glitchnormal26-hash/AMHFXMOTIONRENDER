<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chat to Motion — Final Safe Layout</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405}
#motion{display:block;border:0;width:100vw;height:100vh}
</style>
</head>
<body>
<iframe id="motion" src="index.html?clean=1" title="Chat to Motion"></iframe>
<script>
(() => {
  const frame = document.getElementById('motion');
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  frame.addEventListener('load', () => {
    const w = frame.contentWindow;
    const d = frame.contentDocument;
    const style = d.createElement('style');
    style.textContent = `
      /* Keep gameplay proof physically outside every typography lane. */
      #miniGame { bottom: 220px !important; right: 126px !important; }
      /* Hand hotspot follows the authored cursor trajectory. */
      #cursor { margin-left: -24px !important; margin-top: -4px !important; }
    `;
    d.head.appendChild(style);

    const cursor = d.getElementById('cursor');
    cursor.innerHTML = `<svg viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg" width="64" height="76" aria-hidden="true">
      <path d="M31 4c-4.4 0-7 3.3-7 7.4v24.2l-5.6-8.2c-2.4-3.5-7.2-4.4-10.7-2-3.6 2.5-4.5 7.3-2.1 10.9l14.8 22.1C24 64 29.6 69 37.2 69h5.9C52.4 69 59 62.5 59 53.4V32c0-4.1-3.1-7.2-7.1-7.2-2.4 0-4.5 1.1-5.8 2.9v-3.5c0-4.2-3.1-7.3-7.1-7.3-2.5 0-4.6 1.1-6 3V11.4C33 7.3 35.4 4 31 4Z" fill="#f7f4e8" stroke="#07090b" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M24 35.6V17.5M33 32.5V20M46 35V27.8" fill="none" stroke="#07090b" stroke-width="3" stroke-linecap="round" opacity=".72"/>
    </svg>`;

    const applyOverrides = (t) => {
      const asset = d.getElementById('asset');
      const placeholder = d.querySelector('#composer .placeholder');
      const composer = d.getElementById('composer');
      const dropSlot = d.getElementById('dropSlot');

      let assetOpacity = 0;
      if (t >= 2.3 && t < 2.65) assetOpacity = clamp((t - 2.3) / .35);
      else if (t >= 2.65 && t < 4.55) assetOpacity = 1;
      else if (t >= 4.55 && t < 4.9) assetOpacity = 1 - clamp((t - 4.55) / .35);
      asset.style.opacity = String(assetOpacity);

      const overComposer = t >= 3.82 && t < 4.9;
      placeholder.style.opacity = overComposer ? '0' : '1';
      dropSlot.style.opacity = '0';
      const active = t >= 3.9 && t < 4.75;
      composer.style.borderColor = active ? '#d7ff45' : '#343b46';
      composer.style.boxShadow = active ? '0 0 0 2px rgba(215,255,69,.16),0 0 34px rgba(215,255,69,.12)' : 'none';
    };

    const expose = () => {
      if (!w.OPENER?.ready) return requestAnimationFrame(expose);
      window.OPENER = {
        ready: true,
        DURATION: w.OPENER.DURATION,
        seek(t) {
          w.OPENER.seek(t);
          applyOverrides(t);
        }
      };
      const t = Number(new URLSearchParams(location.search).get('t') || 0);
      window.OPENER.seek(t);
    };
    expose();
  });
})();
</script>
</body>
</html>
