<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>iOS Inspired Voice Bar — 10s</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;color:#111318}
  #viewport{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(circle at 22% 22%,rgba(174,205,255,.34),transparent 34%),
    radial-gradient(circle at 78% 68%,rgba(210,187,255,.28),transparent 31%),
    linear-gradient(145deg,#fbfcfd 0%,#f1f3f7 54%,#f8f8fa 100%)}
  #camera{position:absolute;inset:-5%;transform-origin:50% 50%;will-change:transform}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform,opacity}
  #orbA{width:30vw;height:30vw;left:5vw;top:1vh;background:rgba(128,176,255,.22)}
  #orbB{width:28vw;height:28vw;right:4vw;bottom:-3vh;background:rgba(188,146,255,.20)}
  #world{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stack{position:relative;width:min(76vw,2500px);height:min(40vh,900px);display:flex;align-items:center;justify-content:center}
  #halo{position:absolute;width:54%;height:42%;border-radius:999px;background:rgba(255,255,255,.56);filter:blur(48px);opacity:0;transform:scale(.7)}
  #card{position:relative;width:min(66vw,2180px);height:min(15vw,420px);min-height:260px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.83),rgba(255,255,255,.67));
    border:1px solid rgba(255,255,255,.85);box-shadow:0 42px 100px rgba(26,34,56,.13),0 10px 34px rgba(26,34,56,.08),inset 0 1px 0 rgba(255,255,255,.94);
    backdrop-filter:blur(38px) saturate(140%);-webkit-backdrop-filter:blur(38px) saturate(140%);
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(34px,3vw,96px);padding:clamp(28px,2.4vw,74px);padding-left:clamp(36px,3vw,96px);
    opacity:0;will-change:transform,opacity}
  #mic{width:clamp(120px,7vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;
    background:linear-gradient(160deg,#11151b,#252c35);box-shadow:0 18px 34px rgba(12,18,26,.22),inset 0 1px 1px rgba(255,255,255,.12);transform:scale(.72)}
  #mic svg{width:43%;height:43%;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #micRing{position:absolute;inset:-10%;border-radius:50%;border:2px solid rgba(77,133,255,.36);opacity:0;transform:scale(.86)}
  #content{min-width:0;display:flex;flex-direction:column;gap:clamp(22px,1.3vw,36px)}
  #meta{display:flex;align-items:center;justify-content:space-between;gap:24px}
  #label{font-size:clamp(34px,2.0vw,68px);font-weight:650;letter-spacing:-.032em;line-height:1;color:#141820;white-space:nowrap}
  #status{font-size:clamp(22px,1.15vw,40px);font-weight:560;letter-spacing:-.015em;color:rgba(23,28,38,.48);white-space:nowrap}
  #wave{height:clamp(84px,5.1vw,180px);display:flex;align-items:center;gap:clamp(7px,.52vw,18px);overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .bar{height:100%;width:clamp(6px,.35vw,13px);display:flex;align-items:center;justify-content:center}
  .bar::before{content:"";display:block;width:100%;height:24%;border-radius:999px;background:linear-gradient(180deg,#2d73ff,#6c8cff);box-shadow:0 2px 8px rgba(45,115,255,.18);transform-origin:50% 50%;transform:scaleY(.25)}
  #level{width:clamp(96px,6vw,190px);height:clamp(96px,6vw,190px);border-radius:50%;display:grid;place-items:center;
    background:rgba(246,248,252,.88);border:1px solid rgba(20,27,40,.06);box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(31,43,68,.05)}
  #dot{width:24%;aspect-ratio:1;border-radius:50%;background:#2d73ff;box-shadow:0 0 0 0 rgba(45,115,255,.25)}
  #caption{position:absolute;top:calc(50% + min(10.5vw,300px));font-size:clamp(24px,1.35vw,46px);font-weight:560;letter-spacing:-.02em;color:rgba(31,36,47,.42);opacity:0;transform:translateY(16px)}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div id="viewport">
  <div id="camera">
    <div id="orbA" class="orb"></div><div id="orbB" class="orb"></div>
    <div id="world">
      <div id="stack">
        <div id="halo"></div>
        <div id="card">
          <div id="mic">
            <div id="micRing"></div>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>
          </div>
          <div id="content">
            <div id="meta"><div id="label">Listening</div><div id="status">Voice input</div></div>
            <div id="wave"></div>
          </div>
          <div id="level"><div id="dot"></div></div>
        </div>
        <div id="caption">Speak naturally</div>
      </div>
    </div>
  </div>
  <div id="grain"></div>
</div>
<script>
(() => {
  const DURATION = 10;
  const $ = (id) => document.getElementById(id);
  const camera=$('camera'), card=$('card'), halo=$('halo'), mic=$('mic'), micRing=$('micRing'), dot=$('dot');
  const label=$('label'), status=$('status'), caption=$('caption'), orbA=$('orbA'), orbB=$('orbB'), wave=$('wave');
  const bars=[];
  for(let i=0;i<36;i++){const el=document.createElement('div');el.className='bar';wave.appendChild(el);bars.push(el);}
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const out=(t)=>1-Math.pow(1-clamp(t),3);
  const inOut=(t)=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));

  function seek(raw){
    const t=clamp(raw,0,DURATION);
    const intro=out(t/1.05);
    const outro=smooth(9.25,10,t);
    const active=smooth(.9,1.7,t)*(1-smooth(7.55,8.45,t));
    const resolve=smooth(7.5,8.55,t);

    // Camera choreography: MOVING -> TRACKING micro drift -> REFRAME -> LOCKED_INTENTIONAL settle.
    let camS=1,camX=0,camY=0,camR=0;
    if(t<2.4){const p=inOut(t/2.4);camS=lerp(1.045,1.0,p);camY=lerp(26,0,p);}
    else if(t<6.7){const p=(t-2.4)/4.3;camS=1+0.013*Math.sin(p*Math.PI);camX=18*Math.sin(p*Math.PI*1.08);camY=-10*Math.sin(p*Math.PI*.92);camR=.12*Math.sin(p*Math.PI);}
    else if(t<8.7){const p=inOut((t-6.7)/2);camS=lerp(1.012,1.058,p);camX=lerp(10,-14,p);camY=lerp(-5,8,p);}
    else {const p=inOut((t-8.7)/1.3);camS=lerp(1.058,1.018,p);camX=lerp(-14,0,p);camY=lerp(8,0,p);}
    camera.style.transform=`translate(${camX}px,${camY}px) scale(${camS}) rotate(${camR}deg)`;

    card.style.opacity=String(intro*(1-outro*.96));
    const cardS=lerp(.83,1,intro)*(1-.014*pulse(t,4.9,.52)+.018*pulse(t,7.55,.45));
    const lift=lerp(42,0,intro)-10*pulse(t,7.5,.5)+8*outro;
    card.style.transform=`translateY(${lift}px) scale(${cardS})`;
    halo.style.opacity=String(.72*intro*(1-.5*outro));
    halo.style.transform=`scale(${lerp(.66,1.12,intro)+.06*Math.sin(t*.75)})`;
    mic.style.transform=`scale(${lerp(.72,1,intro)+.035*Math.sin(t*2.6)*active})`;

    const ringEnergy=active*(.28+.72*(.5+.5*Math.sin(t*4.7)));
    micRing.style.opacity=String(.18+.42*ringEnergy);
    micRing.style.transform=`scale(${.94+ringEnergy*.18})`;
    dot.style.transform=`scale(${1+.28*ringEnergy})`;
    dot.style.boxShadow=`0 0 0 ${Math.round(16+44*ringEnergy)}px rgba(45,115,255,${.05+.08*ringEnergy})`;

    const capIn=smooth(1.0,1.7,t)*(1-smooth(6.6,7.2,t));
    caption.style.opacity=String(.62*capIn*(1-outro));
    caption.style.transform=`translateY(${lerp(16,0,capIn)}px)`;

    if(t<7.55){label.textContent='Listening';status.textContent=t<1.25?'Voice input':'Voice input';}
    else if(t<8.4){label.textContent='Finishing';status.textContent='Processing';}
    else {label.textContent='Captured';status.textContent='Ready';}
    label.style.opacity=String(1-.12*resolve);
    status.style.color=resolve?'rgba(23,28,38,.54)':'rgba(23,28,38,.48)';

    bars.forEach((el,i)=>{
      const x=i/(bars.length-1);
      const edge=Math.pow(Math.sin(Math.PI*x),.46);
      const waveA=.48+.23*Math.sin(t*7.0+i*.72)+.15*Math.sin(t*11.2-i*.38)+.10*Math.sin(t*4.2+i*1.31);
      const syll=.22+.78*clamp(.5+.5*Math.sin(t*2.18-1.0));
      const settle=1-smooth(7.75,8.75,t);
      const wake=smooth(.62,1.35,t);
      const energy=(.16 + active*.68*clamp(waveA)*syll)*edge*wake*settle;
      const resolved=.14+.03*Math.sin(i*.72);
      const h=resolve?lerp(Math.max(.08,energy),resolved,resolve):Math.max(.08,energy);
      const y=1+.04*Math.sin(t*3+i*.37)*active;
      el.firstElementChild.style.transform=`scaleY(${Math.max(.14,h*3.45)}) translateY(${y}px)`;
      el.firstElementChild.style.opacity=String(.52+.48*edge*(.4+.6*active));
    });

    orbA.style.transform=`translate(${Math.sin(t*.38)*30}px,${Math.cos(t*.31)*24}px) scale(${1+.045*Math.sin(t*.42)})`;
    orbB.style.transform=`translate(${Math.cos(t*.33)*34}px,${Math.sin(t*.27)*26}px) scale(${1+.05*Math.cos(t*.36)})`;
    orbA.style.opacity=String(.46-.18*outro);orbB.style.opacity=String(.42-.16*outro);
  }

  window.OPENER={DURATION,ready:true,seek};
  seek(0);
})();
</script>
</body>
</html>
