<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Dramatic Copyspace Background</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020104}
  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);transform-origin:center;overflow:hidden;background:#05030b}
  #gl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 68% at 57% 46%,transparent 36%,rgba(4,1,9,.22) 67%,rgba(1,0,4,.78) 100%)}
  .grain{position:absolute;inset:-20%;pointer-events:none;opacity:.045;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");transform:rotate(.001deg)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

const W=1920,H=1080,DURATION=30;
const TAU=Math.PI*2;
const stage=document.querySelector('#stage');
const canvas=document.querySelector('#gl');

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit);fit();

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05030b);
scene.fog=new THREE.FogExp2(0x08040f,0.0185);

const camera=new THREE.PerspectiveCamera(42,W/H,.1,80);
const target=new THREE.Vector3(-.25,-.15,0);

// --- deterministic setup randomness ------------------------------------------------
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(0x31A10EEN);

// --- atmospheric background --------------------------------------------------------
const bgMat=new THREE.ShaderMaterial({
  depthWrite:false,
  uniforms:{uPhase:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    varying vec2 vUv;uniform float uPhase;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.52;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+11.7;a*=.5;}return v;}
    void main(){
      vec2 uv=vUv;
      vec2 loop=vec2(cos(uPhase),sin(uPhase))*.18;
      float n=fbm(uv*3.1+loop);
      vec3 top=vec3(.019,.010,.050);
      vec3 bot=vec3(.095,.018,.115);
      vec3 c=mix(bot,top,smoothstep(.05,.92,uv.y));
      float moon=1.-smoothstep(.05,.55,distance(uv,vec2(.22,.72)));
      c+=vec3(.14,.025,.21)*moon*.22;
      c+=vec3(.05,.012,.08)*(n-.5)*.32;
      float quiet=1.-.17*(1.-smoothstep(.08,.38,abs(uv.x-.62)));
      c*=quiet;
      gl_FragColor=vec4(c,1.0);
    }`
});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(31,17.45),bgMat);
bg.position.set(0,.1,-9.8);scene.add(bg);

function fogMaterial(hex,opacity,seed){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uPhase:{value:0},uOpacity:{value:opacity},uColor:{value:new THREE.Color(hex)},uSeed:{value:seed}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`
    varying vec2 vUv;uniform float uPhase,uOpacity,uSeed;uniform vec3 uColor;
    float hash(vec2 p){return fract(sin(dot(p,vec2(41.31,289.17)))*18371.843);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.07+5.13;a*=.5;}return v;}
    void main(){
      vec2 d=vec2(cos(uPhase+uSeed),sin(uPhase+uSeed))*.24;
      float n=fbm(vUv*vec2(4.2,3.2)+d+uSeed*2.);
      n=smoothstep(.38,.82,n);
      float edge=.38+.62*smoothstep(.11,.48,abs(vUv.x-.61));
      float low=.34+.66*pow(1.-vUv.y,1.2);
      float alpha=n*edge*low*uOpacity;
      gl_FragColor=vec4(uColor*alpha,alpha);
    }`});
}
const fogLayers=[];
[
  {z:-5.6,y:-.35,s:1.00,c:0x7a1f93,o:.25,seed:.7},
  {z:-2.7,y:-1.05,s:1.10,c:0x4b146b,o:.22,seed:2.1},
  {z: 1.0,y:-1.65,s:1.18,c:0x35104f,o:.15,seed:4.4}
].forEach((f,i)=>{const m=fogMaterial(f.c,f.o,f.seed),mesh=new THREE.Mesh(new THREE.PlaneGeometry(25,10.2),m);mesh.position.set(0,f.y,f.z);mesh.scale.setScalar(f.s);mesh.renderOrder=10+i;scene.add(mesh);fogLayers.push(mesh)});

// --- light helpers -----------------------------------------------------------------
function glowTexture(inner,outer='rgba(0,0,0,0)'){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,inner);g.addColorStop(.24,inner);g.addColorStop(1,outer);x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);
}
const moonGlowTex=glowTexture('rgba(207,160,255,.95)');
const orangeGlowTex=glowTexture('rgba(255,102,16,.95)');

// moon, halo and backlight
const moonHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:moonGlowTex,color:0xb86cff,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.46}));
moonHalo.position.set(-5.45,2.45,-7.55);moonHalo.scale.set(6.2,6.2,1);scene.add(moonHalo);
const moon=new THREE.Mesh(new THREE.CircleGeometry(1.78,96),new THREE.MeshBasicMaterial({color:0xeadcff,fog:false}));
moon.position.set(-5.45,2.45,-7.4);scene.add(moon);
const moonLight=new THREE.PointLight(0x9b55ff,17,24,1.8);moonLight.position.set(-5.0,2.3,-2.5);scene.add(moonLight);
const fill=new THREE.HemisphereLight(0x7b3eb1,0x09030c,1.8);scene.add(fill);

// --- ground ------------------------------------------------------------------------
const groundMat=new THREE.MeshStandardMaterial({color:0x0a0710,roughness:.78,metalness:.08});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(42,30),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,-3.62,1.5);ground.receiveShadow=true;scene.add(ground);
const groundGlow=new THREE.PointLight(0x6f178d,13,18,2);groundGlow.position.set(-1,-1.8,3.5);scene.add(groundGlow);

// --- haunted house silhouette, kept to the left -----------------------------------
const house=new THREE.Group();house.position.set(-6.2,-2.25,-4.4);house.rotation.y=.08;scene.add(house);
const ink=new THREE.MeshStandardMaterial({color:0x070509,roughness:.96,metalness:0});
function box(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ink);m.position.set(x,y,z);m.castShadow=true;house.add(m);return m}
box(2.15,2.05,1.05,0,0,0);box(.7,2.65,.82,-1.08,.3,.04);box(.64,3.0,.76,.95,.47,.02);
function roof(x,y,w,h){const r=new THREE.Mesh(new THREE.ConeGeometry(w,h,4),ink);r.position.set(x,y,0);r.rotation.y=Math.PI/4;r.castShadow=true;house.add(r)}
roof(0,1.35,1.55,1.25);roof(-1.08,1.85,.62,1.0);roof(.95,2.05,.56,1.06);
const winMat=new THREE.MeshBasicMaterial({color:0xff6d10,fog:false});
[[-.42,.34,.57],[.37,.34,.57],[-1.08,.72,.46],[.95,1.0,.43]].forEach(([x,y,z])=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(.22,.34),winMat);w.position.set(x,y,z);house.add(w)});
const houseGlow=new THREE.PointLight(0xff5a09,6,5,2);houseGlow.position.set(0,.25,1.3);house.add(houseGlow);

// --- trees: edge framing, leaving center-right copyspace quiet ----------------------
function cylinderBetween(a,b,r0,r1,mat){const dir=new THREE.Vector3().subVectors(b,a);const len=dir.length();const g=new THREE.CylinderGeometry(r1,r0,len,7,1,false);const m=new THREE.Mesh(g,mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());m.castShadow=true;return m}
function makeTree(side,seed){
  const rr=mulberry32(seed),g=new THREE.Group();
  const treeMat=new THREE.MeshStandardMaterial({color:0x050308,roughness:1});
  function grow(start,dir,len,rad,depth){
    const end=start.clone().add(dir.clone().normalize().multiplyScalar(len));g.add(cylinderBetween(start,end,rad,rad*.68,treeMat));
    if(depth<=0)return;
    const count=depth>2?2:3;
    for(let i=0;i<count;i++){
      const d=dir.clone();
      d.x+=side*(.26+.52*rr())*(i%2?1:-.65);d.y+=.05+.34*rr();d.z+=(rr()-.5)*.28;d.normalize();
      grow(end,d,len*(.58+.11*rr()),rad*.63,depth-1);
    }
  }
  const base=new THREE.Vector3(side*8.55,-3.62,.8);
  const mainDir=new THREE.Vector3(-side*.18,.98,-.08).normalize();grow(base,mainDir,4.65,.38,4);
  g.position.z=side<0?.4:-.15;return g;
}
const treeL=makeTree(-1,99173),treeR=makeTree(1,77123);treeL.rotation.z=.022;treeR.rotation.z=-.018;scene.add(treeL,treeR);

// --- pumpkins ----------------------------------------------------------------------
function triangleGeometry(w,h){const s=new THREE.Shape();s.moveTo(-w/2,-h/2);s.lineTo(w/2,-h/2);s.lineTo(0,h/2);s.closePath();return new THREE.ShapeGeometry(s)}
function mouthGeometry(w,h){const s=new THREE.Shape();s.moveTo(-w/2,h*.18);s.lineTo(-w*.28,-h*.14);s.lineTo(-w*.08,h*.05);s.lineTo(w*.12,-h*.19);s.lineTo(w*.3,h*.04);s.lineTo(w/2,-h*.1);s.lineTo(w*.42,-h*.42);s.lineTo(w*.12,-h*.33);s.lineTo(-w*.12,-h*.43);s.lineTo(-w*.4,-h*.31);s.closePath();return new THREE.ShapeGeometry(s)}
const pumpkinMat=new THREE.MeshStandardMaterial({color:0x7c2507,roughness:.62,metalness:.02});
const grooveMat=new THREE.MeshStandardMaterial({color:0x4b1307,roughness:.8});
const stemMat=new THREE.MeshStandardMaterial({color:0x231307,roughness:.95});
function makePumpkin(x,z,s=1,rot=0){
  const g=new THREE.Group();g.position.set(x,-2.83,z);g.scale.setScalar(s);g.rotation.y=rot;
  for(let i=0;i<9;i++){const a=i/9*TAU;const lob=new THREE.Mesh(new THREE.SphereGeometry(.62,24,16),i%2?pumpkinMat:grooveMat);lob.scale.set(.76,.96,.67);lob.position.set(Math.sin(a)*.12,0,Math.cos(a)*.10);lob.castShadow=true;g.add(lob)}
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.10,.15,.45,7),stemMat);stem.position.set(.04,.72,0);stem.rotation.z=-.12;g.add(stem);
  const faceMat=new THREE.MeshBasicMaterial({color:0xff8a19,side:THREE.DoubleSide,fog:false});
  const e1=new THREE.Mesh(triangleGeometry(.26,.28),faceMat),e2=e1.clone();e1.position.set(-.24,.15,.57);e2.position.set(.24,.15,.57);g.add(e1,e2);
  const mouth=new THREE.Mesh(mouthGeometry(.70,.38),faceMat);mouth.position.set(0,-.23,.58);g.add(mouth);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:orangeGlowTex,color:0xff6812,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.58}));glow.position.set(0,-.04,.75);glow.scale.set(2.15,2.15,1);g.add(glow);
  const light=new THREE.PointLight(0xff5f08,11,7,2);light.position.set(0,-.05,1.05);g.add(light);
  scene.add(g);return {g,glow,light};
}
const pumpkins=[makePumpkin(-6.75,2.25,1.18,.04),makePumpkin(-5.15,1.6,.78,-.05),makePumpkin(7.0,2.0,1.12,-.03),makePumpkin(5.85,1.15,.68,.04)];

// --- bats, constrained to the upper framing zones ---------------------------------
function batGeometry(){const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(-.22,.12);s.lineTo(-.52,.02);s.lineTo(-.34,-.12);s.lineTo(-.08,-.05);s.lineTo(0,-.12);s.lineTo(.08,-.05);s.lineTo(.34,-.12);s.lineTo(.52,.02);s.lineTo(.22,.12);s.closePath();return new THREE.ShapeGeometry(s)}
const batMat=new THREE.MeshBasicMaterial({color:0x020105,side:THREE.DoubleSide,fog:false});
const bats=[];for(let i=0;i<8;i++){const b=new THREE.Mesh(batGeometry(),batMat);b.scale.setScalar(.22+.14*rand());b.rotation.z=(rand()-.5)*.35;scene.add(b);bats.push({mesh:b,seed:rand(),side:i<6?-1:1})}

// --- ember particles at lower edges ------------------------------------------------
const emberCount=90,emberPos=new Float32Array(emberCount*3),emberSeeds=[];
for(let i=0;i<emberCount;i++){const side=i%2?-1:1;emberSeeds.push({side,x:side*(5.2+rand()*2.9),y:-3.35+rand()*.55,z:.4+rand()*4.2,ph:rand()*TAU,k:1+Math.floor(rand()*3)});}
const emberGeo=new THREE.BufferGeometry();emberGeo.setAttribute('position',new THREE.BufferAttribute(emberPos,3));
const emberMat=new THREE.PointsMaterial({color:0xff6b14,size:.055,transparent:true,opacity:.72,depthWrite:false,blending:THREE.AdditiveBlending});
const embers=new THREE.Points(emberGeo,emberMat);scene.add(embers);

// --- render state -------------------------------------------------------------------
const tempTarget=new THREE.Vector3();
function renderFrame(t){
  const p=((t%DURATION)+DURATION)%DURATION/DURATION;
  const ph=p*TAU;

  // CAMERA_MODE = MOVING: a slow closed-loop push/reframe, clearly affecting framing.
  camera.position.set(.20*Math.sin(ph),.20+.10*Math.sin(ph*2),14.15+.48*Math.cos(ph));
  tempTarget.set(-.24+.10*Math.sin(ph),-.18+.05*Math.cos(ph*2),-.10+.08*Math.sin(ph*2));
  camera.lookAt(tempTarget);

  bgMat.uniforms.uPhase.value=ph;
  fogLayers.forEach((m,i)=>{m.material.uniforms.uPhase.value=ph*(i+1)+i*.73;m.position.x=(i-1)*.10*Math.sin(ph+i);m.position.y=(-.35-i*.60)+.10*Math.cos(ph*(i+1)+i)});

  moonHalo.material.opacity=.40+.07*Math.sin(ph*2)+.035*Math.sin(ph*5);
  moonLight.intensity=16.2+1.6*Math.sin(ph*2+.3);
  groundGlow.intensity=12.4+1.2*Math.cos(ph*3);
  houseGlow.intensity=5.5+.9*Math.sin(ph*5+.8);
  treeL.rotation.z=.022+.007*Math.sin(ph*2);treeR.rotation.z=-.018-.006*Math.sin(ph*2+.7);

  pumpkins.forEach((o,i)=>{const f=.88+.08*Math.sin(ph*3+i*.8)+.045*Math.sin(ph*7+i);o.glow.material.opacity=.47+.19*f;o.light.intensity=9.0+2.8*f;o.g.rotation.z=.005*Math.sin(ph*2+i)});

  bats.forEach((b,i)=>{
    const u=(p+b.seed)%1;
    if(b.side<0){b.mesh.position.set(-7.65+u*4.2,2.0+1.7*b.seed+.26*Math.sin(ph*4+i),-3.7+.5*Math.sin(ph*2+i));}
    else{b.mesh.position.set(8.0-u*1.9,2.75+.9*b.seed+.22*Math.sin(ph*3+i),-2.8);}
    const flap=.75+.28*Math.sin(ph*(5+i%3)+i);b.mesh.scale.y=Math.abs(flap)*(.20+.14*b.seed);b.mesh.rotation.z=.08*Math.sin(ph*2+i);
  });

  emberSeeds.forEach((s,i)=>{emberPos[i*3]=s.x+.14*Math.sin(ph*s.k+s.ph);emberPos[i*3+1]=s.y+.58*(.5+.5*Math.sin(ph*s.k+s.ph));emberPos[i*3+2]=s.z+.18*Math.cos(ph*s.k+s.ph)});emberGeo.attributes.position.needsUpdate=true;

  renderer.render(scene,camera);
}

let current=0,playing=false,raf=0,start=0;
function loop(now){if(!playing){raf=0;return;}current=((now*.001-start)%DURATION+DURATION)%DURATION;renderFrame(current);raf=requestAnimationFrame(loop)}
function play(){if(playing)return;playing=true;start=performance.now()*.001-current;if(!raf)raf=requestAnimationFrame(loop)}
function pause(){playing=false;if(raf){cancelAnimationFrame(raf);raf=0}}
function seek(t){pause();current=Math.max(0,Math.min(DURATION,Number(t)||0));renderFrame(current)}

renderFrame(0);
window.OPENER={DURATION,ready:true,seek,play,pause,get time(){return current}};

const clean=new URLSearchParams(location.search).has('clean');
if(!clean)play();
</script>
</body>
</html>
