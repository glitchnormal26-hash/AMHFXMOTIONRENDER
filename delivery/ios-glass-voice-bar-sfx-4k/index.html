<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Frosted Voice Bar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf1f7}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(145deg,#f8fbff 0%,#edf2f8 48%,#f6f3fb 100%)}
#camera{position:absolute;inset:-6%;transform-origin:50% 50%;will-change:transform}
.blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform,opacity}
#a{width:34vw;height:34vw;left:3vw;top:3vh;background:rgba(104,169,255,.34)}
#b{width:30vw;height:30vw;right:4vw;bottom:0;background:rgba(190,142,255,.26)}
#c{width:22vw;height:22vw;left:39vw;top:27vh;background:rgba(104,226,235,.17)}
#world{position:absolute;inset:0;display:grid;place-items:center}
#halo{position:absolute;width:66vw;height:19vw;border-radius:999px;background:rgba(255,255,255,.5);filter:blur(72px);opacity:0;transform:scale(.72)}
#glass{position:relative;width:min(72vw,2500px);height:min(15vw,430px);min-height:270px;border-radius:999px;overflow:hidden;opacity:0;will-change:transform,opacity;
background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.20));border:1.5px solid rgba(255,255,255,.72);box-shadow:0 52px 120px rgba(29,42,70,.16),0 12px 36px rgba(29,42,70,.09),inset 0 1px 0 rgba(255,255,255,.96),inset 0 -1px 0 rgba(255,255,255,.22);backdrop-filter:blur(52px) saturate(168%);-webkit-backdrop-filter:blur(52px) saturate(168%)}
#glass::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.60) 0%,rgba(255,255,255,.12) 21%,transparent 43%,rgba(255,255,255,.18) 65%,rgba(255,255,255,.42) 100%);mix-blend-mode:screen;opacity:.9}
#glass::after{content:"";position:absolute;left:5%;right:5%;top:4%;height:21%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.67),rgba(255,255,255,0));filter:blur(7px);opacity:.82}
#inner{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(42px,3.5vw,120px);padding:clamp(30px,2.5vw,82px) clamp(46px,3.4vw,115px);z-index:2}
#micShell{position:relative;width:clamp(122px,7.2vw,242px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(16,20,28,.94),rgba(40,46,58,.92));box-shadow:0 20px 46px rgba(17,24,38,.22),inset 0 1px 1px rgba(255,255,255,.14);transform:scale(.72)}
#micShell svg{width:44%;height:44%;stroke:#fff;stroke-width:2.15;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ring1,#ring2{position:absolute;border-radius:50%;inset:-11%;border:2px solid rgba(67,132,255,.32);opacity:0}#ring2{inset:-21%;border-color:rgba(88,154,255,.18)}
#waveWrap{height:clamp(118px,7vw,240px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,.5vw,18px);overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.bar{width:clamp(7px,.38vw,14px);height:100%;display:flex;align-items:center;--sy:.18;--op:.8}
.bar::before{content:"";display:block;width:100%;height:34%;border-radius:999px;transform:scaleY(var(--sy));opacity:var(--op);background:linear-gradient(180deg,#2b7cff,#6a8fff);box-shadow:0 3px 10px rgba(43,124,255,.19)}
#level{position:relative;width:clamp(108px,6.2vw,205px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.44),rgba(236,242,251,.22));border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 10px 28px rgba(46,63,92,.08)}
#level::before{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(46,86,160,.08)}
#dot{width:29%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#2a74ff,#6c91ff);box-shadow:0 0 0 0 rgba(54,124,255,.22)}
#sheen{position:absolute;z-index:3;pointer-events:none;width:26%;height:180%;top:-40%;left:-34%;transform:rotate(16deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.54),transparent);filter:blur(12px);opacity:0}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.035;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
</style>
</head>
<body><div id="viewport"><div id="camera"><div id="a" class="blob"></div><div id="b" class="blob"></div><div id="c" class="blob"></div><div id="world"><div id="halo"></div><div id="glass"><div id="inner"><div id="micShell"><div id="ring1"></div><div id="ring2"></div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg></div><div id="waveWrap"></div><div id="level"><div id="dot"></div></div></div><div id="sheen"></div></div></div></div><div id="grain"></div></div>
<script>
(()=>{const DURATION=10,$=id=>document.getElementById(id),camera=$('camera'),glass=$('glass'),halo=$('halo'),mic=$('micShell'),r1=$('ring1'),r2=$('ring2'),dot=$('dot'),sheen=$('sheen'),a=$('a'),b=$('b'),c=$('c'),wave=$('waveWrap');const bars=[];for(let i=0;i<44;i++){const e=document.createElement('div');e.className='bar';wave.appendChild(e);bars.push(e)}const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},out=t=>1-Math.pow(1-clamp(t),3),io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));function seek(raw){const t=clamp(raw,0,DURATION),intro=out(t/1.08),outro=smooth(9.12,10,t),active=smooth(.78,1.45,t)*(1-smooth(7.55,8.45,t)),resolve=smooth(7.72,8.7,t);let s=1,x=0,y=0,r=0;if(t<2.1){let p=io(t/2.1);s=lerp(1.055,1,p);y=lerp(30,0,p)}else if(t<6.8){let p=(t-2.1)/4.7;s=1+.012*Math.sin(p*Math.PI);x=20*Math.sin(p*Math.PI*1.05);y=-10*Math.sin(p*Math.PI*.86);r=.1*Math.sin(p*Math.PI)}else if(t<8.65){let p=io((t-6.8)/1.85);s=lerp(1.01,1.05,p);x=lerp(8,-12,p);y=lerp(-3,7,p)}else{let p=io((t-8.65)/1.35);s=lerp(1.05,1.015,p);x=lerp(-12,0,p);y=lerp(7,0,p)}camera.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;glass.style.opacity=String(intro*(1-outro*.97));glass.style.transform=`translateY(${lerp(46,0,intro)+9*outro}px) scale(${lerp(.84,1,intro)*(1+.012*pulse(t,3.4,.35)+.015*pulse(t,6.15,.38)-.01*pulse(t,8.05,.35))})`;halo.style.opacity=String(.76*intro*(1-.7*outro));halo.style.transform=`scale(${lerp(.7,1.13,intro)+.04*Math.sin(t*.65)})`;const e=active*(.3+.7*(.5+.5*Math.sin(t*4.65)));mic.style.transform=`scale(${lerp(.72,1,intro)+.032*e})`;r1.style.opacity=String(.12+.45*e);r1.style.transform=`scale(${.94+.18*e})`;r2.style.opacity=String(.08+.22*e);r2.style.transform=`scale(${.92+.31*e})`;dot.style.transform=`scale(${1+.25*e})`;dot.style.boxShadow=`0 0 0 ${Math.round(16+46*e)}px rgba(54,124,255,${.045+.07*e})`;bars.forEach((el,i)=>{const q=i/(bars.length-1),edge=Math.pow(Math.sin(Math.PI*q),.5),w=.50+.25*Math.sin(t*7.1+i*.69)+.15*Math.sin(t*11.4-i*.41)+.10*Math.sin(t*4.25+i*1.23),syll=.18+.82*clamp(.5+.5*Math.sin(t*2.2-1.0)),wake=smooth(.55,1.25,t),settle=1-smooth(7.65,8.7,t),eng=(.12+active*.75*clamp(w)*syll)*edge*wake*settle,res=.12+.025*Math.sin(i*.66),h=resolve?lerp(Math.max(.065,eng),res,resolve):Math.max(.065,eng);el.style.setProperty('--sy',String(Math.max(.12,h*3.2)));el.style.setProperty('--op',String(.42+.58*edge*(.35+.65*active)))});const sp=smooth(.55,1.38,t)*(1-smooth(2.05,2.75,t))+smooth(6.65,7.15,t)*(1-smooth(7.8,8.35,t));sheen.style.opacity=String(.42*sp*(1-outro));sheen.style.left=`${lerp(-34,112,smooth(.58,2.45,t))}%`;a.style.transform=`translate(${Math.sin(t*.34)*34}px,${Math.cos(t*.29)*26}px) scale(${1+.05*Math.sin(t*.4)})`;b.style.transform=`translate(${Math.cos(t*.31)*38}px,${Math.sin(t*.25)*28}px) scale(${1+.05*Math.cos(t*.37)})`;c.style.transform=`translate(${Math.sin(t*.27+1)*28}px,${Math.cos(t*.33)*20}px) scale(${1+.04*Math.sin(t*.35)})`;a.style.opacity=String(.52-.2*outro);b.style.opacity=String(.45-.18*outro);c.style.opacity=String(.38-.16*outro)}window.OPENER={DURATION,ready:true,seek};seek(0)})();
</script></body></html>
