const q=new URLSearchParams(location.search),dbg=$("#debug"),scrub=$("#scrub"),clock=$("#clock"),play=$("#play");if(q.has("debug"))dbg.classList.add("on");let dragging=false;gsap.ticker.add(()=>{const t=tl.time();clock.textContent=t.toFixed(2)+"s";if(!dragging)scrub.value=String((t/DURATION)*1000)});scrub.onpointerdown=()=>{dragging=true;tl.pause()};addEventListener("pointerup",()=>dragging=false);scrub.oninput=()=>window.OPENER.seek(Number(scrub.value)/1000*DURATION);play.onclick=()=>tl.paused()?tl.play():tl.pause();addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();tl.paused()?tl.play():tl.pause()}if(e.key==="r"||e.key==="R")tl.play(0)});tl.eventCallback("onComplete",()=>{if(!q.has("clean"))tl.play(0)});window.OPENER={W,H,DURATION,tl,ready:false,seek(t){const safe=Math.max(0,Math.min(DURATION,t));tl.pause();tl.time(safe,false)},play(){tl.play()}};Promise.resolve(document.fonts?.ready).then(()=>{window.OPENER.ready=true;if(!q.has("clean"))tl.play(0)});
