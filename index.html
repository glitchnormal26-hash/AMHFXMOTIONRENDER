<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Box Deluxe Greenscreen Motion</title>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{
  --green:#00ff00;
  --berry:#e51f68;
  --berry-hi:#ff5f9a;
  --berry-mid:#f03279;
  --berry-dark:#971044;
  --berry-deep:#6f0b38;
  --gold:#ffc928;
  --gold-hi:#fff06a;
  --gold-dark:#d98700;
  --blue:#2d8cff;
  --cyan:#42d9ff;
  --orange:#ff7a26;
  --violet:#7b5cff;
  --white:#ffffff;
  --ink:#3b1745;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green)}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  position:fixed;left:50%;top:50%;
  width:3840px;height:2160px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;overflow:hidden;background:var(--green)
}
#world{
  position:absolute;inset:0;overflow:hidden;background:var(--green);
  transform-origin:50% 58%;will-change:transform
}
#giftRig{
  position:absolute;left:1920px;top:1160px;width:0;height:0;
  transform-origin:0 250px;will-change:transform
}
#giftCore{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 220px;will-change:transform}
#floorMark{
  position:absolute;left:-590px;top:455px;width:1180px;height:150px;border-radius:50%;
  background:var(--ink);transform-origin:center;will-change:transform
}
#bodyFront{
  position:absolute;left:-470px;top:-105px;width:940px;height:610px;
  border-radius:46px 46px 70px 70px;
  background:linear-gradient(180deg,var(--berry-hi) 0%,var(--berry-mid) 20%,var(--berry) 56%,var(--berry-dark) 100%);
  border:16px solid var(--berry-deep);overflow:hidden
}
#bodyFront:before{
  content:"";position:absolute;left:38px;right:38px;top:48px;height:74px;
  border-radius:999px;background:#ff8fba;transform:skewY(-2deg)
}
#bodyTop{
  position:absolute;left:-470px;top:-198px;width:940px;height:120px;
  background:linear-gradient(180deg,#ff89bb,var(--berry-mid));
  clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);
  border-bottom:12px solid #a71050
}
#bodySide{
  position:absolute;left:470px;top:-78px;width:132px;height:548px;
  background:linear-gradient(180deg,#b71658,var(--berry-deep));
  clip-path:polygon(0 0,100% 10%,100% 91%,0 100%)
}
.ribbonV{
  position:absolute;left:50%;top:0;bottom:0;width:176px;translate:-50% 0;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold-hi) 46%,var(--gold) 66%,var(--gold-dark))
}
.ribbonH{
  position:absolute;left:0;right:0;top:248px;height:138px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 56%,var(--gold-dark))
}
#bodyBadge{
  position:absolute;left:95px;top:408px;width:168px;height:70px;border-radius:999px;
  background:var(--white);transform:rotate(-4deg)
}
#bodyBadge:after{
  content:"";position:absolute;left:42px;top:24px;width:84px;height:22px;border-radius:999px;background:var(--berry)
}
#lid{
  position:absolute;left:0;top:-310px;width:0;height:0;
  transform-origin:-355px 176px;will-change:transform
}
#lidFront{
  position:absolute;left:-535px;top:0;width:1070px;height:190px;
  border-radius:42px;background:linear-gradient(180deg,#ff70aa,var(--berry-mid) 52%,#b51158);
  border:16px solid var(--berry-deep);overflow:hidden
}
#lidFront:before{
  content:"";position:absolute;left:60px;top:28px;width:295px;height:28px;border-radius:99px;background:#ff9fc2
}
#lidTop{
  position:absolute;left:-535px;top:-105px;width:1070px;height:126px;
  background:linear-gradient(180deg,#ffa2c9,#ff4e91 70%);
  clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
  border-bottom:12px solid #a71050
}
#lid .ribbonV{left:50%;top:-105px;height:295px;bottom:auto;width:194px}
#lid .ribbonH{top:52px;height:96px}
#bow{position:absolute;left:0;top:-188px;width:0;height:0;will-change:transform}
.bowLoop{
  position:absolute;top:-78px;width:335px;height:192px;border:50px solid var(--gold);
  background:var(--orange);box-shadow:inset 0 0 0 14px var(--gold-hi);
  will-change:transform
}
#bowLeft{left:-336px;border-radius:68% 38% 62% 44%;transform-origin:100% 62%;transform:rotate(-20deg)}
#bowRight{left:0;border-radius:38% 68% 44% 62%;transform-origin:0 62%;transform:rotate(20deg)}
#knot{
  position:absolute;left:-96px;top:-46px;width:192px;height:170px;border-radius:52% 48% 55% 45%;
  background:radial-gradient(circle at 36% 28%,var(--gold-hi),var(--gold) 50%,var(--gold-dark));
  border:12px solid #bf7600;will-change:transform
}
#tailLeft,#tailRight{
  position:absolute;top:76px;width:126px;height:270px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold),var(--gold-dark));
  clip-path:polygon(0 0,100% 8%,82% 100%,50% 82%,18% 100%);transform-origin:50% 0
}
#tailLeft{left:-136px;transform:rotate(14deg)}
#tailRight{left:10px;transform:rotate(-14deg)}

#revealDisc{
  position:absolute;left:-360px;top:-630px;width:720px;height:720px;border-radius:50%;
  background:var(--gold-hi);border:38px solid var(--white);
  transform:scale(0);visibility:hidden;will-change:transform
}
#revealDisc:after{
  content:"";position:absolute;left:118px;top:118px;width:408px;height:408px;border-radius:50%;
  border:54px solid var(--gold);background:var(--white)
}
.ray{
  position:absolute;left:-20px;top:-500px;width:40px;height:320px;border-radius:999px;
  background:var(--white);transform-origin:50% 500px;visibility:hidden;will-change:transform
}
.ray.gold{background:var(--gold-hi)}
#ray1{transform:rotate(-72deg)} #ray2{transform:rotate(-48deg)} #ray3{transform:rotate(-24deg)}
#ray4{transform:rotate(24deg)} #ray5{transform:rotate(48deg)} #ray6{transform:rotate(72deg)}
#burstRoot{position:absolute;left:0;top:-245px;width:0;height:0;pointer-events:none}
.particle{
  position:absolute;left:0;top:0;visibility:hidden;will-change:transform
}
.particle.dot{width:58px;height:58px;border-radius:50%;background:var(--white);border:9px solid var(--orange)}
.particle.diamond{
  width:84px;height:84px;background:var(--blue);border:9px solid var(--white);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)
}
.particle.star{
  width:118px;height:118px;background:var(--gold-hi);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 56%,79% 94%,50% 72%,21% 94%,32% 56%,2% 35%,39% 35%)
}
.particle.confetti{width:38px;height:158px;border-radius:18px;background:var(--orange)}
.particle.confetti.blue{background:var(--blue)}
.particle.confetti.pink{background:#ff94c3}
.particle.confetti.violet{background:var(--violet)}
.particle.streamer{
  width:64px;height:220px;border-radius:99px;background:var(--cyan);
  clip-path:polygon(0 0,100% 0,70% 25%,100% 50%,70% 75%,100% 100%,0 100%,30% 75%,0 50%,30% 25%)
}
.particle.streamer.gold{background:var(--gold)}
.particle.streamer.pink{background:#ff7eb2}
.ring{
  position:absolute;left:-560px;top:440px;width:1120px;height:190px;border:38px solid var(--white);
  border-radius:50%;transform:scale(.25);visibility:hidden;will-change:transform,border-width
}
#closeRing{border-color:var(--gold-hi)}
#poofRing{left:-650px;top:-40px;width:1300px;height:420px;border-color:var(--white)}
.spark{
  position:absolute;width:42px;height:230px;border-radius:999px;background:var(--white);
  left:-21px;top:-360px;transform-origin:50% 470px;visibility:hidden;will-change:transform
}
#sparkB{transform:rotate(90deg)} #sparkC{transform:rotate(45deg)} #sparkD{transform:rotate(-45deg)}

#debug{
  display:none;position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:20;
  gap:16px;align-items:center;padding:16px 22px;border-radius:16px;background:#111;color:#fff;
  font:20px Arial,sans-serif
}
#debug.on{display:flex}
#debug input{width:700px}
#clock{min-width:8ch;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="giftRig">
      <div id="floorMark"></div>
      <div class="ring" id="impactRing"></div>
      <div class="ring" id="closeRing"></div>
      <div class="ring" id="poofRing"></div>
      <div id="revealDisc"></div>
      <div id="ray1" class="ray"></div><div id="ray2" class="ray gold"></div><div id="ray3" class="ray"></div>
      <div id="ray4" class="ray gold"></div><div id="ray5" class="ray"></div><div id="ray6" class="ray gold"></div>
      <div id="burstRoot"></div>
      <div id="giftCore">
        <div id="bodyTop"></div>
        <div id="bodySide"></div>
        <div id="bodyFront">
          <div class="ribbonV"></div><div class="ribbonH"></div><div id="bodyBadge"></div>
        </div>
        <div id="lid">
          <div id="lidTop"></div>
          <div id="lidFront"></div>
          <div class="ribbonV"></div><div class="ribbonH"></div>
          <div id="bow">
            <div class="bowLoop" id="bowLeft"></div><div class="bowLoop" id="bowRight"></div>
            <div id="tailLeft"></div><div id="tailRight"></div><div id="knot"></div>
          </div>
        </div>
      </div>
      <div id="sparkA" class="spark"></div><div id="sparkB" class="spark"></div>
      <div id="sparkC" class="spark"></div><div id="sparkD" class="spark"></div>
    </div>
  </div>
</div>

<div id="debug">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const W=3840,H=2160,DURATION=10;
const $=s=>document.querySelector(s);
const stage=$("#stage");
const fit=()=>{
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
};
addEventListener("resize",fit);fit();

const particleData=[
  ["star",-900,-980,-180,-75,0.00,1.05],["diamond",-690,-1120,-120,130,0.05,.95],
  ["dot",-450,-1240,-90,-120,0.11,.92],["confetti blue",-230,-1080,-40,260,0.16,1.02],
  ["star",100,-1210,-130,96,0.08,.98],["confetti pink",330,-1140,-50,-230,0.14,1.06],
  ["diamond",590,-1020,-90,210,0.03,.94],["dot",850,-880,-180,-140,0.18,.90],
  ["confetti",-1020,-650,120,360,0.07,.90],["diamond",1030,-620,80,-280,0.15,.96],
  ["dot",-760,-760,170,150,0.20,.86],["star",760,-790,130,-155,0.10,.92],
  ["confetti pink",-520,-930,200,300,0.23,.92],["confetti violet",540,-900,180,-330,0.25,.96],
  ["diamond",-275,-860,230,190,0.27,.82],["dot",295,-840,250,-135,0.29,.82],
  ["star",-1110,-400,260,215,0.22,.82],["star",1090,-380,240,-195,0.26,.82],
  ["streamer gold",-670,-690,300,345,0.18,.92],["streamer pink",670,-720,300,-330,0.20,.92],
  ["confetti blue",-360,-680,360,480,0.31,.78],["confetti",390,-650,340,-430,0.33,.78],
  ["dot",-120,-740,410,160,0.35,.72],["diamond",145,-720,420,-150,0.36,.72]
];
const burst=$("#burstRoot");
particleData.forEach(([cls])=>{
  const el=document.createElement("div");
  el.className=`particle ${cls}`;
  burst.appendChild(el);
});
const particles=[...document.querySelectorAll(".particle")];
const rays=[...document.querySelectorAll(".ray")];
const sparks=[...document.querySelectorAll(".spark")];

const tl=gsap.timeline({paused:true,defaults:{overwrite:false}});

// Deterministic initial state. Nothing uses per-frame randomness or independent clocks.
tl.set("#world",{scale:.965,y:18},0);
tl.set("#giftRig",{y:-1800,rotation:-11,scale:.92},0);
tl.set("#giftCore",{scaleX:1,scaleY:1,y:0},0);
tl.set("#lid",{x:0,y:0,rotation:0,scale:1},0);
tl.set("#floorMark",{scaleX:.42,scaleY:.35},0);
tl.set("#revealDisc",{scale:0,visibility:"hidden"},0);
tl.set(".ray",{scaleY:.15,visibility:"hidden"},0);
tl.set(".particle",{scale:.2,visibility:"hidden"},0);
tl.set(".ring",{scale:.24,borderWidth:38,visibility:"hidden"},0);
tl.set(".spark",{scaleY:.2,visibility:"hidden"},0);

// HOOK — heavy drop with a camera-equivalent settle.
tl.to("#giftRig",{y:0,rotation:1.8,duration:.72,ease:"power3.in"},0);
tl.to("#world",{scale:1.0,y:0,duration:.84,ease:"power2.out"},0);

// IMPACT — body compresses first, bow and lid react a beat later.
tl.set("#impactRing",{visibility:"visible"},.71);
tl.to("#impactRing",{scale:1.38,borderWidth:0,duration:.43,ease:"power3.out"},.71);
tl.set("#impactRing",{visibility:"hidden"},1.15);
tl.to("#floorMark",{scaleX:1.0,scaleY:1,duration:.14,ease:"power4.out"},.69);
tl.to("#giftCore",{scaleX:1.105,scaleY:.80,y:32,duration:.11,ease:"power2.out"},.72);
tl.to("#lid",{y:42,rotation:2.2,duration:.11,ease:"power2.out"},.73);
tl.to("#bow",{scaleX:1.11,scaleY:.79,duration:.11,ease:"power2.out"},.74);
tl.to("#giftRig",{y:-165,rotation:-2.2,duration:.27,ease:"power2.out"},.84);
tl.to("#giftCore",{scaleX:.965,scaleY:1.07,y:-20,duration:.24,ease:"power2.out"},.84);
tl.to("#lid",{y:-18,rotation:-1.4,duration:.22,ease:"power2.out"},.85);
tl.to("#bow",{scaleX:.96,scaleY:1.08,duration:.23,ease:"back.out(1.8)"},.85);
tl.to("#floorMark",{scaleX:.72,scaleY:.70,duration:.26,ease:"power2.out"},.86);
tl.to("#giftRig",{y:0,rotation:0,duration:.40,ease:"power2.inOut"},1.12);
tl.to("#giftCore",{scaleX:1,scaleY:1,y:0,duration:.32,ease:"power2.out"},1.10);
tl.to("#lid",{y:0,rotation:0,duration:.32,ease:"power2.out"},1.10);
tl.to("#bow",{scaleX:1,scaleY:1,duration:.30,ease:"power2.out"},1.10);
tl.to("#floorMark",{scaleX:.86,scaleY:.82,duration:.34,ease:"power2.out"},1.10);

// ANTICIPATION — ribbon behaves like elastic material before the lid opens.
tl.to("#bowLeft",{rotation:-36,scaleX:1.15,scaleY:.90,duration:.26,ease:"power3.out"},1.74);
tl.to("#bowRight",{rotation:36,scaleX:1.15,scaleY:.90,duration:.26,ease:"power3.out"},1.74);
tl.to("#knot",{scale:1.14,y:-20,duration:.22,ease:"back.out(2)"},1.80);
tl.to("#tailLeft",{rotation:26,duration:.30,ease:"power2.out"},1.84);
tl.to("#tailRight",{rotation:-26,duration:.30,ease:"power2.out"},1.84);
tl.to("#giftRig",{rotation:-1.3,duration:.16,ease:"power2.out"},2.20);
tl.to("#giftRig",{rotation:1.1,duration:.13,ease:"power2.inOut"},2.36);
tl.to("#giftRig",{rotation:0,duration:.15,ease:"power2.out"},2.49);
tl.to("#lid",{rotation:-2.8,y:-18,duration:.12,ease:"power2.out"},2.28);
tl.to("#lid",{rotation:2.4,y:5,duration:.11,ease:"power2.inOut"},2.40);
tl.to("#lid",{rotation:-1.1,y:-8,duration:.11,ease:"power2.inOut"},2.51);
tl.to("#lid",{rotation:0,y:0,duration:.14,ease:"power2.out"},2.62);

// REVEAL — compression, lid relay, then a short camera push.
tl.to("#giftCore",{y:40,scaleY:.95,duration:.18,ease:"power2.in"},2.72);
tl.to("#lid",{y:-18,duration:.18,ease:"power2.in"},2.72);
tl.to("#world",{scale:1.045,y:-12,duration:.46,ease:"power2.inOut"},2.84);
tl.to("#lid",{y:-520,x:92,rotation:9,scale:1.025,duration:.60,ease:"back.out(1.3)"},2.90);
tl.to("#giftCore",{y:0,scaleY:1,duration:.40,ease:"power3.out"},2.96);

tl.set("#revealDisc",{visibility:"visible"},3.02);
tl.to("#revealDisc",{scale:.92,duration:.28,ease:"back.out(1.7)"},3.02);
tl.to("#revealDisc",{scale:.66,duration:.44,ease:"power2.out"},3.30);
rays.forEach((el,i)=>{
  const t=3.06+i*.018;
  tl.set(el,{visibility:"visible"},t);
  tl.to(el,{scaleY:1.0,duration:.23,ease:"power4.out"},t);
  tl.to(el,{scaleY:.18,duration:.34,ease:"power3.in"},t+.32);
  tl.set(el,{visibility:"hidden"},t+.67);
});

// Burst trajectories are authored data, not Math.random().
particles.forEach((el,i)=>{
  const [,dx,peakY,endY,rot,delay,s]=particleData[i];
  const t=3.18+delay;
  tl.set(el,{visibility:"visible"},t);
  tl.to(el,{x:dx*.50,y:peakY,scale:s,rotation:rot*.35,duration:.42,ease:"power4.out"},t);
  tl.to(el,{x:dx,y:endY+520,scale:s*.76,rotation:rot,duration:1.48,ease:"power2.in"},t+.38);
  tl.set(el,{visibility:"hidden"},t+1.88);
});

// OPEN POSE — lid has follow-through, box breathes, camera settles for readability.
tl.to("#lid",{y:-590,x:150,rotation:13,duration:.43,ease:"power2.inOut"},3.58);
tl.to("#lid",{y:-540,x:118,rotation:7,duration:.64,ease:"power2.inOut"},4.01);
tl.to("#bowLeft",{rotation:-27,scaleX:1.05,scaleY:1,duration:.48,ease:"power2.out"},3.70);
tl.to("#bowRight",{rotation:27,scaleX:1.05,scaleY:1,duration:.48,ease:"power2.out"},3.70);
tl.to("#knot",{scale:1,y:0,duration:.44,ease:"power2.out"},3.72);
tl.to("#world",{scale:1.018,y:0,duration:.68,ease:"power2.out"},3.70);
tl.to("#revealDisc",{scale:.36,duration:.68,ease:"power2.inOut"},3.74);
tl.set("#revealDisc",{visibility:"hidden"},4.44);
tl.to("#lid",{rotation:4.5,y:-552,x:108,duration:.58,ease:"sine.inOut"},4.90);
tl.to("#giftRig",{rotation:-1.1,y:-12,duration:.44,ease:"sine.inOut"},5.00);
tl.to("#giftRig",{rotation:0,y:0,duration:.44,ease:"sine.inOut"},5.44);

// CLOSE — lid anticipates upward, returns fast, body receives the collision.
tl.to("#lid",{y:-625,x:138,rotation:11,duration:.24,ease:"power2.out"},5.98);
tl.to("#world",{scale:.99,y:12,duration:.50,ease:"power2.inOut"},6.08);
tl.to("#lid",{y:0,x:0,rotation:0,scale:1,duration:.48,ease:"power4.in"},6.23);
tl.set("#closeRing",{visibility:"visible"},6.70);
tl.to("#closeRing",{scale:1.28,borderWidth:0,duration:.40,ease:"power3.out"},6.70);
tl.set("#closeRing",{visibility:"hidden"},7.11);
tl.to("#giftCore",{scaleX:1.075,scaleY:.85,y:20,duration:.10,ease:"power2.out"},6.70);
tl.to("#floorMark",{scaleX:1.03,scaleY:1.08,duration:.11,ease:"power3.out"},6.70);
tl.to("#bow",{scaleX:1.09,scaleY:.84,duration:.10,ease:"power2.out"},6.71);
tl.to("#giftCore",{scaleX:.98,scaleY:1.055,y:-18,duration:.22,ease:"power2.out"},6.80);
tl.to("#giftCore",{scaleX:1,scaleY:1,y:0,duration:.28,ease:"power2.inOut"},7.02);
tl.to("#bow",{scaleX:1,scaleY:1,duration:.28,ease:"back.out(1.8)"},6.82);
tl.to("#floorMark",{scaleX:.86,scaleY:.82,duration:.30,ease:"power2.out"},6.82);

// CELEBRATION — asymmetric tilt/bounce with real follow-through.
tl.to("#giftRig",{rotation:-6.5,scale:1.035,y:-46,duration:.22,ease:"power3.out"},7.36);
tl.to("#giftRig",{rotation:7.5,scale:1.07,y:-112,duration:.27,ease:"power2.inOut"},7.58);
tl.to("#giftRig",{rotation:-3.2,scale:1.025,y:-46,duration:.25,ease:"power2.inOut"},7.85);
tl.to("#giftRig",{rotation:0,scale:1,y:0,duration:.31,ease:"power2.out"},8.10);
tl.to("#floorMark",{scaleX:.70,scaleY:.64,duration:.25,ease:"power2.out"},7.50);
tl.to("#floorMark",{scaleX:.90,scaleY:.86,duration:.34,ease:"power2.out"},7.90);

// Spark punctuation.
sparks.forEach((el,i)=>{
  const t=8.15+i*.025;
  tl.set(el,{visibility:"visible"},t);
  tl.to(el,{scaleY:1,duration:.15,ease:"power4.out"},t);
  tl.to(el,{scaleY:.18,duration:.25,ease:"power3.in"},t+.18);
  tl.set(el,{visibility:"hidden"},t+.44);
});
tl.to("#world",{scale:1.01,y:0,duration:.46,ease:"sine.inOut"},8.18);
tl.to("#world",{scale:1,y:0,duration:.42,ease:"sine.inOut"},8.64);

// EXIT — compress and pop, leaving an uncontaminated green plate.
tl.to("#giftRig",{scale:.92,y:52,rotation:-2.2,duration:.22,ease:"power2.in"},8.98);
tl.to("#floorMark",{scaleX:1.02,scaleY:1.05,duration:.20,ease:"power2.in"},8.99);
tl.set("#poofRing",{visibility:"visible"},9.19);
tl.to("#poofRing",{scale:.72,borderWidth:0,duration:.30,ease:"power4.out"},9.19);
tl.to("#giftRig",{scale:0,rotation:23,y:-210,duration:.48,ease:"back.in(1.55)"},9.20);
tl.to("#floorMark",{scale:0,duration:.34,ease:"power3.in"},9.20);
tl.set("#poofRing",{visibility:"hidden"},9.50);
tl.to({},{duration:.01},9.99);

const q=new URLSearchParams(location.search);
const dbg=$("#debug"),scrub=$("#scrub"),clock=$("#clock"),play=$("#play");
if(q.has("debug"))dbg.classList.add("on");
let dragging=false;
gsap.ticker.add(()=>{
  const t=tl.time();
  clock.textContent=t.toFixed(2)+"s";
  if(!dragging)scrub.value=String((t/DURATION)*1000);
});
scrub.onpointerdown=()=>{dragging=true;tl.pause()};
addEventListener("pointerup",()=>dragging=false);
scrub.oninput=()=>window.OPENER.seek(Number(scrub.value)/1000*DURATION);
play.onclick=()=>tl.paused()?tl.play():tl.pause();
addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();tl.paused()?tl.play():tl.pause();}
  if(e.key==="r"||e.key==="R")tl.play(0);
});
tl.eventCallback("onComplete",()=>{if(!q.has("clean"))tl.play(0)});

window.OPENER={
  W,H,DURATION,tl,ready:false,
  seek(t){
    const safe=Math.max(0,Math.min(DURATION,t));
    tl.pause();
    tl.time(safe,false);
  },
  play(){tl.play();}
};

Promise.resolve(document.fonts?.ready).then(()=>{
  window.OPENER.ready=true;
  if(!q.has("clean"))tl.play(0);
});
</script>
