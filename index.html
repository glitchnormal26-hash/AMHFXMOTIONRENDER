<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4K Gift Box Greenscreen Motion</title>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{
  --green:#00ff00;
  --pink:#ef267d;
  --pink-hi:#ff5ca7;
  --pink-dark:#ad1257;
  --gold:#ffc928;
  --gold-hi:#fff06a;
  --gold-dark:#d88b00;
  --blue:#20b8ff;
  --orange:#ff7a26;
  --white:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green)}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  position:fixed;
  left:50%;top:50%;
  width:3840px;height:2160px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;
  overflow:hidden;
  background:var(--green);
}
#world{position:absolute;inset:0;overflow:hidden;background:var(--green)}
#giftRig{
  position:absolute;left:1920px;top:1160px;
  width:0;height:0;
  transform-origin:0 220px;
  will-change:transform;
}
#giftCore{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 210px;will-change:transform}

/* Main box — clean 2.5D faces with no green-adjacent shadows. */
#bodyFront{
  position:absolute;left:-455px;top:-110px;width:910px;height:600px;
  border-radius:36px;
  background:linear-gradient(180deg,var(--pink-hi) 0%,var(--pink) 42%,var(--pink-dark) 100%);
  border:14px solid #8e0d47;
  overflow:hidden;
}
#bodyFront:before{
  content:"";position:absolute;left:0;right:0;top:68px;height:86px;
  background:rgba(255,255,255,.13);transform:skewY(-2deg);
}
#bodyTop{
  position:absolute;left:-455px;top:-194px;width:910px;height:120px;
  background:linear-gradient(180deg,#ff77b7,var(--pink));
  clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);
  border-bottom:12px solid #a90e54;
}
#bodySide{
  position:absolute;left:455px;top:-78px;width:118px;height:536px;
  background:linear-gradient(180deg,#c81463,#8b0e45);
  clip-path:polygon(0 0,100% 9%,100% 92%,0 100%);
}
.ribbonV{
  position:absolute;left:50%;top:0;bottom:0;width:164px;translate:-50% 0;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold-hi) 48%,var(--gold));
}
.ribbonH{
  position:absolute;left:0;right:0;top:246px;height:132px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 56%,var(--gold-dark));
}
.ribbonV:after,.ribbonH:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.12)}
#bodyShine{
  position:absolute;left:-355px;top:-30px;width:105px;height:420px;
  border-radius:999px;background:rgba(255,255,255,.15);transform:rotate(12deg)
}

/* Lid and bow stay as one hero object until the reveal. */
#lid{
  position:absolute;left:0;top:-292px;width:0;height:0;
  transform-origin:-330px 150px;
  will-change:transform;
}
#lidFront{
  position:absolute;left:-515px;top:0;width:1030px;height:185px;
  border-radius:34px;
  background:linear-gradient(180deg,#ff6bb0,var(--pink) 55%,#b41059);
  border:14px solid #8e0d47;
  overflow:hidden;
}
#lidTop{
  position:absolute;left:-515px;top:-92px;width:1030px;height:112px;
  background:linear-gradient(180deg,#ff8cc4,#f94499);
  clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
  border-bottom:10px solid #ad1257;
}
#lid .ribbonV{left:50%;top:-92px;height:277px;bottom:auto;width:184px}
#lid .ribbonH{top:48px;height:92px}
#lidShine{
  position:absolute;left:-390px;top:15px;width:190px;height:26px;
  background:rgba(255,255,255,.22);border-radius:99px;transform:rotate(-2deg)
}
#bow{position:absolute;left:0;top:-178px;width:0;height:0;will-change:transform}
.bowLoop{
  position:absolute;top:-72px;width:320px;height:185px;
  border:48px solid var(--gold);
  background:var(--orange);
  border-radius:58% 45% 60% 48%;
  box-shadow:inset 0 0 0 14px var(--gold-hi);
  will-change:transform;
}
#bowLeft{left:-320px;transform-origin:100% 62%;transform:rotate(-19deg)}
#bowRight{left:0;transform-origin:0 62%;transform:rotate(19deg)}
#knot{
  position:absolute;left:-92px;top:-42px;width:184px;height:164px;
  border-radius:50%;
  background:radial-gradient(circle at 38% 30%,var(--gold-hi),var(--gold) 48%,var(--gold-dark) 100%);
  border:12px solid #c47c00;
  will-change:transform;
}
#tailLeft,#tailRight{
  position:absolute;top:75px;width:118px;height:250px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold),var(--gold-dark));
  clip-path:polygon(0 0,100% 8%,80% 100%,49% 83%,18% 100%);
  transform-origin:50% 0;
}
#tailLeft{left:-126px;transform:rotate(14deg)}
#tailRight{left:8px;transform:rotate(-14deg)}

/* Reveal energy — opaque graphic shapes keep chroma edges crisp. */
#insideGlow{
  position:absolute;left:-410px;top:-360px;width:820px;height:820px;
  border-radius:50%;
  background:radial-gradient(circle,var(--white) 0 6%,var(--gold-hi) 7% 18%,var(--gold) 19% 37%,rgba(255,201,40,.45) 38% 56%,rgba(255,201,40,0) 57% 100%);
  opacity:0;transform:scale(.15);will-change:transform,opacity;pointer-events:none
}
#burstRoot{position:absolute;left:0;top:-250px;width:0;height:0;pointer-events:none}
.particle{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.particle.dot{width:58px;height:58px;border-radius:50%;background:var(--white);border:8px solid #ffb500}
.particle.diamond{
  width:82px;height:82px;background:var(--blue);border:8px solid var(--white);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)
}
.particle.star{
  width:110px;height:110px;background:var(--gold-hi);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 56%,79% 94%,50% 72%,21% 94%,32% 56%,2% 35%,39% 35%);
  border:none
}
.particle.confetti{width:36px;height:150px;border-radius:18px;background:var(--orange)}
.particle.confetti.blue{background:var(--blue)}
.particle.confetti.pink{background:#ff9bd0}
#impactRing,#closeRing,#poofRing{
  position:absolute;left:-520px;top:440px;width:1040px;height:180px;
  border:32px solid var(--white);border-radius:50%;opacity:0;transform:scale(.25);
  will-change:transform,opacity;pointer-events:none
}
#closeRing{border-color:var(--gold-hi)}
#poofRing{top:-20px;border-color:var(--white);width:1180px;left:-590px;height:360px}
#sparkA,#sparkB,#sparkC,#sparkD{
  position:absolute;width:38px;height:210px;background:var(--white);border-radius:99px;
  left:-19px;top:-330px;opacity:0;transform-origin:50% 430px
}
#sparkB{transform:rotate(90deg)} #sparkC{transform:rotate(45deg)} #sparkD{transform:rotate(-45deg)}

#debug{
  display:none;position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:20;
  gap:16px;align-items:center;padding:16px 22px;border-radius:16px;background:#111;color:#fff;
  font:20px Arial,sans-serif
}
#debug.on{display:flex}
#debug input{width:700px}
#clock{min-width:8ch;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="giftRig">
      <div id="impactRing"></div>
      <div id="closeRing"></div>
      <div id="poofRing"></div>
      <div id="insideGlow"></div>
      <div id="burstRoot"></div>
      <div id="giftCore">
        <div id="bodyTop"></div>
        <div id="bodySide"></div>
        <div id="bodyFront">
          <div class="ribbonV"></div>
          <div class="ribbonH"></div>
          <div id="bodyShine"></div>
        </div>
        <div id="lid">
          <div id="lidTop"></div>
          <div id="lidFront"></div>
          <div class="ribbonV"></div>
          <div class="ribbonH"></div>
          <div id="lidShine"></div>
          <div id="bow">
            <div class="bowLoop" id="bowLeft"></div>
            <div class="bowLoop" id="bowRight"></div>
            <div id="tailLeft"></div><div id="tailRight"></div>
            <div id="knot"></div>
          </div>
        </div>
      </div>
      <div id="sparkA"></div><div id="sparkB"></div><div id="sparkC"></div><div id="sparkD"></div>
    </div>
  </div>
</div>

<div id="debug">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const W=3840,H=2160,DURATION=10;
const $=s=>document.querySelector(s);
const stage=$("#stage");
const fit=()=>{
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
};
addEventListener("resize",fit);fit();

// Fixed particle data: no Math.random(), so every capture is deterministic.
const particleData=[
  ["star",-820,-900,-1040,-35,0.00],["diamond",-560,-1040,-860,130,0.04],
  ["dot",-330,-1160,-680,-80,0.10],["confetti blue",-120,-1050,-520,260,0.15],
  ["star",170,-1120,-650,95,0.07],["confetti pink",390,-1000,-700,-210,0.12],
  ["diamond",610,-900,-850,190,0.02],["dot",830,-760,-1010,-110,0.16],
  ["confetti",-960,-520,-380,360,0.06],["diamond",960,-500,-420,-260,0.13],
  ["dot",-720,-690,-320,125,0.18],["star",720,-710,-350,-140,0.09],
  ["confetti pink",-470,-880,-250,290,0.21],["confetti blue",500,-850,-260,-310,0.23],
  ["diamond",-220,-820,-210,190,0.25],["dot",250,-790,-190,-130,0.27],
  ["star",-1040,-300,-90,210,0.20],["star",1020,-260,-110,-190,0.24],
  ["confetti",-650,-430,-40,420,0.30],["confetti blue",660,-410,-70,-390,0.32]
];
const burst=$("#burstRoot");
particleData.forEach(([cls])=>{
  const el=document.createElement("div");
  el.className=`particle ${cls}`;
  burst.appendChild(el);
});
const particles=[...document.querySelectorAll(".particle")];

const tl=gsap.timeline({paused:true,defaults:{overwrite:false}});

// HOOK: already moving on frame one. A heavy drop establishes the box as hero.
tl.set("#giftRig",{y:-1760,rotation:-13,scale:.91},0);
tl.set("#giftCore",{scaleX:1,scaleY:1},0);
tl.set("#lid",{x:0,y:0,rotation:0},0);
tl.to("#giftRig",{y:0,rotation:2,duration:.72,ease:"power3.in"},0);

// IMPACT: squash, ring, lid/bow delayed reaction, then a short breath.
tl.to("#giftCore",{scaleX:1.09,scaleY:.82,duration:.11,ease:"power2.out"},.72);
tl.fromTo("#impactRing",{opacity:.95,scale:.22},{opacity:0,scale:1.35,duration:.44,ease:"power3.out"},.72);
tl.to("#lid",{y:34,rotation:1.8,duration:.10,ease:"power2.out"},.73);
tl.to("#bow",{scaleY:.80,scaleX:1.10,duration:.10,ease:"power2.out"},.74);
tl.to("#giftRig",{y:-150,rotation:-2.2,duration:.28,ease:"power2.out"},.83);
tl.to("#giftCore",{scaleX:.97,scaleY:1.06,duration:.24,ease:"power2.out"},.84);
tl.to("#lid",{y:-14,rotation:-1.1,duration:.23,ease:"power2.out"},.84);
tl.to("#bow",{scaleX:.96,scaleY:1.08,duration:.24,ease:"back.out(1.7)"},.84);
tl.to("#giftRig",{y:0,rotation:0,duration:.38,ease:"power2.inOut"},1.12);
tl.to("#giftCore",{scaleX:1,scaleY:1,duration:.30,ease:"power2.out"},1.10);
tl.to("#lid",{y:0,rotation:0,duration:.30,ease:"power2.out"},1.10);
tl.to("#bow",{scaleX:1,scaleY:1,duration:.30,ease:"power2.out"},1.10);

// QUESTION: bow pulls outward and lid trembles before we know what is inside.
tl.to("#bowLeft",{rotation:-34,scaleX:1.14,scaleY:.91,duration:.24,ease:"power3.out"},1.82);
tl.to("#bowRight",{rotation:34,scaleX:1.14,scaleY:.91,duration:.24,ease:"power3.out"},1.82);
tl.to("#knot",{scale:1.13,y:-18,duration:.20,ease:"back.out(2)"},1.86);
tl.to("#tailLeft",{rotation:24,duration:.28,ease:"power2.out"},1.90);
tl.to("#tailRight",{rotation:-24,duration:.28,ease:"power2.out"},1.90);
tl.to("#lid",{rotation:-2.2,y:-18,duration:.12,ease:"power2.out"},2.25);
tl.to("#lid",{rotation:2.0,y:3,duration:.11,ease:"power2.inOut"},2.37);
tl.to("#lid",{rotation:-1.0,y:-8,duration:.11,ease:"power2.inOut"},2.48);
tl.to("#lid",{rotation:0,y:0,duration:.14,ease:"power2.out"},2.59);

// REVEAL: anticipation dip then lid becomes the transition object.
tl.to("#giftCore",{y:38,scaleY:.96,duration:.18,ease:"power2.in"},2.74);
tl.to("#lid",{y:-18,duration:.18,ease:"power2.in"},2.74);
tl.to("#lid",{y:-500,x:80,rotation:8,scale:1.03,duration:.62,ease:"back.out(1.28)"},2.92);
tl.to("#giftCore",{y:0,scaleY:1,duration:.42,ease:"power3.out"},2.96);
tl.fromTo("#insideGlow",{opacity:0,scale:.12},{opacity:1,scale:1.12,duration:.38,ease:"power4.out"},3.06);
tl.to("#insideGlow",{opacity:.35,scale:1.42,duration:.70,ease:"power2.out"},3.44);

// Controlled particle burst: one hero reveal, then support elements clear away.
particles.forEach((el,i)=>{
  const [,dx,peakY,endY,rot,delay]=particleData[i];
  const t=3.20+delay;
  tl.fromTo(el,
    {x:0,y:0,scale:.20,opacity:0,rotation:0},
    {x:dx*.52,y:peakY,scale:1,opacity:1,rotation:rot*.35,duration:.42,ease:"power4.out"},t);
  tl.to(el,
    {x:dx,y:endY+720,scale:.78,rotation:rot,opacity:0,duration:1.60,ease:"power2.in"},t+.38);
});

// Lid hover and bow follow-through during the readable payoff.
tl.to("#lid",{y:-560,x:130,rotation:12,duration:.45,ease:"power2.inOut"},3.70);
tl.to("#lid",{y:-520,x:105,rotation:7,duration:.65,ease:"power2.inOut"},4.15);
tl.to("#bowLeft",{rotation:-25,scaleX:1.04,scaleY:1,duration:.50,ease:"power2.out"},3.78);
tl.to("#bowRight",{rotation:25,scaleX:1.04,scaleY:1,duration:.50,ease:"power2.out"},3.78);
tl.to("#knot",{scale:1,y:0,duration:.45,ease:"power2.out"},3.80);
tl.to("#insideGlow",{opacity:0,scale:1.65,duration:1.05,ease:"power2.out"},4.15);

// BREATH: clean open-box pose before the lid returns.
tl.to("#lid",{rotation:4,y:-535,x:95,duration:.50,ease:"sine.inOut"},5.15);
tl.to("#giftRig",{rotation:-1.2,duration:.40,ease:"sine.inOut"},5.20);
tl.to("#giftRig",{rotation:0,duration:.40,ease:"sine.inOut"},5.60);

// RESET: lid anticipates upward, closes fast, body reacts after contact.
tl.to("#lid",{y:-600,x:125,rotation:10,duration:.23,ease:"power2.out"},6.02);
tl.to("#lid",{y:0,x:0,rotation:0,scale:1,duration:.48,ease:"power4.in"},6.25);
tl.to("#giftCore",{scaleX:1.07,scaleY:.86,y:18,duration:.10,ease:"power2.out"},6.73);
tl.fromTo("#closeRing",{opacity:.90,scale:.24},{opacity:0,scale:1.22,duration:.40,ease:"power3.out"},6.73);
tl.to("#giftCore",{scaleX:.98,scaleY:1.05,y:-18,duration:.22,ease:"power2.out"},6.83);
tl.to("#giftCore",{scaleX:1,scaleY:1,y:0,duration:.28,ease:"power2.inOut"},7.05);
tl.to("#bow",{scaleY:.86,scaleX:1.08,duration:.10,ease:"power2.out"},6.74);
tl.to("#bow",{scaleY:1,scaleX:1,duration:.28,ease:"back.out(1.8)"},6.84);

// Celebration: brief asymmetric tilt, not a perpetual loop.
tl.to("#giftRig",{rotation:-6,scale:1.035,y:-42,duration:.22,ease:"power3.out"},7.55);
tl.to("#giftRig",{rotation:7,scale:1.07,y:-105,duration:.26,ease:"power2.inOut"},7.77);
tl.to("#giftRig",{rotation:-3,scale:1.025,y:-42,duration:.25,ease:"power2.inOut"},8.03);
tl.to("#giftRig",{rotation:0,scale:1,y:0,duration:.30,ease:"power2.out"},8.28);

// Spark punctuation around the final hero pose.
tl.fromTo("#sparkA,#sparkB,#sparkC,#sparkD",{opacity:0,scaleY:.25},{opacity:1,scaleY:1,duration:.16,ease:"power4.out"},8.18);
tl.to("#sparkA,#sparkB,#sparkC,#sparkD",{opacity:0,scaleY:.35,duration:.28,ease:"power3.in"},8.42);

// EXIT: compress, pop away, leave a perfectly clean green plate for the last frames.
tl.to("#giftRig",{scale:.91,y:45,rotation:-2,duration:.22,ease:"power2.in"},9.02);
tl.fromTo("#poofRing",{opacity:0,scale:.20},{opacity:.92,scale:.65,duration:.18,ease:"power4.out"},9.22);
tl.to("#giftRig",{scale:0,rotation:22,y:-190,duration:.48,ease:"back.in(1.55)"},9.22);
tl.to("#poofRing",{opacity:0,scale:1.42,duration:.48,ease:"power3.out"},9.38);
tl.to({},{duration:.01},9.99);

const q=new URLSearchParams(location.search);
const dbg=$("#debug"),scrub=$("#scrub"),clock=$("#clock"),play=$("#play");
if(q.has("debug"))dbg.classList.add("on");
let dragging=false;
gsap.ticker.add(()=>{
  const t=tl.time();
  clock.textContent=t.toFixed(2)+"s";
  if(!dragging)scrub.value=String((t/DURATION)*1000);
});
scrub.onpointerdown=()=>{dragging=true;tl.pause()};
addEventListener("pointerup",()=>dragging=false);
scrub.oninput=()=>window.OPENER.seek(Number(scrub.value)/1000*DURATION);
play.onclick=()=>tl.paused()?tl.play():tl.pause();
addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();tl.paused()?tl.play():tl.pause();}
  if(e.key==="r"||e.key==="R")tl.play(0);
});
tl.eventCallback("onComplete",()=>{if(!q.has("clean"))tl.play(0)});

window.OPENER={
  W,H,DURATION,tl,ready:false,
  seek(t){
    const safe=Math.max(0,Math.min(DURATION,t));
    tl.pause();
    tl.time(safe,false);
  },
  play(){tl.play();}
};

Promise.resolve(document.fonts?.ready).then(()=>{
  window.OPENER.ready=true;
  if(!q.has("clean"))tl.play(0);
});
</script>
</body>
</html>
