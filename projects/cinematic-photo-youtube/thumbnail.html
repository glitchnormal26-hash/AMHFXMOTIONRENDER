<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url('assets/fonts/anton-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Grotesk';src:url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');font-weight:700}
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
body{font-family:'Grotesk',sans-serif;color:#f4f1ea;position:relative}
.bg{position:absolute;inset:0;background:url('assets/hero-crosswalk.jpg') center 32%/cover;filter:saturate(.85) contrast(1.06)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,10,.94) 0%,rgba(5,7,10,.82) 42%,rgba(5,7,10,.25) 75%,rgba(5,7,10,.1) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.wrap{position:absolute;left:64px;top:96px;width:760px}
.kick{display:inline-block;padding:10px 18px;background:#ff6b35;color:#170a04;font-weight:700;font-size:22px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:26px}
h1{font-family:'Anton';font-size:96px;line-height:.98;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 10px 44px rgba(0,0,0,.8)}
h1 em{font-style:normal;color:#f5a623}
.slash{width:340px;height:12px;background:linear-gradient(90deg,#ff6b35,#f5a623);margin:30px 0 26px;box-shadow:0 0 30px rgba(245,166,35,.6)}
.sub{font-size:30px;font-weight:700;letter-spacing:.06em;color:#cfd6da}
.chips{position:absolute;left:64px;bottom:64px;display:flex;gap:14px}
.chips span{padding:12px 20px;border:2px solid rgba(244,241,234,.35);border-radius:999px;background:rgba(8,11,14,.7);font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.chips span b{color:#f5a623;margin-right:8px}
.badge{position:absolute;right:48px;bottom:56px;padding:14px 24px;background:#f5a623;color:#161006;font-family:'Anton';font-size:34px;text-transform:uppercase;transform:rotate(-3deg);box-shadow:0 18px 50px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div><div class="vig"></div>
<div class="wrap">
  <div class="kick">Bedah Prompt • Foto AI</div>
  <h1>Foto ini bukan<br><em>kamera film.</em></h1>
  <div class="slash"></div>
  <div class="sub">Resep foto cinematic dari 1 text prompt — 4 lapis template</div>
</div>
<div class="chips">
  <span><b>01</b>Sudut Kamera</span><span><b>02</b>Backlight</span><span><b>03</b>Ruang Negatif</span>
</div>
<div class="badge">Prompt Pack Gratis</div>
</body>
</html>
