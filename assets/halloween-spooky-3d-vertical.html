<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Spooky 3D Vertical Background</title>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{
  --night-0:#05040b;
  --night-1:#0b0715;
  --night-2:#160b20;
  --violet:#2b1238;
  --moon:#f4dfba;
  --ember:#ff8c32;
  --ember2:#ffc45a;
  --fog:#bca9ca;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}
body{font-family:Georgia,"Times New Roman",serif}
#stage{
  position:fixed;left:50%;top:50%;width:1080px;height:1920px;
  transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;
  perspective:1450px;background:var(--night-0);isolation:isolate;
}
#camera{position:absolute;inset:-130px;transform-style:preserve-3d;transform-origin:50% 52%;will-change:transform}
.layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#sky{inset:-220px;background:
  radial-gradient(ellipse at 50% 25%,rgba(86,40,100,.28) 0%,rgba(28,13,42,.12) 34%,transparent 62%),
  linear-gradient(180deg,#0b0716 0%,#0b0713 43%,#120817 72%,#07050b 100%)}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.72) 100%);mix-blend-mode:multiply}
.star{position:absolute;width:3px;height:3px;background:#f7e9cf;box-shadow:0 0 9px rgba(244,223,186,.7);opacity:.45;transform:rotate(45deg)}
.star.big{width:5px;height:5px;box-shadow:0 0 15px rgba(244,223,186,.8)}
#moonWrap{position:absolute;left:189px;top:188px;width:720px;height:720px;transform:translateZ(-165px);filter:drop-shadow(0 0 70px rgba(231,207,169,.18))}
#moonHalo{position:absolute;inset:-130px;border-radius:46% 54% 49% 51% / 54% 47% 53% 46%;background:radial-gradient(circle,rgba(240,220,190,.20),rgba(201,166,203,.08) 38%,transparent 70%);filter:blur(18px);opacity:.9}
#moon{position:absolute;left:79px;top:76px;width:562px;height:562px;overflow:hidden;clip-path:path('M 277 6 C 375 10 471 61 528 142 C 581 219 570 335 522 419 C 469 511 361 565 257 553 C 159 542 70 481 28 391 C -12 304 1 202 50 124 C 100 45 184 -1 277 6 Z');background:
  radial-gradient(circle at 36% 30%,rgba(255,250,224,.98) 0 10%,rgba(232,211,177,.92) 31%,rgba(188,160,154,.87) 72%,rgba(139,111,133,.84) 100%);
  box-shadow:inset -42px -34px 80px rgba(68,40,75,.44),inset 24px 18px 56px rgba(255,248,217,.18),0 0 65px rgba(241,220,188,.38)}
.crater{position:absolute;border-radius:50%;background:radial-gradient(circle at 62% 35%,rgba(115,88,111,.08),rgba(87,57,89,.28) 55%,rgba(255,247,217,.08) 58%,transparent 71%);filter:blur(.2px)}
.c1{width:112px;height:86px;left:110px;top:115px;transform:rotate(-18deg)}
.c2{width:150px;height:120px;left:316px;top:225px;transform:rotate(22deg)}
.c3{width:86px;height:70px;left:202px;top:360px;transform:rotate(10deg)}
.c4{width:65px;height:52px;left:378px;top:88px}
#cloudBack,#cloudFront{position:absolute;inset:0;transform:translateZ(-80px);opacity:.5;filter:blur(1px)}
#cloudFront{transform:translateZ(30px);opacity:.27;filter:blur(5px)}
.cloud{position:absolute;height:180px;width:940px;background:
  radial-gradient(ellipse at 20% 55%,rgba(117,85,127,.2),transparent 48%),
  radial-gradient(ellipse at 53% 45%,rgba(165,132,169,.14),transparent 52%),
  radial-gradient(ellipse at 82% 60%,rgba(117,85,127,.17),transparent 48%);
  filter:blur(24px)}
#ridge{position:absolute;left:-150px;bottom:380px;width:1380px;height:760px;transform:translateZ(-20px);filter:drop-shadow(0 -16px 28px rgba(0,0,0,.5))}
#cemetery{position:absolute;left:-90px;bottom:160px;width:1260px;height:620px;transform:translateZ(75px)}
#manor{position:absolute;left:105px;top:645px;width:870px;height:880px;transform:translateZ(130px);filter:drop-shadow(0 48px 60px rgba(0,0,0,.62))}
#manor .stone{fill:url(#stoneGrad)}
.window{fill:#ffb542;filter:url(#windowGlow)}
.window.dim{fill:#ba6336;opacity:.5}
#treesBack{position:absolute;inset:0;transform:translateZ(25px);opacity:.86}
#treeLeft{position:absolute;left:-215px;top:530px;width:650px;height:1200px;filter:drop-shadow(28px 40px 38px rgba(0,0,0,.45))}
#treeRight{position:absolute;right:-290px;top:610px;width:660px;height:1170px;transform:scaleX(-1);filter:drop-shadow(28px 40px 38px rgba(0,0,0,.48))}
#fogBack{position:absolute;inset:-140px;transform:translateZ(145px);opacity:.55;filter:blur(22px)}
#fogMid{position:absolute;inset:-180px;transform:translateZ(255px);opacity:.52;filter:blur(30px)}
#fogFront{position:absolute;inset:-220px;transform:translateZ(430px);opacity:.50;filter:blur(42px)}
.fogband{position:absolute;width:1500px;height:260px;border-radius:48% 52% 45% 55% / 62% 55% 45% 38%;background:
  radial-gradient(ellipse at 18% 60%,rgba(208,193,216,.28),transparent 44%),
  radial-gradient(ellipse at 52% 48%,rgba(174,151,187,.25),transparent 50%),
  radial-gradient(ellipse at 84% 56%,rgba(209,194,218,.18),transparent 43%)}
#foreground{position:absolute;inset:0;transform:translateZ(390px)}
#pumpkinPatch{position:absolute;left:10px;bottom:-44px;width:1040px;height:590px;filter:drop-shadow(0 55px 45px rgba(0,0,0,.58))}
.pumpkinGlow{filter:url(#pumpkinGlow)}
#branchTop{position:absolute;left:-70px;top:-120px;width:1220px;height:520px;transform:translateZ(500px);opacity:.84;filter:drop-shadow(0 24px 22px rgba(0,0,0,.45))}
#bats{position:absolute;inset:0;transform:translateZ(210px)}
.bat{position:absolute;width:94px;height:58px;filter:drop-shadow(0 9px 10px rgba(0,0,0,.52));will-change:transform,opacity}
.bat svg{width:100%;height:100%;overflow:visible}
.bat path{fill:#100a16}
#lightning{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 20%,rgba(230,219,255,.34),rgba(112,78,141,.18) 35%,transparent 70%);opacity:0;mix-blend-mode:screen;transform:translateZ(520px)}
#vignette{position:absolute;inset:-2px;box-shadow:inset 0 0 150px 60px rgba(0,0,0,.7),inset 0 -230px 230px rgba(0,0,0,.48);transform:translateZ(600px)}
#grain{position:absolute;inset:-50%;opacity:.055;transform:translateZ(610px);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
#debug{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;padding:9px 14px;border-radius:12px;background:#050308;color:#fff;font:14px monospace}
#debug.on{display:block}
</style>
</head>

      </svg>

    <div id="fogBack" class="layer">

<div id="debug">0.00s</div>
<script>
const W=1080,H=1920,DURATION=15;
const stage=document.querySelector('#stage');
const camera=document.querySelector('#camera');
const debug=document.querySelector('#debug');
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();

// Deterministic star field.
const stars=document.querySelector('#stars');
for(let i=0;i<92;i++){
  const x=(i*137.3+73)%1080;
  const y=(i*i*17.7+i*39.1+41)%1040;
  const s=document.createElement('i');
  s.className='star'+(i%13===0?' big':'');
  s.style.left=x+'px';s.style.top=y+'px';s.style.opacity=(.18+((i*29)%61)/100).toFixed(2);
  stars.appendChild(s);
}

// Custom bat silhouettes, duplicated with intentional scale/angle variation.
const bats=document.querySelector('#bats');
const batData=[
  [95,680,.72,-8],[220,520,.46,12],[770,490,.58,-4],[860,640,.38,15],[640,790,.84,-11],
  [360,720,.34,8],[915,865,.52,-16],[126,880,.43,13],[532,610,.30,-3]
];
batData.forEach((b,i)=>{
  const el=document.createElement('div');el.className='bat';el.id='bat'+i;
  el.style.left=b[0]+'px';el.style.top=b[1]+'px';el.style.transform=`scale(${b[2]}) rotate(${b[3]}deg)`;
  el.innerHTML='<svg viewBox="0 0 120 72"><path d="M59 39 C46 19 33 14 14 19 C23 26 20 35 5 42 C28 42 42 49 59 62 C76 49 90 42 115 42 C99 34 97 26 106 18 C84 14 72 21 61 39 C61 39 60 40 59 39 Z"/><path d="M53 38 C56 29 64 29 68 37 C64 37 62 41 61 45 C58 42 57 40 53 38 Z"/></svg>';
  bats.appendChild(el);
});

const tl=gsap.timeline({paused:true,defaults:{overwrite:false}});

// Opening: slow crane/push establishes the manor, layered moon and foreground silhouettes.
tl.set(camera,{x:0,y:72,scale:.92,rotation:-.35,transformOrigin:'50% 52%'});
tl.fromTo('#moonWrap',{opacity:.55,scale:.93},{opacity:1,scale:1,duration:2.4,ease:'sine.out'},0);
tl.fromTo('#manor',{y:44,opacity:.82},{y:0,opacity:1,duration:2.1,ease:'power2.out'},0);
tl.to(camera,{x:-18,y:14,scale:1.00,rotation:0,duration:2.8,ease:'power2.inOut'},0);
tl.to('#cloudBack',{x:115,duration:4.4,ease:'sine.inOut'},0);
tl.to('#cloudFront',{x:-150,duration:4.0,ease:'sine.inOut'},0);

// Fog flows at different depth speeds to create real parallax.
tl.fromTo('#fogBack',{x:-130},{x:90,duration:6.4,ease:'sine.inOut'},0);
tl.fromTo('#fogMid',{x:150},{x:-140,duration:5.6,ease:'sine.inOut'},0);
tl.fromTo('#fogFront',{x:-210},{x:145,duration:4.8,ease:'sine.inOut'},0);

// Camera catches the glowing foreground pumpkins, then settles.
tl.to(camera,{x:-76,y:-168,scale:1.16,rotation:.38,duration:1.3,ease:'power3.inOut'},3.0);
tl.to('#pumpkinPatch',{y:-26,scale:1.035,duration:1.1,ease:'power3.out'},3.15);
tl.to('#moonWrap',{x:34,y:-12,scale:1.03,duration:1.5,ease:'power2.inOut'},3.0);
tl.to({}, {duration:.5},4.3);

// Carved glow breath is authored, not random flicker.
tl.to('.pumpkinGlow',{opacity:.62,duration:.16,ease:'power2.inOut'},4.15);
tl.to('.pumpkinGlow',{opacity:1,duration:.28,ease:'power2.out'},4.31);
tl.to('.pumpkinGlow',{opacity:.78,duration:.2,ease:'power2.inOut'},4.75);
tl.to('.pumpkinGlow',{opacity:1,duration:.42,ease:'sine.out'},4.95);

// Tracking handoff from pumpkin warmth to manor windows / moon.
tl.to(camera,{x:42,y:26,scale:1.075,rotation:-.25,duration:1.7,ease:'expo.inOut'},5.15);
tl.to('#manor',{scale:1.035,y:-12,duration:1.55,ease:'power3.out'},5.3);
tl.to('.window',{opacity:.58,duration:.12,ease:'power2.inOut'},6.35);
tl.to('.window',{opacity:1,duration:.22,ease:'power2.out'},6.47);

// Bat swarm crosses the lens; each path uses different energy and scale.
batData.forEach((b,i)=>{
  const dir=i%2?1:-1;
  tl.fromTo('#bat'+i,
    {x:dir*260,y:150+(i%3)*60,opacity:0,scale:b[2]*.72,rotation:b[3]-18*dir},
    {x:-dir*(420+i*22),y:-170-(i%4)*95,opacity:.92,scale:b[2]*(1.05+(i%3)*.12),rotation:b[3]+24*dir,duration:1.55+(i%4)*.16,ease:'power2.inOut'},
    6.55+i*.075
  );
});

// Brief lightning reveal: silhouette detail spikes, then returns to candle/moon lighting.
tl.to('#lightning',{opacity:.78,duration:.055,ease:'power4.out'},8.08);
tl.to('#lightning',{opacity:.08,duration:.13,ease:'power4.in'},8.135);
tl.to('#lightning',{opacity:.46,duration:.045,ease:'power4.out'},8.32);
tl.to('#lightning',{opacity:0,duration:.24,ease:'power3.in'},8.365);
tl.to('#manor',{filter:'drop-shadow(0 48px 60px rgba(0,0,0,.35)) brightness(1.14)',duration:.08,ease:'none'},8.08);
tl.to('#manor',{filter:'drop-shadow(0 48px 60px rgba(0,0,0,.62)) brightness(1)',duration:.4,ease:'power2.out'},8.48);

// Push toward the manor/moon through foreground atmosphere.
tl.to(camera,{x:-20,y:108,scale:1.24,rotation:.28,duration:1.0,ease:'power3.in'},8.72);
tl.to(camera,{x:-52,y:52,scale:1.18,rotation:.06,duration:.82,ease:'power3.out'},9.72);
tl.to('#branchTop',{y:78,x:-32,duration:1.55,ease:'power2.inOut'},8.8);
tl.to('#fogFront',{x:-160,y:-48,opacity:.66,duration:1.4,ease:'power2.inOut'},8.8);

// Atmospheric breath; moon drifts against the manor for a dimensional hold.
tl.to('#moonWrap',{x:-22,y:25,scale:1.065,duration:1.8,ease:'sine.inOut'},10.45);
tl.to('#cloudBack',{x:-40,y:10,duration:2.1,ease:'sine.inOut'},10.25);
tl.to('#cloudFront',{x:55,y:-20,duration:1.9,ease:'sine.inOut'},10.25);
tl.to(camera,{x:4,y:34,scale:1.13,rotation:-.16,duration:1.7,ease:'sine.inOut'},10.55);

// Final pull-back reveal reconnects all depth bands and lands on a strong background frame.
tl.to(camera,{x:0,y:56,scale:.965,rotation:0,duration:2.1,ease:'power3.inOut'},12.35);
tl.to('#branchTop',{x:18,y:-26,duration:2.0,ease:'power2.inOut'},12.4);
tl.to('#fogBack',{x:-40,opacity:.5,duration:2.2,ease:'sine.inOut'},12.2);
tl.to('#fogMid',{x:65,opacity:.46,duration:2.0,ease:'sine.inOut'},12.3);
tl.to('#fogFront',{x:90,y:4,opacity:.42,duration:2.1,ease:'sine.inOut'},12.3);
tl.to('#pumpkinPatch',{y:4,scale:.985,duration:1.8,ease:'power2.out'},12.45);
tl.to('#moonHalo',{opacity:.68,scale:1.05,duration:1.8,ease:'sine.inOut'},12.4);
tl.to({}, {duration:.01},14.99);

const q=new URLSearchParams(location.search);
if(q.has('debug'))debug.classList.add('on');
gsap.ticker.add(()=>{debug.textContent=tl.time().toFixed(2)+'s';});
window.OPENER={W,H,DURATION,tl,ready:false,seek(t){tl.pause();tl.time(Math.max(0,Math.min(DURATION,t)),false);},play(){tl.play();}};
Promise.resolve(document.fonts?.ready).then(()=>{window.OPENER.ready=true;if(!q.has('clean'))tl.play(0);});
tl.eventCallback('onComplete',()=>{if(!q.has('clean'))tl.play(0);});
</script>
