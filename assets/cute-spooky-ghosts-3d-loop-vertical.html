<style>
:root{
  --ink:#171126;
  --night0:#17112d;
  --night1:#261a44;
  --night2:#493066;
  --lav:#bca9ff;
  --lilac:#8f7be8;
  --cream:#fff6eb;
  --peach:#ffad89;
  --orange:#ff934d;
  --mint:#9ee7d3;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0818}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  position:fixed;left:50%;top:50%;width:1080px;height:1920px;
  transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;
  perspective:1500px;background:
    radial-gradient(ellipse at 74% 19%,rgba(225,202,255,.18) 0%,rgba(132,98,199,.08) 28%,transparent 56%),
    linear-gradient(180deg,var(--night0) 0%,var(--night1) 44%,#33214c 72%,#160f2b 100%);
  isolation:isolate;
}
#camera{position:absolute;inset:-140px;transform-style:preserve-3d;transform-origin:50% 50%;will-change:transform}
.layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#aurora{
  inset:-260px;transform:translateZ(-360px);
  background:
    radial-gradient(ellipse at 14% 28%,rgba(130,223,211,.10),transparent 35%),
    radial-gradient(ellipse at 86% 42%,rgba(255,152,181,.12),transparent 34%),
    radial-gradient(ellipse at 44% 80%,rgba(144,112,225,.16),transparent 42%);
  filter:blur(26px);opacity:.92;
}
#stars{transform:translateZ(-280px)}
.spark{
  position:absolute;width:14px;height:14px;opacity:.46;filter:drop-shadow(0 0 8px rgba(255,239,220,.26));
}
.spark::before,.spark::after{
  content:"";position:absolute;left:50%;top:50%;background:#fff4db;border-radius:8px;transform:translate(-50%,-50%);
}
.spark::before{width:3px;height:14px}
.spark::after{width:14px;height:3px}
.spark.small{transform:scale(.55);opacity:.30}.spark.big{transform:scale(1.35);opacity:.64}
#moonWrap{
  position:absolute;left:585px;top:170px;width:420px;height:420px;transform:translateZ(-150px);
  filter:drop-shadow(0 24px 60px rgba(13,8,27,.28));
}
#moonHalo{
  position:absolute;inset:-120px;border-radius:48% 52% 57% 43%/45% 49% 51% 55%;
  background:radial-gradient(circle,rgba(235,218,255,.27),rgba(179,143,238,.10) 46%,transparent 72%);
  filter:blur(14px);
}
#moonSvg{width:100%;height:100%;overflow:visible}
#cloudBack{transform:translateZ(-120px);opacity:.55;filter:blur(4px)}
#cloudMid{transform:translateZ(30px);opacity:.44;filter:blur(10px)}
.cloudSvg{position:absolute;width:1250px;height:400px;overflow:visible}
#hillBack{position:absolute;left:-160px;bottom:230px;width:1420px;height:650px;transform:translateZ(0px);opacity:.92}
#hillFront{position:absolute;left:-180px;bottom:-80px;width:1460px;height:650px;transform:translateZ(250px);filter:drop-shadow(0 -28px 45px rgba(8,5,18,.35))}
#ghostField{transform-style:preserve-3d}
.ghost{
  position:absolute;transform-style:preserve-3d;will-change:transform,opacity;
  filter:drop-shadow(0 28px 30px rgba(15,8,32,.26));
}
.ghost::before{
  content:"";position:absolute;left:13%;right:13%;bottom:-24px;height:70px;
  border-radius:52% 48% 57% 43%/58% 44% 56% 42%;
  background:radial-gradient(ellipse at center,rgba(123,89,188,.24),rgba(44,29,74,.08) 54%,transparent 72%);
  filter:blur(12px);transform:translateZ(-30px);
}
.ghost svg{display:block;width:100%;height:100%;overflow:visible}
#ghostMain{left:315px;top:620px;width:455px;height:590px;transform:translateZ(260px)}
#ghostOrbit{left:70px;top:780px;width:265px;height:350px;transform:translateZ(80px);opacity:.94}
#ghostHat{left:735px;top:920px;width:275px;height:370px;transform:translateZ(150px);opacity:.98}
#ghostPeek{left:675px;top:1438px;width:360px;height:470px;transform:translateZ(410px);opacity:.98}
.ghost .shell{filter:url(#ghostSoft)}
.ghost .highlight{fill:rgba(255,255,255,.36)}
.ghost .innerShade{fill:rgba(137,119,210,.13)}
.ghost .eye{fill:#21172e}
.ghost .mouth{fill:none;stroke:#291a36;stroke-width:9;stroke-linecap:round}
.ghost .cheek{fill:#ff9cb2;opacity:.54}
.ghost .arm{fill:url(#ghostBody);filter:url(#ghostSoft)}
.accessoryShadow{fill:#6b467f;opacity:.28}
#mainFace,#orbitFace,#hatFace,#peekFace{transform-box:fill-box;transform-origin:center}
#mainArm,#orbitArm,#hatArm,#peekArm{transform-box:fill-box;transform-origin:50% 15%}
#sparkBurst{position:absolute;left:245px;top:560px;width:590px;height:650px;transform:translateZ(520px)}
.burstStar{position:absolute;width:26px;height:26px;opacity:0;filter:drop-shadow(0 0 12px rgba(255,213,140,.38))}
.burstStar::before,.burstStar::after{content:"";position:absolute;left:50%;top:50%;background:#ffd9a3;border-radius:10px;transform:translate(-50%,-50%)}
.burstStar::before{width:6px;height:26px}.burstStar::after{width:26px;height:6px}
.burstStar.mint::before,.burstStar.mint::after{background:#9fe8d5}
.burstStar.lilac::before,.burstStar.lilac::after{background:#c7b5ff}
#pumpkinPatch{

#fogFront{inset:-160px;transform:translateZ(500px);opacity:.28;filter:blur(34px)}
.fogBlob{
  position:absolute;width:900px;height:240px;border-radius:44% 56% 48% 52%/62% 44% 56% 38%;
  background:radial-gradient(ellipse at 50% 50%,rgba(224,214,255,.30),rgba(169,145,211,.12) 55%,transparent 76%);

#vignette{inset:-4px;transform:translateZ(650px);box-shadow:inset 0 0 130px 25px rgba(15,9,31,.40),inset 0 -150px 180px rgba(11,6,23,.38)}
#grain{
  inset:-45%;transform:translateZ(660px);opacity:.035;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
}
#debug{display:none;position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#0d0818;color:#fff;font:13px monospace}
#debug.on{display:block}

        <path d="M79 58 C59 120 62 199 94 252 M146 43 C127 112 130 214 147 267 M211 59 C233 127 230 205 210 250" fill="none" stroke="#c4513d" stroke-width="12" opacity=".45"/>
        <g class="pumpkinGlow" fill="#ffe59c"><path d="M82 140 L126 116 L116 157 Z"/><path d="M185 116 L228 140 L190 159 Z"/><path d="M111 201 C138 220 177 220 204 199 C191 233 128 237 111 201 Z"/></g>
      </g>
    </svg>

    <div id="fogFront" class="layer">
      <div class="fogBlob" style="left:-310px;top:1460px;transform:rotate(4deg)"></div>
      <div class="fogBlob" style="left:510px;top:1575px;transform:rotate(-7deg) scale(.82)"></div>
    </div>
    <div id="vignette" class="layer"></div>
    <div id="grain" class="layer"></div>
  </div>
</div>
<div id="debug">0.00s</div>

<script>
const W=1080,H=1920,DURATION=10;
const stage=document.querySelector('#stage');
const camera=document.querySelector('#camera');
const debug=document.querySelector('#debug');
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();

const stars=document.querySelector('#stars');
for(let i=0;i<76;i++){
  const e=document.createElement('i');
  e.className='spark'+(i%17===0?' big':i%5===0?' small':'');
  e.style.left=((i*149.7+61)%1160-40)+'px';
  e.style.top=((i*i*21.3+i*47.1+53)%1350-20)+'px';
  e.style.opacity=(.20+((i*31)%52)/100).toFixed(2);
  e.style.transform=`rotate(${(i*37)%90}deg) scale(${0.55+((i*19)%42)/100})`;
  stars.appendChild(e);
}

const tl=gsap.timeline({paused:true,defaults:{overwrite:false}});

// Explicit opening state — also the exact target state at t=10 for seamless looping.
tl.set(camera,{x:0,y:42,scale:.97,rotation:-.22,transformOrigin:'50% 50%'},0);
tl.set('#ghostMain',{x:0,y:10,scale:1,rotation:-2.4,rotationY:-5,rotationX:1.5,transformOrigin:'50% 54%'},0);
tl.set('#ghostOrbit',{x:0,y:0,scale:.94,rotation:4.5,rotationY:8,transformOrigin:'50% 54%'},0);
tl.set('#ghostHat',{x:0,y:0,scale:.96,rotation:-4,rotationY:-7,transformOrigin:'50% 54%'},0);
tl.set('#ghostPeek',{x:28,y:168,scale:1.02,rotation:3.5,rotationY:5,transformOrigin:'50% 54%'},0);
tl.set('#moonWrap',{x:0,y:0,scale:1,rotation:-1.4},0);
tl.set('#moonHalo',{scale:1,opacity:.82},0);
tl.set('#cloudBack',{x:-45,y:0},0);
tl.set('#cloudMid',{x:65,y:0},0);
tl.set('#pumpkinPatch',{x:0,y:10,rotation:0,scale:1,transformOrigin:'50% 85%'},0);
tl.set('#candyLeft',{x:0,y:0,rotation:-2},0);
tl.set('#candyRight',{x:0,y:0,rotation:2},0);
tl.set('#fogFront',{x:-40,y:0,opacity:.28},0);
tl.set('.pumpkinGlow',{opacity:.92},0);
tl.set('.burstStar',{opacity:0,scale:.35,rotation:0,x:0,y:0},0);
tl.set('.mainEye',{scaleY:1,transformOrigin:'50% 50%'},0);

// Beat 1 — soft crane/push; the main ghost becomes the clear hero.
tl.to(camera,{x:-38,y:-34,scale:1.055,rotation:.16,duration:2.2,ease:'power2.inOut'},0);
tl.to('#ghostMain',{x:-18,y:-62,rotation:3.2,rotationY:4,duration:1.65,ease:'sine.inOut'},0);
tl.to('#ghostHat',{x:-34,y:45,rotation:2.5,duration:2.0,ease:'sine.inOut'},0);
tl.to('#moonWrap',{x:20,y:-14,scale:1.025,rotation:1.1,duration:2.2,ease:'sine.inOut'},0);
tl.to('#cloudBack',{x:85,y:-8,duration:3.0,ease:'sine.inOut'},0);
tl.to('#cloudMid',{x:-80,y:16,duration:2.8,ease:'sine.inOut'},0);
tl.to('#fogFront',{x:105,y:-12,duration:2.6,ease:'sine.inOut'},0);

// Orbit ghost sweeps behind the hero, giving the camera a moving attention handoff.
tl.to('#ghostOrbit',{x:252,y:-146,scale:1.04,rotation:-7,rotationY:-4,duration:2.45,ease:'power2.inOut'},.15);
tl.to('#orbitArm',{rotation:-34,duration:.55,ease:'power3.out'},1.15);
tl.to('#orbitArm',{rotation:10,duration:.65,ease:'power2.inOut'},1.70);

// Main ghost wave + blink + sparkle cause the second framing transfer.
tl.to('#mainArm',{rotation:-38,duration:.42,ease:'power3.out'},1.72);
tl.to('#mainArm',{rotation:12,duration:.55,ease:'back.out(1.3)'},2.14);
tl.to('.mainEye',{scaleY:.12,duration:.07,ease:'power2.inOut'},2.25);
tl.to('.mainEye',{scaleY:1,duration:.09,ease:'power2.out'},2.32);
const burstData=[
  ['#bs0',-78,-88],['#bs1',94,-60],['#bs2',-122,12],
  ['#bs3',128,30],['#bs4',-82,88],['#bs5',76,108]
];
burstData.forEach((b,i)=>{
  tl.to(b[0],{opacity:.94,scale:1+(i%3)*.08,x:b[1],y:b[2],rotation:35*(i%2?1:-1),duration:.32,ease:'power3.out'},2.32+i*.035);
  tl.to(b[0],{opacity:0,scale:.55,x:b[1]*1.23,y:b[2]*1.25,duration:.58,ease:'power2.in'},2.70+i*.035);
});

// Beat 2 — camera catches the orbiting ghost, then transfers to the hat ghost.
tl.to(camera,{x:62,y:-105,scale:1.13,rotation:-.36,duration:1.55,ease:'expo.inOut'},2.3);
tl.to('#ghostMain',{x:58,y:-16,scale:1.02,rotation:-4.2,rotationY:-7,duration:1.45,ease:'power3.inOut'},2.4);
tl.to('#ghostOrbit',{x:420,y:62,scale:.90,rotation:8.5,rotationY:12,duration:1.7,ease:'power2.inOut'},2.6);
tl.to('#ghostHat',{x:-88,y:-74,scale:1.09,rotation:4.8,rotationY:5,duration:1.65,ease:'power3.inOut'},2.45);
tl.to('#hatArm',{rotation:38,duration:.42,ease:'power3.out'},3.45);
tl.to('#hatArm',{rotation:-9,duration:.62,ease:'back.out(1.2)'},3.87);
tl.to('#witchHat',{rotation:8,x:8,y:-8,duration:.48,ease:'power2.out'},3.35);
tl.to('#witchHat',{rotation:-5,x:0,y:0,duration:.62,ease:'power2.inOut'},3.83);

// Candy and pumpkin accents react as secondary depth cues, not separate scenes.
tl.to('#candyRight',{rotation:-8,x:-18,y:20,duration:.72,ease:'power2.out'},3.1);
tl.to('#candyRight',{rotation:2,x:0,y:0,duration:.9,ease:'sine.inOut'},3.82);
tl.to('#pumpkinPatch',{y:-8,scale:1.025,rotation:.35,duration:.8,ease:'power2.out'},4.0);
tl.to('.pumpkinGlow',{opacity:.62,duration:.16,ease:'power2.inOut'},4.12);
tl.to('.pumpkinGlow',{opacity:1,duration:.34,ease:'power2.out'},4.28);

// Beat 3 — foreground peek ghost rises; camera follows and slightly overshoots.
tl.to('#ghostPeek',{x:-34,y:-138,scale:1.08,rotation:-4.5,rotationY:-5,duration:1.55,ease:'power3.inOut'},4.45);
tl.to(camera,{x:-44,y:54,scale:1.085,rotation:.23,duration:1.65,ease:'power3.inOut'},4.55);
tl.to('#peekArm',{rotation:-42,duration:.42,ease:'power3.out'},5.15);
tl.to('#peekArm',{rotation:9,duration:.62,ease:'back.out(1.25)'},5.57);
tl.to('#ghostMain',{x:12,y:42,scale:.97,rotation:3.8,rotationY:5,duration:1.75,ease:'sine.inOut'},4.8);
tl.to('#ghostHat',{x:-30,y:20,scale:.94,rotation:-3.5,rotationY:-5,duration:1.7,ease:'sine.inOut'},4.8);
tl.to('#ghostOrbit',{x:205,y:235,scale:.86,rotation:-4,rotationY:-6,duration:1.9,ease:'power2.inOut'},4.55);
tl.to('#moonHalo',{scale:1.08,opacity:1,duration:1.1,ease:'sine.inOut'},4.7);
tl.to('#moonHalo',{scale:1.02,opacity:.86,duration:1.2,ease:'sine.inOut'},5.8);

// Beat 4 — pull back for the ensemble payoff, then guide everything home.
tl.to(camera,{x:-18,y:8,scale:1.025,rotation:.08,duration:1.25,ease:'power2.inOut'},6.35);
tl.to('#ghostPeek',{x:-6,y:-70,scale:1.01,rotation:2.2,rotationY:3,duration:1.15,ease:'sine.inOut'},6.4);
tl.to('#ghostMain',{x:-38,y:-26,scale:1.01,rotation:-2.5,rotationY:-3,duration:1.1,ease:'power2.inOut'},6.45);
tl.to('#ghostHat',{x:34,y:-18,scale:1.00,rotation:3.2,rotationY:4,duration:1.15,ease:'power2.inOut'},6.45);
tl.to('#ghostOrbit',{x:75,y:82,scale:.95,rotation:4.8,rotationY:8,duration:1.35,ease:'power2.inOut'},6.35);
tl.to('#candyLeft',{rotation:7,x:22,y:-18,duration:.9,ease:'sine.inOut'},6.6);
tl.to('#pumpkinPatch',{y:4,scale:1.01,rotation:-.18,duration:1.0,ease:'sine.inOut'},6.6);

// Second tiny blink gives personality without breaking the loop.
tl.to('.mainEye',{scaleY:.12,duration:.07,ease:'power2.inOut'},7.18);
tl.to('.mainEye',{scaleY:1,duration:.09,ease:'power2.out'},7.25);

// Return path — every persistent layer lands on the exact opening state at 10s.
tl.to(camera,{x:0,y:42,scale:.97,rotation:-.22,duration:2.4,ease:'sine.inOut'},7.6);
tl.to('#ghostMain',{x:0,y:10,scale:1,rotation:-2.4,rotationY:-5,rotationX:1.5,duration:2.25,ease:'sine.inOut'},7.75);
tl.to('#ghostOrbit',{x:0,y:0,scale:.94,rotation:4.5,rotationY:8,duration:2.35,ease:'sine.inOut'},7.65);
tl.to('#ghostHat',{x:0,y:0,scale:.96,rotation:-4,rotationY:-7,duration:2.25,ease:'sine.inOut'},7.75);
tl.to('#ghostPeek',{x:28,y:168,scale:1.02,rotation:3.5,rotationY:5,duration:2.3,ease:'sine.inOut'},7.7);
tl.to('#moonWrap',{x:0,y:0,scale:1,rotation:-1.4,duration:2.25,ease:'sine.inOut'},7.75);
tl.to('#moonHalo',{scale:1,opacity:.82,duration:2.1,ease:'sine.inOut'},7.9);
tl.to('#cloudBack',{x:-45,y:0,duration:2.35,ease:'sine.inOut'},7.65);
tl.to('#cloudMid',{x:65,y:0,duration:2.4,ease:'sine.inOut'},7.6);
tl.to('#fogFront',{x:-40,y:0,opacity:.28,duration:2.35,ease:'sine.inOut'},7.65);
tl.to('#pumpkinPatch',{x:0,y:10,rotation:0,scale:1,duration:2.1,ease:'sine.inOut'},7.9);
tl.to('#candyLeft',{x:0,y:0,rotation:-2,duration:2.1,ease:'sine.inOut'},7.9);
tl.to('#candyRight',{x:0,y:0,rotation:2,duration:2.0,ease:'sine.inOut'},8.0);
tl.to('.pumpkinGlow',{opacity:.92,duration:1.5,ease:'sine.inOut'},8.5);

// Ensure the master timeline extends exactly to the loop boundary.
tl.set('#stage',{willChange:'auto'},10);

const q=new URLSearchParams(location.search);
if(q.has('debug'))debug.classList.add('on');
gsap.ticker.add(()=>{debug.textContent=tl.time().toFixed(2)+'s';});

window.MOTION_META={
  title:'Cute Spooky 3D Ghost Loop',
  format:'1080x1920 9:16',
  duration:10,
  camera_states:['MOVING','TRACKING','REFRAME','MOVING'],
  sfx_mode:'NONE',
  loop:'SEAMLESS_TARGET'
};
window.OPENER={
  W,H,DURATION,tl,ready:false,
  seek(t){tl.pause();tl.time(Math.max(0,Math.min(DURATION,t)),false);},
  play(){tl.play();}
};
Promise.resolve(document.fonts?.ready).then(()=>{
  window.OPENER.ready=true;
  if(!q.has('clean'))tl.play(0);
});
tl.eventCallback('onComplete',()=>{if(!q.has('clean'))tl.play(0);});
</script>
</body>
</html>
