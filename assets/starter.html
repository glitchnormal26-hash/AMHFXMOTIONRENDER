<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Wheel — Greenscreen 4K Render</title>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00ff00}
  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#00ff00}
  #gl{position:absolute;inset:0;width:1920px;height:1080px;display:block;background:transparent}
  #debug{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;padding:8px 12px;border-radius:8px;background:#000;color:#fff;font:14px/1 monospace}
  #debug.on{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="gl" width="1920" height="1080"></canvas></div>
<div id="debug">0.00s</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

const W=1920,H=1080,DURATION=10;
const stage=document.querySelector('#stage');
const canvas=document.querySelector('#gl');
const debug=document.querySelector('#debug');
const q=new URLSearchParams(location.search);
if(q.has('debug')) debug.classList.add('on');

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit);fit();

const renderScale=Math.max(1,Math.min(2,innerWidth/W,innerHeight/H));
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(renderScale);
renderer.setSize(W,H,false);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(44,W/H,0.1,100);
scene.add(camera);

const wheel=new THREE.Group();
scene.add(wheel);

const backingMat=new THREE.MeshPhysicalMaterial({
  color:0x111318,roughness:.3,metalness:.42,clearcoat:.8,clearcoatRoughness:.2
});
const accentMat=new THREE.MeshPhysicalMaterial({
  color:0xe9eef5,roughness:.18,metalness:.58,clearcoat:1,clearcoatRoughness:.14
});

function annularShape(innerR,outerR,a0,a1,steps=8){
  const s=new THREE.Shape();
  for(let i=0;i<=steps;i++){
    const a=a0+(a1-a0)*(i/steps);
    const x=Math.cos(a)*outerR,y=Math.sin(a)*outerR;
    if(i===0)s.moveTo(x,y);else s.lineTo(x,y);
  }
  for(let i=steps;i>=0;i--){
    const a=a0+(a1-a0)*(i/steps);
    s.lineTo(Math.cos(a)*innerR,Math.sin(a)*innerR);
  }
  s.closePath();
  return s;
}

function makeAnnularMesh(innerR,outerR,a0,a1,depth,material,bevel=.035){
  const geo=new THREE.ExtrudeGeometry(annularShape(innerR,outerR,a0,a1),{
    depth,steps:1,curveSegments:8,bevelEnabled:true,bevelSegments:3,
    bevelSize:bevel,bevelThickness:bevel
  });
  geo.translate(0,0,-depth/2);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,material);
}

const backing=makeAnnularMesh(1.0,4.34,0,Math.PI*2,.46,backingMat,.055);
backing.position.z=-.32;
wheel.add(backing);

const segments=[];
const outerCount=36;
for(let i=0;i<outerCount;i++){
  const gap=.018;
  const a0=i/outerCount*Math.PI*2+gap;
  const a1=(i+1)/outerCount*Math.PI*2-gap;
  const hue=i/outerCount;
  const c=new THREE.Color().setHSL(hue,.94,.52);
  const mat=new THREE.MeshPhysicalMaterial({
    color:c,emissive:c,emissiveIntensity:.22,roughness:.24,metalness:.12,
    clearcoat:.95,clearcoatRoughness:.16
  });
  const depth=.34+Math.sin(i*1.73)*.018;
  const mesh=makeAnnularMesh(2.03,4.20,a0,a1,depth,mat,.042);
  mesh.userData={phase:i*.61,baseZ:.03,baseEmissive:.22};
  wheel.add(mesh);segments.push(mesh);
}

const innerCount=24;
for(let i=0;i<innerCount;i++){
  const gap=.025;
  const a0=i/innerCount*Math.PI*2+gap;
  const a1=(i+1)/innerCount*Math.PI*2-gap;
  const hue=(i/innerCount+.021)%1;
  const c=new THREE.Color().setHSL(hue,.78,.45);
  const mat=new THREE.MeshPhysicalMaterial({
    color:c,emissive:c,emissiveIntensity:.15,roughness:.3,metalness:.16,
    clearcoat:.9,clearcoatRoughness:.2
  });
  const mesh=makeAnnularMesh(1.10,1.94,a0,a1,.25,mat,.034);
  mesh.position.z=.12;
  mesh.userData={phase:i*.83+1.4,baseZ:.12,baseEmissive:.15};
  wheel.add(mesh);segments.push(mesh);
}

const innerLip=makeAnnularMesh(.91,1.08,0,Math.PI*2,.30,accentMat,.028);
innerLip.position.z=.08;
wheel.add(innerLip);
const outerLip=makeAnnularMesh(4.22,4.34,0,Math.PI*2,.31,accentMat,.026);
outerLip.position.z=-.01;
wheel.add(outerLip);

const hemi=new THREE.HemisphereLight(0xffffff,0x283044,1.55);
scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,4.4);
key.position.set(-4.5,6.5,8.5);scene.add(key);
const rim=new THREE.PointLight(0xdbe8ff,88,35,1.7);
rim.position.set(6,-4,5);scene.add(rim);
const warm=new THREE.PointLight(0xffd8b0,42,28,1.9);
warm.position.set(-6,-1,4);scene.add(warm);

const state={
  camX:-.9,camY:.30,camZ:13.8,camRoll:-.018,
  wheelRotZ:0,wheelRotX:-.28,wheelRotY:.38,wheelScale:.92,
  dummy:0
};

function renderScene(t){
  wheel.rotation.set(state.wheelRotX,state.wheelRotY,state.wheelRotZ);
  wheel.scale.setScalar(state.wheelScale);
  camera.position.set(state.camX,state.camY,state.camZ);
  camera.up.set(Math.sin(state.camRoll),Math.cos(state.camRoll),0).normalize();
  camera.lookAt(0,0,0);

  for(const mesh of segments){
    const wave=Math.sin(t*2.15+mesh.userData.phase);
    mesh.position.z=mesh.userData.baseZ+wave*.028;
    mesh.material.emissiveIntensity=mesh.userData.baseEmissive+Math.max(0,wave)*.055;
  }
  renderer.render(scene,camera);
  debug.textContent=t.toFixed(2)+'s';
}

const tl=gsap.timeline({paused:true,defaults:{overwrite:false}});
// Beat 1 — deliberate angled inspection, then camera tracks toward the wheel.
tl.to(state,{wheelRotZ:2.15,wheelRotX:-.08,wheelRotY:.18,wheelScale:1.0,duration:2.4,ease:'power2.inOut'},0);
tl.to(state,{camX:.82,camY:-.15,camZ:11.25,camRoll:.012,duration:2.4,ease:'power2.inOut'},0);
// Beat 2 — pull-back/reframe to reveal depth and edge treatment.
tl.to(state,{wheelRotZ:4.45,wheelRotX:.18,wheelRotY:-.24,duration:1.9,ease:'power3.inOut'},2.4);
tl.to(state,{camX:-1.18,camY:.56,camZ:12.25,camRoll:-.022,duration:1.9,ease:'power3.inOut'},2.4);
// Beat 3 — speed-ramped cross-frame camera transfer.
tl.to(state,{wheelRotZ:7.35,wheelRotX:-.14,wheelRotY:.30,wheelScale:1.045,duration:1.8,ease:'expo.inOut'},4.3);
tl.to(state,{camX:1.32,camY:-.42,camZ:10.45,camRoll:.025,duration:1.8,ease:'expo.inOut'},4.3);
// Beat 4 — settle and present a clean hero framing.
tl.to(state,{wheelRotZ:9.55,wheelRotX:-.04,wheelRotY:.08,wheelScale:1.0,duration:1.9,ease:'power4.out'},6.1);
tl.to(state,{camX:.10,camY:.10,camZ:11.65,camRoll:0,duration:1.9,ease:'power4.out'},6.1);
// Beat 5 — return exactly to the opening pose with two complete revolutions total.
tl.to(state,{wheelRotZ:Math.PI*4,wheelRotX:-.28,wheelRotY:.38,wheelScale:.92,duration:2.0,ease:'sine.inOut'},8.0);
tl.to(state,{camX:-.9,camY:.30,camZ:13.8,camRoll:-.018,duration:2.0,ease:'sine.inOut'},8.0);
tl.to(state,{dummy:1,duration:.001,ease:'none'},9.999);

tl.eventCallback('onUpdate',()=>renderScene(tl.time()));
renderScene(0);

window.OPENER={
  W,H,DURATION,tl,ready:false,
  seek(t){
    const clamped=Math.max(0,Math.min(DURATION,t));
    tl.pause();
    tl.time(clamped,false);
    renderScene(clamped);
  },
  play(){tl.play();}
};

Promise.resolve(document.fonts?.ready).then(()=>{
  window.OPENER.ready=true;
  if(!q.has('clean')) tl.play(0);
});
tl.eventCallback('onComplete',()=>{if(!q.has('clean')) tl.play(0);});
</script>
</body>
</html>
