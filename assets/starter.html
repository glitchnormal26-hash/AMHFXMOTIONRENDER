<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Designer v3.9 — Neutral Starter</title>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{--bg:#101318;--surface:#202733;--ink:#f5f7fb;--muted:#8d98a8;--accent:#c8d0dc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:radial-gradient(circle at 30% 25%,#27313f 0,#161b22 34%,var(--bg) 72%)}
#world{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.grid{position:absolute;inset:-80px;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:88px 88px}
.hero{position:absolute;left:180px;top:270px;width:1180px;font-size:112px;line-height:.92;letter-spacing:-.05em;font-weight:700;opacity:0;will-change:transform,opacity}
.hero small{display:block;margin-bottom:26px;font-size:28px;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
#orb{position:absolute;right:170px;top:315px;width:300px;height:300px;border-radius:50%;background:linear-gradient(145deg,#f3f6fb,var(--accent) 54%,#667386);box-shadow:0 55px 130px rgba(0,0,0,.38);opacity:0;will-change:transform,opacity}
#ring{position:absolute;right:95px;top:240px;width:450px;height:450px;border:3px solid rgba(255,255,255,.24);border-radius:50%;opacity:0;will-change:transform,opacity}
#tag{position:absolute;left:184px;bottom:150px;padding:18px 26px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.06);font-size:26px;letter-spacing:.02em;opacity:0}
#debug{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;padding:10px 14px;border-radius:10px;background:#050608;color:white;font:14px monospace}
#debug.on{display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="grid"></div>
    <div class="hero" id="hero"><small>Neutral render fixture</small>Motion Designer v3.9</div>
    <div id="ring"></div>
    <div id="orb"></div>
    <div id="tag">OPENER-compatible · deterministic</div>
  </div>
</div>
<div id="debug">0.00s</div>
<script>
const W=1920,H=1080,DURATION=9;
const stage=document.querySelector('#stage');
const world=document.querySelector('#world');
const debug=document.querySelector('#debug');
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();

const tl=gsap.timeline({paused:true});
tl.fromTo('#hero',{opacity:0,y:90,scale:.94},{opacity:1,y:0,scale:1,duration:.9,ease:'power4.out'},.25);
tl.fromTo('#orb',{opacity:0,scale:.25,rotation:-18},{opacity:1,scale:1,rotation:0,duration:.9,ease:'back.out(1.6)'},.65);
tl.fromTo('#ring',{opacity:0,scale:.45},{opacity:.75,scale:1,duration:.85,ease:'power3.out'},.78);
tl.fromTo('#tag',{opacity:0,y:35},{opacity:1,y:0,duration:.55,ease:'power3.out'},1.35);
tl.to(world,{scale:1.18,x:-115,y:42,duration:1.15,ease:'power2.inOut'},2.7);
tl.to('#orb',{x:-230,y:90,scale:1.25,rotation:24,duration:1.05,ease:'power3.inOut'},3.0);
tl.to('#ring',{x:-230,y:90,scale:1.3,rotation:-18,duration:1.05,ease:'power3.inOut'},3.0);
tl.to(world,{scale:1,x:0,y:0,duration:1.1,ease:'power3.inOut'},5.2);
tl.to('#orb,#ring',{x:0,y:0,scale:1,rotation:0,duration:1.0,ease:'power3.out'},5.25);
tl.to('#hero,#orb,#ring,#tag',{opacity:0,y:-35,duration:.6,ease:'power2.in'},8.05);
tl.to({},{duration:.01},8.99);

const q=new URLSearchParams(location.search);
if(q.has('debug'))debug.classList.add('on');
gsap.ticker.add(()=>{debug.textContent=tl.time().toFixed(2)+'s';});
window.OPENER={W,H,DURATION,tl,ready:false,seek(t){tl.pause();tl.time(Math.max(0,Math.min(DURATION,t)),false);},play(){tl.play();}};
Promise.resolve(document.fonts?.ready).then(()=>{window.OPENER.ready=true;if(!q.has('clean'))tl.play(0);});
tl.eventCallback('onComplete',()=>{if(!q.has('clean'))tl.play(0);});
</script>
</body>
</html>
