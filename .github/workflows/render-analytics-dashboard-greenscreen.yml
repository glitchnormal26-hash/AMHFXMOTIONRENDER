name: Render Analytics Dashboard Greenscreen 4K

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/analytics-dashboard-greenscreen.html'
      - '.github/workflows/render-analytics-dashboard-greenscreen.yml'
      - 'scripts/export-mp4.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: analytics-dashboard-greenscreen-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-4k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Render 4K 60fps 10s final MP4
        run: |
          mkdir -p output
          env INDEX=assets/analytics-dashboard-greenscreen.html \
            QUALITY=final FPS=60 WIDTH=3840 HEIGHT=2160 \
            CRF=16 PRESET=medium \
            OUT_VIDEO=output/analytics-dashboard-greenscreen-4k.mp4 \
            npm run render:ffmpeg
      - name: Verify 4K delivery contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='output/analytics-dashboard-greenscreen-4k.verify.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.status!=='TECHNICAL_VERIFIED') throw new Error('status='+r.status);
          if(r.video?.codec_name!=='h264') throw new Error('codec='+r.video?.codec_name);
          if(r.video?.width!==3840 || r.video?.height!==2160) throw new Error('size='+r.video?.width+'x'+r.video?.height);
          if(r.video?.r_frame_rate!=='60/1') throw new Error('fps='+r.video?.r_frame_rate);
          if(Math.abs(Number(r.duration)-10)>0.08) throw new Error('duration='+r.duration);
          if(r.audio!==null) throw new Error('unexpected audio stream');
          NODE
      - name: Extract visual QA frames
        run: |
          ffmpeg -y -i output/analytics-dashboard-greenscreen-4k.mp4 \
            -vf "select='eq(n,0)+eq(n,75)+eq(n,150)+eq(n,300)+eq(n,450)+eq(n,570)'" \
            -fps_mode vfr output/analytics-qa-%02d.png
          ffmpeg -y -i output/analytics-dashboard-greenscreen-4k.mp4 \
            -vf "select='eq(n,0)+eq(n,75)+eq(n,150)+eq(n,300)+eq(n,450)+eq(n,570)',scale=960:-1,tile=3x2" \
            -frames:v 1 output/analytics-contact-sheet.png
      - name: Record SHA256 and file sizes
        run: |
          sha256sum output/analytics-dashboard-greenscreen-4k.mp4 > output/analytics-sha256.txt
          stat -c '%n %s bytes' output/analytics-dashboard-greenscreen-4k.mp4 output/analytics-dashboard-greenscreen-4k.verify.json > output/analytics-sizes.txt
          cat output/analytics-sizes.txt
          cat output/analytics-sha256.txt
      - name: Upload 4K deliverable and QA evidence
        uses: actions/upload-artifact@v7
        with:
          name: analytics-dashboard-greenscreen-4k
          path: |
            output/analytics-dashboard-greenscreen-4k.mp4
            output/analytics-dashboard-greenscreen-4k.verify.json
            output/analytics-qa-*.png
            output/analytics-contact-sheet.png
            output/analytics-sha256.txt
            output/analytics-sizes.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
