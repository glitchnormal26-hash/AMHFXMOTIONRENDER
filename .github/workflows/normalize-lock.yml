name: Normalize dependency lock

on:
  push:
    branches: [chore/streamline-ffmpeg-pipeline]
    paths:
      - '.github/workflows/normalize-lock.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: normalize-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor == 'glitchnormal26-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/streamline-ffmpeg-pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Puppeteer and regenerate lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm install puppeteer@25.10.0 --save --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit canonical lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already canonical.'
            exit 0
          fi
          git commit -m 'Upgrade Puppeteer and refresh lockfile'
          git push origin HEAD:chore/streamline-ffmpeg-pipeline
