name: Upgrade Puppeteer lockfile

on:
  push:
    branches:
      - chore/remove-project-specific-main-assets

permissions:
  contents: write

concurrency:
  group: upgrade-puppeteer-lock
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-project-specific-main-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Puppeteer and regenerate lockfile
        run: npm install 'puppeteer@^25.11.0' --save
      - name: Block high-severity advisories
        run: npm audit --audit-level=high
      - name: Run repository checks
        run: npm run check
      - name: Commit regenerated manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "fix: upgrade Puppeteer to 25.11.0"
          git push origin HEAD:chore/remove-project-specific-main-assets
