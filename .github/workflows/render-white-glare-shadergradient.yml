name: Render White Glare ShaderGradient 4K

on:
  push:
    branches:
      - feat/white-glare-shadergradient-4k
    paths:
      - 'delivery/white-glare-shadergradient-4k/**'
      - '.github/workflows/render-white-glare-shadergradient.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'delivery/white-glare-shadergradient-4k/**'
      - '.github/workflows/render-white-glare-shadergradient.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: delivery/white-glare-shadergradient-4k
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build

      - name: Render 10 UHD JPEGs
        run: npm run render
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Verify outputs
        run: |
          test "$(find output -maxdepth 1 -name '*.jpg' | wc -l)" -eq 10
          node -e "const m=require('./output/manifest.json'); if(m.width!==3840||m.height!==2160||m.presets.length!==10) process.exit(1); console.log(m.presets.map(x=>x.name+' '+x.bytes+' bytes').join('\\n'))"

      - name: Upload 4K JPG pack
        uses: actions/upload-artifact@v4
        with:
          name: white-glare-shadergradient-4k-jpg
          path: |
            delivery/white-glare-shadergradient-4k/output/*.jpg
            delivery/white-glare-shadergradient-4k/output/manifest.json
          if-no-files-found: error
          compression-level: 6
