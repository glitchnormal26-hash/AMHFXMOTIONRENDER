name: Render SaaS Ads Explainer 9x16

on:
  push:
    branches:
      - chatgpt/saas-ads-explainer-20260912
    paths:
      - 'SKILL.md'
      - 'references/camera-motion.md'
      - 'runtime/camera-framing.js'
      - 'runtime/index.js'
      - 'scripts/audit-framing.mjs'
      - 'package.json'
      - 'assets/saas-ads-explainer-9x16.html'
      - '.github/workflows/render-saas-ads-explainer.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm ci

      - name: Run Motion Designer checks
        run: npm run check

      - name: Audit camera framing and hard cuts
        run: |
          env INDEX=assets/saas-ads-explainer-9x16.html WIDTH=1080 HEIGHT=1920 \
            npm run audit:framing

      - name: Create deterministic hi-tech SFX and ambience
        run: |
          mkdir -p audio output
          ffmpeg -y \
            -f lavfi -i "anullsrc=r=48000:cl=stereo:d=17.2" \
            -f lavfi -i "sine=frequency=1300:duration=0.055:sample_rate=48000" \
            -f lavfi -i "sine=frequency=640:duration=0.11:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1900:duration=0.07:sample_rate=48000" \
            -f lavfi -i "sine=frequency=310:duration=0.18:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1180:duration=0.08:sample_rate=48000" \
            -f lavfi -i "sine=frequency=760:duration=0.12:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1480:duration=0.08:sample_rate=48000" \
            -f lavfi -i "sine=frequency=920:duration=0.10:sample_rate=48000" \
            -filter_complex "[1:a]volume=.65,adelay=320|320[s1];[2:a]volume=.42,adelay=1870|1870[s2];[3:a]volume=.50,adelay=4720|4720[s3];[4:a]volume=.38,adelay=5400|5400[s4];[5:a]volume=.68,adelay=6160|6160[s5];[6:a]volume=.44,adelay=7150|7150[s6];[7:a]volume=.48,adelay=9950|9950[s7];[8:a]volume=.65,adelay=15390|15390[s8];[0:a][s1][s2][s3][s4][s5][s6][s7][s8]amix=inputs=9:duration=first:dropout_transition=0,highpass=f=120,alimiter=limit=.82[sfx]" \
            -map "[sfx]" -c:a pcm_s16le audio/sfx-mix.wav
          ffmpeg -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.025:d=17.2:r=48000" \
            -af "highpass=f=240,lowpass=f=3500,volume=.45" -ac 2 -c:a pcm_s16le audio/ambience.wav

      - name: Render 1080x1920 final MP4
        run: |
          env INDEX=assets/saas-ads-explainer-9x16.html \
            QUALITY=final FPS=60 WIDTH=1080 HEIGHT=1920 CRF=15 PRESET=slow \
            REQUIRE_AUDIO=1 SFX=audio/sfx-mix.wav AMBIENCE=audio/ambience.wav \
            SFX_GAIN=.82 AMBIENCE_GAIN=.16 \
            OUT_VIDEO=output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.mp4 \
            npm run export:mp4

      - name: Verify render contract
        run: |
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate -show_entries format=duration -of json output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.mp4 > output/ffprobe.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('output/ffprobe.json','utf8'));
          const v=p.streams.find(s=>s.codec_type==='video');
          const a=p.streams.find(s=>s.codec_type==='audio');
          const d=Number(p.format.duration);
          if(v?.codec_name!=='h264') throw new Error(`video codec=${v?.codec_name}`);
          if(v?.width!==1080 || v?.height!==1920) throw new Error(`size=${v?.width}x${v?.height}`);
          if(!a || a.codec_name!=='aac') throw new Error(`audio codec=${a?.codec_name}`);
          if(Math.abs(d-17.2)>.25) throw new Error(`duration=${d}`);
          console.log('VIDEO_CONTRACT=PASS');
          NODE

      - name: Extract visual QA frames
        run: |
          for spec in "01-hook:0.65" "02-chat:2.80" "03-drag:5.55" "04-ramp:6.86" "05-preview:8.65" "06-game:10.15" "07-proof:12.10" "08-cta:15.90"; do
            name="${spec%%:*}"; t="${spec##*:}";
            ffmpeg -y -ss "$t" -i output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.mp4 -frames:v 1 "output/qa-${name}.png" >/dev/null 2>&1;
          done
          sha256sum output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.mp4 > output/sha256.txt
          cat output/ffprobe.json
          cat output/sha256.txt

      - name: Upload final delivery and QA
        uses: actions/upload-artifact@v4
        with:
          name: amhfxmotionrender-saas-ads-explainer-9x16-framing-fixed
          path: |
            output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.mp4
            output/AMHFXMOTIONRENDER-saas-ads-explainer-9x16.verify.json
            output/ffprobe.json
            output/sha256.txt
            output/qa-*.png
          if-no-files-found: error
          retention-days: 14
