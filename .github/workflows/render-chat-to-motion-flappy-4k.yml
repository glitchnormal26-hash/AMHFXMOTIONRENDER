name: Render Chat to Motion Flappy 4K

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/chat-to-motion-flappy-4k
    paths:
      - 'delivery/chat-to-motion-flappy/**'
      - '.github/workflows/render-chat-to-motion-flappy-4k.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Verify typography safe lanes
        shell: bash
        run: |
          set -o pipefail
          node delivery/chat-to-motion-flappy/qa-layout.mjs | tee output-layout-qa.json
          grep -q 'TYPOGRAPHY_CLEAR' output-layout-qa.json
      - name: Build hi-tech SFX mix
        run: |
          mkdir -p audio output qa-chat-to-motion
          ffmpeg -y \
            -f lavfi -i "anoisesrc=color=pink:duration=16.8:sample_rate=48000:amplitude=0.006" \
            -f lavfi -i "sine=frequency=980:duration=0.08:sample_rate=48000" \
            -f lavfi -i "sine=frequency=420:duration=0.12:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1450:duration=0.07:sample_rate=48000" \
            -f lavfi -i "sine=frequency=690:duration=0.12:sample_rate=48000" \
            -f lavfi -i "sine=frequency=1180:duration=0.16:sample_rate=48000" \
            -filter_complex "[1:a]adelay=2850|2850,volume=.22[a1];[2:a]adelay=4560|4560,volume=.34[a2];[3:a]adelay=6150|6150,volume=.20[a3];[4:a]adelay=8120|8120,volume=.30[a4];[5:a]adelay=13350|13350,volume=.28[a5];[0:a][a1][a2][a3][a4][a5]amix=inputs=6:duration=longest:normalize=0,highpass=f=90,alimiter=limit=.82[out]" \
            -map "[out]" -c:a pcm_s16le audio/chat-to-motion-sfx.wav
      - name: Render verified 4K MP4
        env:
          INDEX: delivery/chat-to-motion-flappy/index.html
          QUALITY: final
          FPS: '30'
          WIDTH: '3840'
          HEIGHT: '2160'
          CRF: '16'
          PRESET: medium
          REQUIRE_AUDIO: '1'
          SFX: audio/chat-to-motion-sfx.wav
          SFX_GAIN: '1.0'
          OUT_VIDEO: output/chat-to-motion-flappy-4k.mp4
        run: npm run export:mp4
      - name: Verify final contract
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -show_entries format=duration -of json output/chat-to-motion-flappy-4k.mp4 > output/chat-to-motion-flappy-4k.ffprobe.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('output/chat-to-motion-flappy-4k.ffprobe.json','utf8'));
          const v=p.streams.find(s=>s.codec_type==='video');
          const a=p.streams.find(s=>s.codec_type==='audio');
          const d=Number(p.format.duration);
          if(!v||v.codec_name!=='h264'||v.width!==3840||v.height!==2160) throw new Error('4K H.264 contract failed');
          if(!a||a.codec_name!=='aac') throw new Error('AAC audio contract failed');
          if(Math.abs(d-16.8)>.3) throw new Error('Duration contract failed: '+d);
          fs.writeFileSync('output/chat-to-motion-flappy-4k.status.txt','FINAL_VISUAL_VERIFIED\n');
          console.log('FINAL_VISUAL_VERIFIED', {duration:d,video:v.codec_name,audio:a.codec_name,resolution:`${v.width}x${v.height}`});
          NODE
      - name: Extract visual QA frames
        run: |
          for t in 1.6 3.4 4.7 6.8 8.6 10.4 12.0 14.0 16.2; do
            ffmpeg -y -ss "$t" -i output/chat-to-motion-flappy-4k.mp4 -frames:v 1 "qa-chat-to-motion/frame-${t}.png" >/dev/null 2>&1
          done
      - name: Record checksum
        run: sha256sum output/chat-to-motion-flappy-4k.mp4 > output/chat-to-motion-flappy-4k.sha256.txt
      - name: Upload final delivery
        uses: actions/upload-artifact@v4
        with:
          name: chat-to-motion-flappy-4k-final
          retention-days: 14
          if-no-files-found: error
          path: |
            output/chat-to-motion-flappy-4k.mp4
            output/chat-to-motion-flappy-4k.ffprobe.json
            output/chat-to-motion-flappy-4k.status.txt
            output/chat-to-motion-flappy-4k.sha256.txt
            output-layout-qa.json
            qa-chat-to-motion/*.png
