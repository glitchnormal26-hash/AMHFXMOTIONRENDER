name: Deliver Halloween Dramatic Copyspace 30s

on:
  push:
    branches:
      - deliver/halloween-dramatic-copyspace-30s
    paths:
      - 'delivery/halloween-dramatic-copyspace/**'
      - '.github/workflows/deliver-halloween-dramatic-copyspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install locked dependencies
        run: npm ci

      - name: Install local Three.js render dependency
        run: npm install --no-save --package-lock=false three@0.161.0

      - name: Prepare offline render copy
        run: |
          cp node_modules/three/build/three.module.js delivery/halloween-dramatic-copyspace/three.module.js
          cp delivery/halloween-dramatic-copyspace/index.html delivery/halloween-dramatic-copyspace/render.html
          python - <<'PY'
          from pathlib import Path
          p = Path('delivery/halloween-dramatic-copyspace/render.html')
          s = p.read_text().replace(
              'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js',
              './three.module.js'
          )
          p.write_text(s)
          PY

      - name: Configure exporter for software WebGL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/export-mp4.mjs')
          s = p.read_text()
          old = '''      "--enable-gpu",\n      "--ignore-gpu-blocklist"'''
          new = '''      "--enable-gpu",\n      "--ignore-gpu-blocklist",\n      "--use-gl=angle",\n      "--use-angle=swiftshader",\n      "--enable-unsafe-swiftshader",\n      "--disable-gpu-sandbox"'''
          if old not in s:
              raise SystemExit('exporter flag block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run skill/runtime checks
        run: npm run check

      - name: Smoke-test Three.js scene bootstrap
        run: |
          mkdir -p output
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import puppeteer from 'puppeteer';
          const browser=await puppeteer.launch({
            headless:'new',
            args:[
              '--allow-file-access-from-files',
              '--enable-gpu',
              '--ignore-gpu-blocklist',
              '--use-gl=angle',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--disable-gpu-sandbox'
            ]
          });
          const page=await browser.newPage();
          page.on('console',m=>console.log(`browser ${m.type()}: ${m.text()}`));
          page.on('pageerror',e=>console.error(`PAGEERROR: ${e.message}`));
          await page.setViewport({width:1920,height:1080,deviceScaleFactor:1});
          const url=pathToFileURL(path.resolve('delivery/halloween-dramatic-copyspace/render.html')).href+'?clean=1';
          await page.goto(url,{waitUntil:'load',timeout:60000});
          await page.waitForFunction(()=>window.OPENER?.ready===true,{timeout:30000});
          const state=await page.evaluate(()=>({ready:window.OPENER.ready,duration:window.OPENER.DURATION}));
          if(state.duration!==30) throw new Error(`duration=${state.duration}`);
          await page.screenshot({path:'output/smoke.png'});
          console.log(state);
          await browser.close();
          NODE

      - name: Render deterministic 30s 1080p MP4
        run: |
          env \
            INDEX=delivery/halloween-dramatic-copyspace/render.html \
            QUALITY=fast \
            FPS=30 \
            WIDTH=1920 \
            HEIGHT=1080 \
            CRF=17 \
            PRESET=medium \
            OUT_VIDEO=output/halloween-dramatic-copyspace-30s-1080p.mp4 \
            npm run export:mp4

      - name: Verify delivery contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='output/halloween-dramatic-copyspace-30s-1080p.mp4'
          REPORT='output/halloween-dramatic-copyspace-30s-1080p.verify.json'
          test -s "$FILE"
          test -s "$REPORT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('output/halloween-dramatic-copyspace-30s-1080p.verify.json','utf8'));
          if(r.status!=='FINAL_VERIFIED') throw new Error(`status=${r.status}`);
          if(r.video?.codec_name!=='h264') throw new Error(`codec=${r.video?.codec_name}`);
          if(r.video?.width!==1920||r.video?.height!==1080) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if(Math.abs(Number(r.duration)-30)>0.12) throw new Error(`duration=${r.duration}`);
          if(r.audio!==null) throw new Error('Unexpected audio stream');
          NODE
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$FILE")
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$FILE")
          test "$FPS" = '30/1'
          case "$PIX" in yuv420p|yuvj420p) ;; *) echo "Unexpected pixel format: $PIX"; exit 1 ;; esac

      - name: Extract representative visual QA frames
        shell: bash
        run: |
          set -euo pipefail
          FILE='output/halloween-dramatic-copyspace-30s-1080p.mp4'
          ffmpeg -y -ss 0.0  -i "$FILE" -frames:v 1 output/qa-00s.png
          ffmpeg -y -ss 4.5  -i "$FILE" -frames:v 1 output/qa-04_5s.png
          ffmpeg -y -ss 9.0  -i "$FILE" -frames:v 1 output/qa-09s.png
          ffmpeg -y -ss 15.0 -i "$FILE" -frames:v 1 output/qa-15s.png
          ffmpeg -y -ss 22.5 -i "$FILE" -frames:v 1 output/qa-22_5s.png
          ffmpeg -y -ss 29.5 -i "$FILE" -frames:v 1 output/qa-29_5s.png
          sha256sum "$FILE" > output/halloween-dramatic-copyspace-30s-1080p.sha256

      - name: Upload delivery and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: halloween-dramatic-copyspace-30s-1080p
          path: |
            delivery/halloween-dramatic-copyspace/index.html
            delivery/halloween-dramatic-copyspace/render.html
            delivery/halloween-dramatic-copyspace/three.module.js
            output/halloween-dramatic-copyspace-30s-1080p.mp4
            output/halloween-dramatic-copyspace-30s-1080p.verify.json
            output/halloween-dramatic-copyspace-30s-1080p.sha256
            output/smoke.png
            output/qa-*.png
          if-no-files-found: error
          retention-days: 14
