name: Render Cute Spooky Ghosts 10s Vertical

on:
  workflow_dispatch:
  push:
    branches:
      - render/cute-spooky-ghosts-10s
    paths:
      - 'assets/cute-spooky-ghosts-3d-loop-vertical.html'
      - '.github/workflows/render-cute-spooky-ghosts.yml'
      - 'runtime/**'
      - 'scripts/export-mp4.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: render-cute-spooky-ghosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Render 10s Cute Spooky Ghosts 1080x1920 at 60fps
        run: |
          mkdir -p output
          env INDEX=assets/cute-spooky-ghosts-3d-loop-vertical.html \
            QUALITY=final FPS=60 WIDTH=1080 HEIGHT=1920 CRF=16 PRESET=medium \
            OUT_VIDEO=output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 \
            npm run render:ffmpeg
      - name: Verify technical delivery contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/cute-spooky-ghosts-3d-loop-1080x1920.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 1080 || r.video?.height !== 1920) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (r.video?.r_frame_rate !== '60/1') throw new Error(`fps=${r.video?.r_frame_rate}`);
          if (Math.abs(Number(r.duration) - 10) > 0.12) throw new Error(`duration=${r.duration}`);
          if (r.audio !== null) throw new Error('Render unexpectedly contains audio');
          NODE
      - name: Extract loop seam and visual QA frames
        run: |
          ffmpeg -y -i output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 \
            -vf "select='eq(n,0)'" -frames:v 1 output/loop-first.png
          ffmpeg -y -i output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 \
            -vf "select='eq(n,599)'" -frames:v 1 output/loop-last.png
          ffmpeg -y -i output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 \
            -vf "select='eq(n,0)+eq(n,120)+eq(n,240)+eq(n,360)+eq(n,480)+eq(n,599)'" \
            -fps_mode vfr output/qa-frame-%02d.png
      - name: Verify loop seam similarity
        run: |
          ffmpeg -i output/loop-first.png -i output/loop-last.png \
            -lavfi ssim -f null - 2> output/loop-ssim.txt || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('output/loop-ssim.txt', 'utf8');
          const m = text.match(/All:([0-9.]+)/);
          if (!m) throw new Error('Could not read SSIM loop score');
          const ssim = Number(m[1]);
          console.log(`Loop seam SSIM=${ssim}`);
          if (ssim < 0.97) throw new Error(`Loop seam too visible: SSIM=${ssim}`);
          fs.writeFileSync('output/loop-score.txt', `Loop seam SSIM=${ssim}\n`);
          NODE
      - name: Record artifact hash
        run: |
          stat -c '%n %s bytes' output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 output/cute-spooky-ghosts-3d-loop-1080x1920.verify.json > output/artifact-info.txt
          sha256sum output/cute-spooky-ghosts-3d-loop-1080x1920.mp4 > output/sha256.txt
          cat output/artifact-info.txt
          cat output/loop-score.txt
          cat output/sha256.txt
      - name: Upload Cute Spooky Ghosts render
        uses: actions/upload-artifact@v4
        with:
          name: cute-spooky-ghosts-3d-loop-1080x1920
          path: |
            output/cute-spooky-ghosts-3d-loop-1080x1920.mp4
            output/cute-spooky-ghosts-3d-loop-1080x1920.verify.json
            output/loop-first.png
            output/loop-last.png
            output/loop-score.txt
            output/loop-ssim.txt
            output/qa-frame-*.png
            output/artifact-info.txt
            output/sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
