name: Patch Remotion input bridge

on:
  push:
    branches: [chore/streamline-ffmpeg-pipeline]
    paths:
      - '.github/workflows/patch-remotion-input.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'glitchnormal26-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/streamline-ffmpeg-pipeline
      - name: Pass scene HTML and base into Remotion workers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/export-remotion.mjs')
          s = p.read_text()
          old = """  const inputProps = {\n    sceneFile,\n    width,"""
          new = """  const inputProps = {\n    sceneFile,\n    sceneHtml,\n    sceneBase,\n    width,"""
          if old not in s:
              raise SystemExit('expected inputProps block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/export-remotion.mjs
          git commit -m 'Pass OPENER source into Remotion workers'
          git push origin HEAD:chore/streamline-ffmpeg-pipeline
