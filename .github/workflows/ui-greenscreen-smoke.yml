name: UI Greenscreen Visual Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ui-greenscreen-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture scene 02 visual smoke
        env:
          URL: "file://${{ github.workspace }}/projects/ui-greenscreen/index.html?scene=scene-02-notifications&clean=1"
          TIMES: '1.5,5,9'
          WIDTH: '1920'
          HEIGHT: '1080'
          OUT: output/visual-smoke
        run: node scripts/snap.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-greenscreen-visual-smoke
          path: output/visual-smoke/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
