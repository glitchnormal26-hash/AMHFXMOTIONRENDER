name: Render Halloween Vertical 4K

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/halloween-spooky-3d-vertical.html'
      - '.github/workflows/render-halloween-vertical.yml'
      - 'runtime/**'
      - 'scripts/export-mp4.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: render-halloween-vertical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Render 15s Halloween 9x16 4K
        run: |
          mkdir -p output
          env INDEX=assets/halloween-spooky-3d-vertical.html \
            QUALITY=final FPS=24 WIDTH=2160 HEIGHT=3840 CRF=17 PRESET=medium \
            OUT_VIDEO=output/halloween-spooky-3d-vertical-4k.mp4 \
            npm run render:ffmpeg
      - name: Verify render contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/halloween-spooky-3d-vertical-4k.verify.json', 'utf8'));
          if (r.status !== 'FINAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 2160 || r.video?.height !== 3840) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (Math.abs(Number(r.duration) - 15) > 0.2) throw new Error(`duration=${r.duration}`);
          if (r.audio !== null) throw new Error('Halloween background unexpectedly contains audio');
          NODE
      - name: Extract visual QA frames
        run: |
          ffmpeg -y -i output/halloween-spooky-3d-vertical-4k.mp4 \
            -vf "select='eq(n,0)+eq(n,72)+eq(n,144)+eq(n,216)+eq(n,288)+eq(n,359)'" \
            -fps_mode vfr output/halloween-frame-%02d.png
      - name: Record artifact hash
        run: |
          stat -c '%n %s bytes' output/halloween-spooky-3d-vertical-4k.mp4 output/halloween-spooky-3d-vertical-4k.verify.json > output/artifact-info.txt
          sha256sum output/halloween-spooky-3d-vertical-4k.mp4 > output/sha256.txt
          cat output/artifact-info.txt
          cat output/sha256.txt
      - name: Upload Halloween 4K render
        uses: actions/upload-artifact@v4
        with:
          name: halloween-spooky-3d-vertical-4k
          path: |
            output/halloween-spooky-3d-vertical-4k.mp4
            output/halloween-spooky-3d-vertical-4k.verify.json
            output/halloween-frame-*.png
            output/artifact-info.txt
            output/sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
