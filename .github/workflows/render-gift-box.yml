name: Render Gift Box 4K Greenscreen

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'scripts/render-gift-box.mjs'
      - 'scripts/export-mp4.mjs'
      - '.github/workflows/render-gift-box.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Render 10s 4K MP4
        run: npm run render:gift-box

      - name: Upload verified MP4
        uses: actions/upload-artifact@v4
        with:
          name: gift-box-greenscreen-4k
          path: |
            output/gift-box-greenscreen-4k.mp4
            output/gift-box-greenscreen-4k.verify.json
          if-no-files-found: error
          retention-days: 14
