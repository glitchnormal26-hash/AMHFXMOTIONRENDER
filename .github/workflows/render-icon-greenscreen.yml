name: Render icon greenscreen pack
on:
  workflow_dispatch:
  push:
    branches:
      - feat/icon-greenscreen-pack
    paths:
      - 'assets/icon-greenscreen.html'
      - 'assets/icon-greenscreen.js'
      - 'scripts/render-icon-greenscreen-pack.mjs'
      - 'scripts/export-mp4.mjs'
      - 'package.json'
      - '.github/workflows/render-icon-greenscreen.yml'

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        resolution: [1080p, 4k]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Allow Chromium user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check repository
        run: npm run check
      - name: Render 10 MP4 files
        env:
          RESOLUTION: ${{ matrix.resolution }}
          FPS: '30'
        run: node scripts/render-icon-greenscreen-pack.mjs
      - name: Upload rendered MP4s
        uses: actions/upload-artifact@v4
        with:
          name: icon-greenscreen-${{ matrix.resolution }}
          path: output/icon-greenscreen/${{ matrix.resolution }}/
          if-no-files-found: error
          retention-days: 7
