name: Deliver Halloween Border Green MP4

on:
  push:
    branches: [main]
    paths:
      - 'delivery/halloween-border-green/**'
      - '.github/workflows/deliver-halloween-border-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install isolated Remotion dependencies
        working-directory: delivery/halloween-border-green
        run: npm install

      - name: Render delivery mirror
        working-directory: delivery/halloween-border-green
        run: |
          mkdir -p ../../motra-output
          npx remotion render remotion/index.ts HalloweenBorderGreen ../../motra-output/halloween-border-green-16x9-10s.mp4 \
            --codec=h264 \
            --crf=15 \
            --pixel-format=yuv420p \
            --concurrency=2

      - name: ffprobe QA
        shell: bash
        run: |
          set -euo pipefail
          FILE='motra-output/halloween-border-green-16x9-10s.mp4'
          test -s "$FILE"
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$FILE")
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$FILE")
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$FILE")
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$FILE")
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$FILE")
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")
          echo "codec=$CODEC size=${WIDTH}x${HEIGHT} fps=$FPS pix_fmt=$PIX duration=$DURATION"
          test "$CODEC" = 'h264'
          test "$WIDTH" = '1920'
          test "$HEIGHT" = '1080'
          test "$FPS" = '30/1'
          case "$PIX" in yuv420p|yuvj420p) ;; *) exit 1 ;; esac
          awk -v d="$DURATION" 'BEGIN { if (d < 9.95 || d > 10.05) exit 1 }'
          sha256sum "$FILE" > motra-output/halloween-border-green-16x9-10s.sha256

      - name: Publish MP4 to public motra-output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f motra-output/halloween-border-green-16x9-10s.mp4 motra-output/halloween-border-green-16x9-10s.sha256
          git commit -m 'Publish Halloween border green MP4' || exit 0
          git push origin HEAD:main
