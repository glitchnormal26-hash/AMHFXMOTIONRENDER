name: Deliver Halloween Border Green MP4

on:
  push:
    branches: [main]
    paths:
      - 'delivery/halloween-border-green/**'
      - '.github/workflows/deliver-halloween-border-green.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliver-halloween-border-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install isolated legacy delivery dependencies
        working-directory: delivery/halloween-border-green
        run: npm install
      - name: Render isolated legacy delivery
        working-directory: delivery/halloween-border-green
        run: |
          mkdir -p ../../output
          npx remotion render remotion/index.ts HalloweenBorderGreen ../../output/halloween-border-green-16x9-10s.mp4 \
            --codec=h264 \
            --crf=15 \
            --pixel-format=yuv420p \
            --concurrency=2
      - name: ffprobe QA
        shell: bash
        run: |
          set -euo pipefail
          FILE='output/halloween-border-green-16x9-10s.mp4'
          test -s "$FILE"
          CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$FILE")
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$FILE")
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$FILE")
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$FILE")
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$FILE")
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")
          echo "codec=$CODEC size=${WIDTH}x${HEIGHT} fps=$FPS pix_fmt=$PIX duration=$DURATION"
          test "$CODEC" = 'h264'
          test "$WIDTH" = '1920'
          test "$HEIGHT" = '1080'
          test "$FPS" = '30/1'
          case "$PIX" in yuv420p|yuvj420p) ;; *) exit 1 ;; esac
          awk -v d="$DURATION" 'BEGIN { if (d < 9.95 || d > 10.05) exit 1 }'
          sha256sum "$FILE" > output/halloween-border-green-16x9-10s.sha256
      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: halloween-border-green-16x9-10s
          path: |
            output/halloween-border-green-16x9-10s.mp4
            output/halloween-border-green-16x9-10s.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
