name: Patch Remotion browser resolver

on:
  push:
    branches: [chore/streamline-ffmpeg-pipeline]
    paths:
      - '.github/workflows/patch-remotion-browser.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'glitchnormal26-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/streamline-ffmpeg-pipeline
      - name: Patch browser executable resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/export-remotion.mjs')
          s = p.read_text()
          old = "  const browserExecutable = env.PUPPETEER_EXECUTABLE_PATH || puppeteer.executablePath();"
          new = """  const browserExecutable = env.PUPPETEER_EXECUTABLE_PATH ||\n    await Promise.resolve(puppeteer.executablePath());\n  if (!browserExecutable || !fs.existsSync(browserExecutable)) {\n    throw new Error(`Puppeteer browser executable not found: ${browserExecutable || 'empty path'}`);\n  }"""
          if old not in s:
              raise SystemExit('expected browserExecutable assignment not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/export-remotion.mjs
          git commit -m 'Resolve async Puppeteer executable for Remotion'
          git push origin HEAD:chore/streamline-ffmpeg-pipeline
