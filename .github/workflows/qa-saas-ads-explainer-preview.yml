name: QA SaaS Ads Explainer Preview

on:
  push:
    branches:
      - chatgpt/saas-ads-explainer-20260912
    paths:
      - '.github/workflows/qa-saas-ads-explainer-preview.yml'
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm ci
      - name: Apply QA coordinate fix
        run: sed -i 's/inset:-420px/inset:0/' assets/saas-ads-explainer-9x16.html
      - name: Render lightweight deterministic preview
        run: |
          mkdir -p output
          env INDEX=assets/saas-ads-explainer-9x16.html QUALITY=fast FPS=15 WIDTH=540 HEIGHT=960 CRF=22 PRESET=ultrafast OUT_VIDEO=output/qa-preview.mp4 npm run export:mp4
      - name: Extract QA frames
        run: |
          for spec in "01-hook:0.65" "02-chat:2.80" "03-drag:5.55" "04-ramp:6.86" "05-preview:8.65" "06-game:10.15" "07-proof:12.10" "08-cta:15.90"; do
            name="${spec%%:*}"; t="${spec##*:}";
            ffmpeg -y -ss "$t" -i output/qa-preview.mp4 -frames:v 1 "output/qa-${name}.png" >/dev/null 2>&1;
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amhfxmotionrender-saas-ads-qa-preview-fixed
          path: |
            output/qa-preview.mp4
            output/qa-*.png
          if-no-files-found: error
          retention-days: 2
