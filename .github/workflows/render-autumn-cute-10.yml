name: Debug Autumn Three.js Preflight

on:
  push:
    branches: [main]
    paths:
      - 'delivery/autumn-cute-10/**'
      - '.github/workflows/render-autumn-cute-10.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enable Chromium user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts three@0.161.0
      - name: Start local HTTP server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/autumn-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/delivery/autumn-cute-10/01-maple-frame.html >/dev/null && curl -fsS http://127.0.0.1:8000/node_modules/three/build/three.module.js >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/autumn-http.log
          exit 1
      - name: Browser diagnostic with SwiftShader
        env:
          SCENE_URL: http://127.0.0.1:8000/delivery/autumn-cute-10/01-maple-frame.html?clean=1
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer';
          const browser=await puppeteer.launch({headless:'new',args:['--allow-file-access-from-files','--autoplay-policy=no-user-gesture-required','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
          const page=await browser.newPage();
          page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.error('PAGE_ERROR',e.stack||e.message));
          page.on('requestfailed',r=>console.error('REQUEST_FAILED',r.url(),r.failure()?.errorText));
          await page.setViewport({width:1920,height:1080,deviceScaleFactor:1});
          const resp=await page.goto(process.env.SCENE_URL,{waitUntil:'networkidle0',timeout:30000});
          console.log('HTTP_STATUS',resp?.status());
          await new Promise(r=>setTimeout(r,2000));
          const state=await page.evaluate(()=>({opener:window.OPENER||null,canvas:!!document.querySelector('canvas'),webgl:(()=>{try{return !!document.querySelector('canvas')?.getContext('webgl2')||!!document.querySelector('canvas')?.getContext('webgl')}catch{return false}})()}));
          console.log('STATE',JSON.stringify(state));
          await browser.close();
          if(!state.opener?.ready||!state.webgl) process.exit(2);
          NODE
