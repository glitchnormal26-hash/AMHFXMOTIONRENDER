name: Check HyperFrames core skills

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'skills-lock.json'
      - '.github/workflows/install-hyperframes-skills.yml'
  push:
    branches:
      - main
    paths:
      - '.agents/skills/**'
      - 'skills-lock.json'
      - '.github/workflows/install-hyperframes-skills.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve latest HyperFrames core skills project-locally
        run: |
          npx -y skills add heygen-com/hyperframes \
            --skill hyperframes \
            --skill hyperframes-animation \
            --skill hyperframes-audio \
            --skill hyperframes-cli \
            --skill hyperframes-core \
            --skill hyperframes-creative \
            --skill hyperframes-keyframes \
            --skill hyperframes-registry \
            --skill media-use \
            --agent universal \
            --copy \
            --yes

      - name: Verify checked-in skills are current
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .agents/skills skills-lock.json; then
            echo "HyperFrames Core Skills are current."
            exit 0
          fi

          echo "Checked-in HyperFrames skills are stale. Regenerate them on a branch and merge through a reviewed PR." >&2
          git diff --stat -- .agents/skills skills-lock.json
          exit 1
