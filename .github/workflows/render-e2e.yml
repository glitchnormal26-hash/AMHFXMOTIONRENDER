name: Render E2E QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'runtime/**'
      - 'scripts/export-mp4.mjs'
      - 'scripts/export-frames.mjs'
      - 'scripts/render-production.mjs'
      - 'scripts/finalize-verification.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'runtime/**'
      - 'scripts/export-mp4.mjs'
      - 'scripts/export-frames.mjs'
      - 'scripts/render-production.mjs'
      - 'scripts/finalize-verification.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render-e2e.yml'

permissions:
  contents: read

concurrency:
  group: render-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run code and skill checks
        run: npm run check
      - name: Render lightweight PR smoke via streaming transport
        run: |
          mkdir -p output
          env INDEX=assets/starter.html QUALITY=fast FPS=10 WIDTH=1280 HEIGHT=720 \
            CRF=20 PRESET=veryfast OUT_VIDEO=output/e2e-pr.mp4 npm run render:ffmpeg
      - name: Verify PR smoke contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/e2e-pr.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.frame_transport !== 'stream') throw new Error(`transport=${r.frame_transport}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 1280 || r.video?.height !== 720) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (Math.abs(Number(r.duration) - 9) > 0.25) throw new Error(`duration=${r.duration}`);
          NODE
      - name: Extract PR visual evidence
        run: |
          ffmpeg -y -i output/e2e-pr.mp4 \
            -vf "select='eq(n,0)+eq(n,45)+eq(n,89)'" -fps_mode vfr output/pr-frame-%02d.png
      - uses: actions/upload-artifact@v7
        with:
          name: motion-v3.9.4-pr-smoke
          path: |
            output/e2e-pr.mp4
            output/e2e-pr.verify.json
            output/pr-frame-*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  full-regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run code and skill checks
        run: npm run check
      - name: Prepare deterministic audio fixture
        run: |
          mkdir -p audio output
          ffmpeg -y -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=2" \
            -c:a pcm_s16le audio/test-voice.wav
      - name: Render neutral 9s 4K MP4 via streaming transport
        run: |
          /usr/bin/time -v -o output/benchmark-4k.txt \
            env INDEX=assets/starter.html QUALITY=final FPS=30 WIDTH=3840 HEIGHT=2160 \
            CRF=16 PRESET=medium OUT_VIDEO=output/e2e-4k.mp4 npm run render:ffmpeg
      - name: Verify 4K render contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/e2e-4k.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.frame_transport !== 'stream') throw new Error(`transport=${r.frame_transport}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 3840 || r.video?.height !== 2160) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (Math.abs(Number(r.duration) - 9) > 0.2) throw new Error(`duration=${r.duration}`);
          if (r.audio !== null) throw new Error('4K baseline unexpectedly contains audio');
          NODE
      - name: Render audio and VO mux smoke test
        run: |
          /usr/bin/time -v -o output/benchmark-audio.txt \
            env INDEX=assets/starter.html QUALITY=fast FPS=30 WIDTH=1280 HEIGHT=720 CRF=18 PRESET=veryfast \
            REQUIRE_AUDIO=1 REQUIRE_VO=1 VOICEOVER=audio/test-voice.wav \
            OUT_VIDEO=output/e2e-audio.mp4 npm run render:ffmpeg
      - name: Verify audio render contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/e2e-audio.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.frame_transport !== 'stream') throw new Error(`transport=${r.frame_transport}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 1280 || r.video?.height !== 720) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (r.audio?.codec_name !== 'aac') throw new Error(`audio codec=${r.audio?.codec_name}`);
          if (Math.abs(Number(r.duration) - 9) > 0.2) throw new Error(`duration=${r.duration}`);
          if (!r.audio_sources?.voiceover?.endsWith('audio/test-voice.wav')) throw new Error('voiceover fixture was not used');
          NODE
      - name: Render file-transport compatibility smoke
        run: |
          env INDEX=assets/starter.html QUALITY=fast FPS=5 WIDTH=640 HEIGHT=360 \
            FRAME_TRANSPORT=files CRF=22 PRESET=veryfast \
            OUT_VIDEO=output/e2e-files.mp4 npm run render:ffmpeg
      - name: Verify file-transport fallback
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/e2e-files.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.frame_transport !== 'files') throw new Error(`transport=${r.frame_transport}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          NODE
      - name: Extract visual QA frames
        run: |
          ffmpeg -y -i output/e2e-4k.mp4 \
            -vf "select='eq(n,0)+eq(n,135)+eq(n,269)'" -fps_mode vfr output/qa-frame-%02d.png
      - name: Record artifact sizes and hashes
        run: |
          stat -c '%n %s bytes' output/*.mp4 output/*.verify.json > output/artifact-sizes.txt
          sha256sum output/*.mp4 output/qa-frame-*.png > output/sha256.txt
          cat output/artifact-sizes.txt
          cat output/sha256.txt
          echo '--- 4K benchmark ---'
          cat output/benchmark-4k.txt
          echo '--- audio benchmark ---'
          cat output/benchmark-audio.txt
      - name: Upload E2E evidence
        uses: actions/upload-artifact@v7
        with:
          name: motion-v3.9.4-e2e-qa
          path: |
            output/e2e-4k.mp4
            output/e2e-4k.verify.json
            output/e2e-audio.mp4
            output/e2e-audio.verify.json
            output/e2e-files.mp4
            output/e2e-files.verify.json
            output/benchmark-4k.txt
            output/benchmark-audio.txt
            output/artifact-sizes.txt
            output/sha256.txt
            output/qa-frame-*.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  ai-automation-4k:
    if: github.event_name == 'pull_request' && github.head_ref == 'render/ai-automation-10-4k'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { concept: 1, slug: signal-routing }
          - { concept: 2, slug: inbox-triage }
          - { concept: 3, slug: data-enrichment }
          - { concept: 4, slug: document-extraction }
          - { concept: 5, slug: support-escalation }
          - { concept: 6, slug: human-approval-gate }
          - { concept: 7, slug: browser-task-runner }
          - { concept: 8, slug: data-sync-bridge }
          - { concept: 9, slug: scheduled-agent }
          - { concept: 10, slug: multi-agent }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Reconstruct temporary render source
        run: |
          cat render/ai-automation-10/source.tgz.b64.part* | base64 -d | tar -xzf - -C render/ai-automation-10
          node --check render/ai-automation-10/app.js
      - name: Render concept in 4K
        run: |
          mkdir -p output
          env URL="file://$GITHUB_WORKSPACE/render/ai-automation-10/index.html?clean=1&concept=\${{ matrix.concept }}" \
            QUALITY=final FPS=30 WIDTH=3840 HEIGHT=2160 CRF=12 PRESET=veryfast \
            OUT_VIDEO="output/source-\${{ matrix.slug }}.mp4" npm run render:ffmpeg
      - name: Encode medium-bitrate delivery
        run: |
          ffmpeg -y -i "output/source-\${{ matrix.slug }}.mp4" -an \
            -c:v libx264 -preset medium -b:v 20M -maxrate 24M -bufsize 40M \
            -pix_fmt yuv420p -movflags +faststart \
            "output/\${{ matrix.slug }}-4k.mp4"
          rm -f "output/source-\${{ matrix.slug }}.mp4"
      - name: Verify delivery and create QA sheet
        run: |
          ffprobe -v error \
            -show_entries format=duration,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate \
            -of json "output/\${{ matrix.slug }}-4k.mp4" > "output/\${{ matrix.slug }}-ffprobe.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const slug = process.env.SLUG;
          const r = JSON.parse(fs.readFileSync('output/' + slug + '-ffprobe.json', 'utf8'));
          const v = (r.streams || []).find(s => s.codec_type === 'video');
          if (!v) throw new Error('missing video stream');
          if (v.codec_name !== 'h264') throw new Error('codec=' + v.codec_name);
          if (v.width !== 3840 || v.height !== 2160) throw new Error('size=' + v.width + 'x' + v.height);
          if (v.r_frame_rate !== '30/1') throw new Error('fps=' + v.r_frame_rate);
          const d = Number(r.format?.duration || 0);
          if (Math.abs(d - 6) > 0.25) throw new Error('duration=' + d);
          NODE
          ffmpeg -y -i "output/\${{ matrix.slug }}-4k.mp4" \
            -vf "fps=1,scale=960:-1,tile=3x2" -frames:v 1 "output/\${{ matrix.slug }}-contact.png"
          sha256sum "output/\${{ matrix.slug }}-4k.mp4" > "output/\${{ matrix.slug }}-sha256.txt"
        env:
          SLUG: \${{ matrix.slug }}
      - name: Upload individual 4K deliverable
        uses: actions/upload-artifact@v7
        with:
          name: ai-automation-\${{ matrix.concept }}-\${{ matrix.slug }}-4k
          path: |
            output/\${{ matrix.slug }}-4k.mp4
            output/\${{ matrix.slug }}-ffprobe.json
            output/\${{ matrix.slug }}-contact.png
            output/\${{ matrix.slug }}-sha256.txt
            output/source-\${{ matrix.slug }}.verify.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  ai-automation-package:
    if: github.event_name == 'pull_request' && github.head_ref == 'render/ai-automation-10-4k'
    needs: ai-automation-4k
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download all rendered concepts
        uses: actions/download-artifact@v8
        with:
          pattern: ai-automation-*-4k
          path: collected
          merge-multiple: true
      - name: Package videos and stock CSV metadata
        run: |
          mkdir -p package/videos package/metadata
          cp collected/*-4k.mp4 package/videos/
          cp render/ai-automation-10/adobe_stock_ai_automation_10.csv package/metadata/
          cp render/ai-automation-10/shutterstock_ai_automation_10.csv package/metadata/
          cp collected/*-ffprobe.json package/metadata/
          cp collected/*-contact.png package/metadata/
          cp collected/*-sha256.txt package/metadata/
          count=$(find package/videos -maxdepth 1 -name '*.mp4' | wc -l)
          test "$count" -eq 10
          (cd package && zip -r -0 ../ai-automation-workflows-10-4k.zip videos metadata)
          sha256sum ai-automation-workflows-10-4k.zip > ai-automation-workflows-10-4k.zip.sha256.txt
      - name: Upload complete ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ai-automation-workflows-10-4k-complete
          path: |
            ai-automation-workflows-10-4k.zip
            ai-automation-workflows-10-4k.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
