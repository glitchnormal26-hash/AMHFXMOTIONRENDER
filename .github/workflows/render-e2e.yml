name: Power Off Greenscreen 4K Preview

on:
  pull_request:
    paths:
      - 'projects/poweroff-greenscreen/**'
      - '.github/workflows/render-e2e.yml'
      - 'runtime/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: poweroff-greenscreen-4k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Render 10s 4K technical preview
        run: |
          mkdir -p output
          env INDEX=projects/poweroff-greenscreen/scene.html QUALITY=final FPS=30 WIDTH=3840 HEIGHT=2160 \
            CRF=16 PRESET=medium OUT_VIDEO=output/poweroff-greenscreen-4k.mp4 npm run render:ffmpeg
      - name: Verify render contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/poweroff-greenscreen-4k.verify.json', 'utf8'));
          if (r.status !== 'TECHNICAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 3840 || r.video?.height !== 2160) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (Math.abs(Number(r.duration) - 10) > 0.20) throw new Error(`duration=${r.duration}`);
          if (r.audio !== null) throw new Error('preview unexpectedly contains audio');
          NODE
      - name: Extract visual QA frames
        run: |
          ffmpeg -y -i output/poweroff-greenscreen-4k.mp4 \
            -vf "select='eq(n,0)+eq(n,45)+eq(n,105)+eq(n,180)+eq(n,255)+eq(n,299)'" \
            -fps_mode vfr output/poweroff-frame-%02d.png
      - name: Record checksum
        run: |
          sha256sum output/poweroff-greenscreen-4k.mp4 > output/sha256.txt
          cat output/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: poweroff-greenscreen-4k-preview
          path: |
            output/poweroff-greenscreen-4k.mp4
            output/poweroff-greenscreen-4k.verify.json
            output/poweroff-frame-*.png
            output/sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
