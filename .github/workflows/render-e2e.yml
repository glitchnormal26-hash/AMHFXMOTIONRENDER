name: AI Origin Vertical Render

on:
  pull_request:
    paths:
      - 'assets/ai-origin-explainer.html'
      - '.github/workflows/render-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ai-origin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Render 9:16 final MP4
        run: |
          mkdir -p output
          env INDEX=assets/ai-origin-explainer.html QUALITY=final FPS=30 WIDTH=1080 HEIGHT=1920 \
            CRF=16 PRESET=medium OUT_VIDEO=output/ai-origin-vertical.mp4 npm run render:ffmpeg
      - name: Verify final contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('output/ai-origin-vertical.verify.json', 'utf8'));
          if (r.status !== 'FINAL_VERIFIED') throw new Error(`status=${r.status}`);
          if (r.video?.codec_name !== 'h264') throw new Error(`video codec=${r.video?.codec_name}`);
          if (r.video?.width !== 1080 || r.video?.height !== 1920) throw new Error(`size=${r.video?.width}x${r.video?.height}`);
          if (Math.abs(Number(r.duration) - 13.2) > 0.25) throw new Error(`duration=${r.duration}`);
          if (r.audio !== null) throw new Error('render unexpectedly contains audio');
          NODE
      - name: Extract visual QA frames
        run: |
          ffmpeg -y -i output/ai-origin-vertical.mp4 \
            -vf "select='eq(n,0)+eq(n,75)+eq(n,135)+eq(n,205)+eq(n,285)+eq(n,390)'" \
            -fps_mode vfr output/qa-frame-%02d.png
      - name: Hash artifacts
        run: |
          sha256sum output/ai-origin-vertical.mp4 output/qa-frame-*.png > output/sha256.txt
          cat output/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-origin-vertical-final
          path: |
            output/ai-origin-vertical.mp4
            output/ai-origin-vertical.verify.json
            output/qa-frame-*.png
            output/sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
