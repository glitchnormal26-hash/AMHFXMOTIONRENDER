name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Block high-severity dependency advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - run: python -m py_compile scripts/serve.py
      - name: Verify creative-gate example
        run: |
          CREATIVE_REPORT=/tmp/example.creative.verify.json \
            node scripts/check-creative-gates.mjs references/production-manifest.example.json
          node -e "const r=require('/tmp/example.creative.verify.json'); if(r.status!=='CREATIVE_VERIFIED') process.exit(1)"
      - name: Verify final-status combiner
        run: |
          cat > /tmp/example.technical.verify.json <<'JSON'
          {
            "status": "DRAFT",
            "technical_status": "TECHNICAL_VERIFIED",
            "output": "/tmp/example.mp4",
            "duration": 10,
            "video": {"codec_name":"h264","width":1920,"height":1080},
            "audio": null
          }
          JSON
          FINAL_REPORT=/tmp/example.final.verify.json \
            node scripts/finalize-verification.mjs \
              /tmp/example.technical.verify.json \
              /tmp/example.creative.verify.json
          node -e "const r=require('/tmp/example.final.verify.json'); if(r.status!=='FINAL_VERIFIED'||r.technical_status!=='TECHNICAL_VERIFIED'||r.creative_status!=='CREATIVE_VERIFIED') process.exit(1)"
      - name: Enforce renderer and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/render-motra.mjs
          test ! -d motra-output
          test ! -d delivery
          unexpected_workflows=""
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$workflow" ] || continue
            base="$(basename "$workflow")"
            case "$base" in
              deliver-*.yml|deliver-*.yaml|render-*.yml|render-*.yaml)
                case "$base" in
                  render-e2e.yml|render-e2e.yaml) ;;
                  *) unexpected_workflows="$unexpected_workflows$workflow"$'\n' ;;
                esac
                ;;
            esac
          done
          if [ -n "$unexpected_workflows" ]; then
            echo 'Project-specific delivery/render workflows must not live on main.' >&2
            printf '%s' "$unexpected_workflows"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const dir = ".github/workflows";
          const workflowNames = fs.readdirSync(dir).filter(name => /\.ya?ml$/.test(name));
          const contentsWrite = new RegExp("^\\s*contents:\\s*" + "write" + "\\s*(?:#.*)?$", "m");
          const directPush = new RegExp("(^|\\s)git\\s+" + "push(?:\\s|$)", "m");

          for (const name of workflowNames) {
            const relative = path.join(dir, name);
            const body = fs.readFileSync(relative, "utf8");
            if (contentsWrite.test(body)) {
              throw new Error(`${relative} requests repository write permission; source updates must go through reviewed PRs.`);
            }
            if (directPush.test(body)) {
              throw new Error(`${relative} performs a direct VCS push; source updates must go through reviewed PRs.`);
            }
          }
          NODE
          if [ -d videos ]; then
            echo 'Top-level videos/ is reserved for project-specific work and must not live on main.' >&2
            find videos -maxdepth 3 -type f -print
            exit 1
          fi
          unexpected_assets="$(find assets -maxdepth 1 -type f ! -name 'starter*.html' -print)"
          if [ -n "$unexpected_assets" ]; then
            echo 'Top-level assets/ files on main must be neutral starter architectures.' >&2
            printf '%s\n' "$unexpected_assets"
            exit 1
          fi
          if git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256' | grep -q .; then
            echo 'Generated render media/checksums must not be committed.' >&2
            git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256'
            exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.scripts['render:ffmpeg'] || !p.scripts['render:production'] || !p.scripts['check:creative'] || p.scripts['render:motra']) process.exit(1)"
