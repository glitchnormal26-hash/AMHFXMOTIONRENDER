name: QA

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install check dependencies
        run: npm ci --ignore-scripts
      - name: Run static checks
        run: npm run check
      - name: Compile local server helper
        run: python3 -m py_compile scripts/serve.py
