name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m py_compile scripts/serve.py
      - name: Enforce renderer and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/render-motra.mjs
          test ! -d motra-output
          if git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256' | grep -q .; then
            echo 'Generated render media/checksums must not be committed.' >&2
            git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256'
            exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.scripts['render:ffmpeg'] || p.scripts['render:motra']) process.exit(1)"
