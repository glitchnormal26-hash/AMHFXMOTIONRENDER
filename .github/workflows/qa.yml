name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: python -m py_compile scripts/serve.py
      - name: Enforce renderer and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/render-motra.mjs
          test ! -d motra-output
          test ! -d delivery
          if find .github/workflows -maxdepth 1 -type f \( -name 'deliver-*.yml' -o -name 'deliver-*.yaml' -o -name 'render-autumn-cute-10.yml' \) | grep -q .; then
            echo 'Project-specific delivery/render workflows must not live on main.' >&2
            find .github/workflows -maxdepth 1 -type f \( -name 'deliver-*.yml' -o -name 'deliver-*.yaml' -o -name 'render-autumn-cute-10.yml' \)
            exit 1
          fi
          if git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256' | grep -q .; then
            echo 'Generated render media/checksums must not be committed.' >&2
            git ls-files '*.mp4' '*.mov' '*.webm' '*.sha256'
            exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.scripts['render:ffmpeg'] || !p.scripts['render:remotion'] || p.scripts['render:motra']) process.exit(1)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
            throw new Error(`package-lock root version must match package.json (${pkg.version})`);
          }
          if (Object.keys(lock.packages).some(p => /node_modules\/(?:@remotion\/|remotion(?:\/|$))/.test(p))) {
            throw new Error('Remotion must stay isolated from the root package-lock; use remotion/package.json');
          }
          const optional = JSON.parse(fs.readFileSync('remotion/package.json'));
          for (const name of ['remotion', '@remotion/renderer', '@remotion/bundler']) {
            if (optional.dependencies?.[name] !== '4.0.524') {
              throw new Error(`${name} must be pinned to 4.0.524`);
            }
          }
          NODE
