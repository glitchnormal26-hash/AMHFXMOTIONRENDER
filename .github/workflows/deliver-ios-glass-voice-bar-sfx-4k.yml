name: Deliver Frosted iOS Voice Bar 4K

on:
  push:
    branches: [main]
    paths:
      - 'delivery/ios-glass-voice-bar-sfx-4k/**'
      - '.github/workflows/deliver-ios-glass-voice-bar-sfx-4k.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliver-ios-glass-voice-bar-4k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        run: npm ci
      - name: Validate renderer
        run: npm run check
      - name: Enable Chromium sandbox on Ubuntu 24
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Render text-free 10s 4K 60fps picture
        env:
          INDEX: delivery/ios-glass-voice-bar-sfx-4k/index.html
          OUT_VIDEO: output/ios-glass-voice-bar-4k-16x9-10s.mp4
          QUALITY: final
          WIDTH: '3840'
          HEIGHT: '2160'
          FPS: '60'
          CRF: '16'
          PRESET: medium
        run: npm run render:ffmpeg
      - name: ffprobe QA
        shell: bash
        run: |
          set -euo pipefail
          FILE='output/ios-glass-voice-bar-4k-16x9-10s.mp4'
          test -s "$FILE"
          VCODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$FILE")
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$FILE")
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$FILE")
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$FILE")
          PIX=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$FILE")
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")
          AUDIO_COUNT=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$FILE" | wc -l)
          echo "video=$VCODEC ${WIDTH}x${HEIGHT} fps=$FPS pix=$PIX audio_streams=$AUDIO_COUNT duration=$DURATION"
          test "$VCODEC" = 'h264'
          test "$WIDTH" = '3840'
          test "$HEIGHT" = '2160'
          test "$FPS" = '60/1'
          case "$PIX" in yuv420p|yuvj420p) ;; *) exit 1 ;; esac
          test "$AUDIO_COUNT" = '0'
          awk -v d="$DURATION" 'BEGIN { if (d < 9.95 || d > 10.05) exit 1 }'
          sha256sum "$FILE" > output/ios-glass-voice-bar-4k-16x9-10s.sha256
      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: ios-glass-voice-bar-4k-16x9-10s
          path: |
            output/ios-glass-voice-bar-4k-16x9-10s.mp4
            output/ios-glass-voice-bar-4k-16x9-10s.verify.json
            output/ios-glass-voice-bar-4k-16x9-10s.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
