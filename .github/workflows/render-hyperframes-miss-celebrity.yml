name: Render HyperFrames Miss Celebrity 10s

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - videos/miss-celebrity-10s-src/RENDER_REQUEST

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify repository motion runtime
        run: |
          npm ci
          npm run check

      - name: Reconstruct supplied product asset
        shell: bash
        run: |
          set -euo pipefail
          SRC="videos/miss-celebrity-10s-src"
          mkdir -p "$SRC/assets"
          if [ ! -f "$SRC/assets/product.webp" ]; then
            cat "$SRC"/asset.b64.part* | base64 -d > "$SRC/assets/product.webp"
          fi
          test -s "$SRC/assets/product.webp"
          file "$SRC/assets/product.webp"

      - name: Initialize clean HyperFrames project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/videos/miss-celebrity-10s-src"
          OUT="/tmp/miss-celebrity-10s"
          rm -rf "$OUT"
          npx -y hyperframes init "$OUT" --non-interactive --example=blank
          cp "$SRC/index.html" "$OUT/index.html"
          cp "$SRC/DESIGN.md" "$OUT/DESIGN.md"
          cp "$SRC/BRIEF.md" "$OUT/BRIEF.md"
          mkdir -p "$OUT/assets"
          cp "$SRC/assets/product.webp" "$OUT/assets/product.webp"

      - name: HyperFrames lint
        working-directory: /tmp/miss-celebrity-10s
        run: npx -y hyperframes lint

      - name: HyperFrames validate
        working-directory: /tmp/miss-celebrity-10s
        run: npx -y hyperframes validate

      - name: HyperFrames visual inspect
        working-directory: /tmp/miss-celebrity-10s
        run: npx -y hyperframes inspect --samples 15

      - name: Render 10s vertical MP4
        working-directory: /tmp/miss-celebrity-10s
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders
          npx -y hyperframes render \
            --output renders/miss-celebrity-10s.mp4 \
            --fps 30 \
            --quality high
          echo "Encoded duration:"
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            renders/miss-celebrity-10s.mp4

      - name: Persist decoded product asset
        shell: bash
        run: |
          set -euo pipefail
          SRC="videos/miss-celebrity-10s-src"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SRC/assets/product.webp"
          git rm -f "$SRC"/asset.b64.part* || true
          if git diff --cached --quiet; then
            echo "No asset persistence changes."
          else
            git commit -m "chore: persist Miss Celebrity product asset"
            git push
          fi

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: miss-celebrity-hyperframes-10s
          path: /tmp/miss-celebrity-10s/renders/miss-celebrity-10s.mp4
          if-no-files-found: error
          retention-days: 30
