<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Off Greenscreen</title>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{--green:#00ff00;--icon:#ffffff;--icon-dim:#e8e8e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green)}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  position:fixed;left:50%;top:50%;width:2160px;height:3840px;
  transform:translate(-50%,-50%);transform-origin:center;
  overflow:hidden;background:var(--green)
}
#world{
  position:absolute;inset:0;transform-origin:50% 48%;
  will-change:transform
}
#iconWrap{
  position:absolute;left:50%;top:48%;
  width:1120px;height:1120px;
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  will-change:transform,opacity
}
svg{display:block;width:100%;height:100%;overflow:visible}
.power-stroke{
  fill:none;stroke:var(--icon);stroke-width:86;
  stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke
}
#mainRing{stroke-dasharray:100;stroke-dashoffset:100}
#stem{will-change:transform,opacity}
#pulse{
  fill:none;stroke:#fff;stroke-width:18;opacity:0;
  transform-origin:500px 530px;will-change:transform,opacity
}
#shutdownHalo{
  fill:none;stroke:#fff;stroke-width:10;opacity:0;
  transform-origin:500px 530px;will-change:transform,opacity
}
#blackout{
  position:absolute;inset:0;background:#000;opacity:0;z-index:20;
  will-change:opacity
}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="iconWrap">
      <svg viewBox="0 0 1000 1000" aria-hidden="true">
        <circle id="pulse" cx="500" cy="530" r="405"/>
        <circle id="shutdownHalo" cx="500" cy="530" r="405"/>
        <path id="mainRing" class="power-stroke" pathLength="100"
          d="M300 285 C155 385 105 560 160 720 C218 888 385 980 550 960 C735 938 870 795 885 615 C897 470 830 350 700 285"/>
        <path id="stem" class="power-stroke" d="M500 110 L500 470"/>
      </svg>
    </div>
  </div>
  <div id="blackout"></div>
</div>

<script>
const W=2160,H=3840,DURATION=10;
const stage=document.querySelector('#stage');
const world=document.querySelector('#world');
const fit=()=>{
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
};
addEventListener('resize',fit);fit();

const tl=gsap.timeline({paused:true});
gsap.set('#iconWrap',{opacity:1,scale:.88,rotation:0});
gsap.set('#stem',{opacity:0,y:-145});
gsap.set('#mainRing',{strokeDashoffset:100});
gsap.set('#pulse,#shutdownHalo',{opacity:0,scale:.82});
gsap.set('#blackout',{opacity:0});
gsap.set(world,{scale:.965,y:38});

tl.to('#mainRing',{strokeDashoffset:0,duration:1.05,ease:'power3.out'},.22);
tl.to('#stem',{opacity:1,y:0,duration:.72,ease:'power4.out'},.48);
tl.to('#iconWrap',{scale:1,duration:.78,ease:'back.out(1.45)'},.52);
tl.to(world,{scale:1.02,y:0,duration:1.15,ease:'power2.out'},.38);

tl.to('#pulse',{opacity:.42,scale:1,duration:.18,ease:'power2.out'},1.55);
tl.to('#pulse',{opacity:0,scale:1.24,duration:.72,ease:'power3.out'},1.73);
tl.to(world,{scale:1.055,y:-38,duration:1.05,ease:'sine.inOut'},2.05);
tl.to('#iconWrap',{scale:1.025,duration:.7,ease:'sine.inOut'},2.18);
tl.to('#iconWrap',{scale:1,duration:.8,ease:'sine.inOut'},2.88);
tl.to(world,{scale:1.015,y:10,duration:1.1,ease:'sine.inOut'},3.1);

tl.to(world,{scale:1.105,y:58,duration:.62,ease:'power3.inOut'},4.18);
tl.to('#pulse',{opacity:.5,scale:.92,duration:.12,ease:'power2.out'},4.42);
tl.to('#pulse',{opacity:0,scale:1.31,duration:.65,ease:'power4.out'},4.54);
tl.to('#stem',{y:78,duration:.22,ease:'power3.in'},4.5);
tl.to('#iconWrap',{scale:.94,duration:.22,ease:'power3.in'},4.5);
tl.to('#stem',{y:0,duration:.38,ease:'back.out(2.0)'},4.72);
tl.to('#iconWrap',{scale:1.045,duration:.34,ease:'back.out(1.7)'},4.72);
tl.to('#iconWrap',{scale:1,duration:.42,ease:'power2.out'},5.06);
tl.to(world,{scale:1.06,y:12,duration:.72,ease:'power3.out'},5.0);

tl.to('#shutdownHalo',{opacity:.44,scale:.88,duration:.12,ease:'power2.out'},5.62);
tl.to('#shutdownHalo',{opacity:0,scale:1.38,duration:.9,ease:'power4.out'},5.74);
tl.to('#mainRing',{stroke:'#e8e8e8',duration:.16,ease:'none'},5.65);
tl.to('#stem',{stroke:'#e8e8e8',duration:.16,ease:'none'},5.65);

tl.to(world,{scale:1.16,y:88,duration:.62,ease:'power3.in'},6.05);
tl.to('#mainRing',{strokeDashoffset:-100,duration:1.42,ease:'power3.inOut'},6.18);
tl.to('#stem',{y:-185,opacity:0,duration:.72,ease:'power3.in'},6.28);
tl.to('#iconWrap',{scale:.78,rotation:5,opacity:.86,duration:1.2,ease:'power3.inOut'},6.2);
tl.to(world,{scale:.96,y:-28,duration:1.15,ease:'power3.out'},6.68);
tl.to('#iconWrap',{opacity:0,scale:.64,rotation:8,duration:.78,ease:'power2.in'},7.48);

tl.to('#blackout',{opacity:1,duration:.24,ease:'none'},8.78);
tl.to({},{duration:.01},9.99);

const q=new URLSearchParams(location.search);
window.OPENER={
  W,H,DURATION,tl,ready:false,
  seek(t){tl.pause();tl.time(Math.max(0,Math.min(DURATION,t)),false);},
  play(){tl.play();}
};
Promise.resolve(document.fonts?.ready).then(()=>{
  window.OPENER.ready=true;
  if(!q.has('clean')) tl.play(0);
});
tl.eventCallback('onComplete',()=>{if(!q.has('clean')) tl.play(0);});
</script>
</body>
</html>
